<!-- Polyfill window.storage (utilise par soleya - ecrit dans Claude artifact) -->
<script>
  // L'app appelle window.storage.get(key, ...) et window.storage.set(key, value, ...).
  // On replique l'API en s'appuyant sur localStorage du navigateur.
  window.storage = {
    get: function (key) {
      return new Promise(function (resolve) {
        try {
          var v = localStorage.getItem(key);
          resolve(v !== null ? { value: v } : null);
        } catch (e) { resolve(null); }
      });
    },
    set: function (key, value) {
      return new Promise(function (resolve) {
        try { localStorage.setItem(key, value); } catch (e) {}
        resolve();
      });
    }
  };
  // Petit raccourci de debug : window.soleyaReset() vide les donnees locales.
  window.soleyaReset = function () {
    if (confirm("Effacer toutes les donnees Soleya stockees localement ?")) {
      try {
        localStorage.removeItem("soleya-v11");
        localStorage.removeItem("soleya-v7");
        localStorage.removeItem("soleya-gcal-token");
      } catch (e) {}
      location.reload();
    }
  };
</script>

  function waitForGsi() {

        else if (Date.now() - t0 > 10000) reject(new Error("Google Identity Services indisponible. Verifie ta connexion ou desactive les bloqueurs de scripts."));

    tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      // Pas de hosted_domain pour autoriser tout compte Google
      callback: function () {}, // remplace a chaque connect()
      error_callback: function (err) {
        if (!pending) return;
        var p = pending; pending = null;
        var msg = "Connexion Google annulee.";
        if (err) {

    var timeMin = opts.timeMin || new Date(Date.now() - 45 * 24 * 3600 * 1000).toISOString();

  var CALENDRIERS = [
    "primary",
    "1195c7efb634f2e82c164d4195561c3dab6db743d68ca32c1157235590eda934@group.calendar.google.com", // Soleya (reservations, CI/CO, interventions)
    "c_54ed3980ed4fd71624cc1e9850f8bd27cb73119b8c231b72544d3f99f900f334@group.calendar.google.com"  // VILLA ON THE ROCK - Scic Mque (partage, lecture seule)
  ];

  function fetchEvents(opts) {

      });
    })).then(function (listes) {
      var vus = {}, out = [];
      listes.forEach(function (items) {

        });

    connect: connect,
    disconnect: disconnect,
    isConnected: isConnected,
    fetchEvents: fetchEvents,
    deleteEvent: deleteEvent,
    onChange: onChange,
    // Outil de diagnostic pour la console : window.SoleyaGCal.debug()
    debug: function () {
      var t = loadToken();

const { useState, useEffect, useMemo } = React;

// === Helpers Google Calendar ===
function normalizeGEvent(ev){
  const isAllDay = !!(ev.start && ev.start.date && !ev.start.dateTime);
  const startRaw = ev.start && (ev.start.dateTime || ev.start.date);
  const endRaw = ev.end && (ev.end.dateTime || ev.end.date);
  let dateStr = "", time = null, endTime = null, endDateStr = "";
  if(isAllDay){
    dateStr = startRaw;
    // Google all-day events: end.date est exclusif. Pour un sejour CI=05/05 -> CO=10/05,
    // l event est start=2026-05-05 end=2026-05-10. On garde la date "CO" telle quelle.
    if(endRaw) endDateStr = endRaw;
  } else if(startRaw){
    const d = new Date(startRaw);
    dateStr = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    time = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    if(endRaw){
      const de = new Date(endRaw);
      endTime = String(de.getHours()).padStart(2,"0")+":"+String(de.getMinutes()).padStart(2,"0");
      endDateStr = de.getFullYear()+"-"+String(de.getMonth()+1).padStart(2,"0")+"-"+String(de.getDate()).padStart(2,"0");
    }
  }
  return {
    id: ev.id,
    gid: ev.id, // id Google reel : survit au dedoublement CI/CO (cf. expandCICO)
    title: ev.summary || "(sans titre)",
    description: ev.description || "",
    location: ev.location || "",
    dateStr, time, endTime, endDateStr, allDay: isAllDay,
    url: ev.htmlLink || null,
    calendarId: (ev.organizer && ev.organizer.email) || "primary",
    raw: ev
  };
}

// Un evenement "CI/CO Villa X - Client" couvre l'arrivee ET le depart.
// L'app raisonne en deux missions distinctes (cf. REGLES_CICO) et tous ses filtres
// exigent un titre commencant par "CI " ou "CO " : un titre "CI/CO ..." n'est reconnu
// nulle part. On le dedouble donc ici, une fois pour toutes, avant tout traitement :
//   - un evenement CI a la date de debut
//   - un evenement CO a la date de fin (end.date de Google est exclusif -> -1 jour)
// Les evenements deja au format "CI ..." / "CO ..." passent inchanges.
function expandCICO(list){
  const veille = ymd => {
    const d = new Date(ymd + "T12:00:00");
    d.setDate(d.getDate() - 1);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  };
  const out = [];
  (list||[]).forEach(e => {
    const titre = (e.title||"").trim();
    const m = /^ci\s*\/\s*co\b[\s:.\u2014-]*/i.exec(titre);
    if(!m || !e.allDay || !e.endDateStr || e.endDateStr <= e.dateStr){ out.push(e); return; }
    const reste = titre.slice(m[0].length).trim() || "(sans titre)";
    const coDate = veille(e.endDateStr);
    if(coDate <= e.dateStr){ out.push(e); return; } // sejour d'une nuit : on ne dedouble pas
    out.push(Object.assign({}, e, { title: "CI " + reste, endDateStr: coDate }));
    out.push(Object.assign({}, e, { id: e.id + "__co", title: "CO " + reste, dateStr: coDate, endDateStr: coDate }));
  });
  return out;
}

function useGoogleCalendar(enabled){
  const [connected, setConnected] = useState(false);
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  // Sync connection state with module

    if(!enabled){ setConnected(false); setEvents([]); return; }
    const sync = () => setConnected(!!(window.SoleyaGCal && window.SoleyaGCal.isConnected()));

    if(!window.SoleyaGCal) return;
    const off = window.SoleyaGCal.onChange(sync);

  }, [enabled]);

  // Fetch events when connected
  useEffect(() => {
    if(!enabled || !connected){ setEvents([]); return; }

      if(!window.SoleyaGCal) return;
      setLoading(true);

        .then(items => {
          if(cancelled) return;
          const norm = expandCICO((items||[]).map(normalizeGEvent).filter(e => e.dateStr));
          setEvents(norm); setError(null);

        .catch(e => { if(!cancelled) setError(e.message || String(e)); })
        .then(() => { if(!cancelled) setLoading(false); });

  const connect = () => {
    setError(null);
    if(!window.SoleyaGCal){ setError("Module Google indisponible."); return; }
    window.SoleyaGCal.connect()
      .then(() => setConnected(true))
      .catch(e => setError(e.message || String(e)));
  };
  const disconnect = () => {
    if(window.SoleyaGCal) window.SoleyaGCal.disconnect();
    setConnected(false); setEvents([]); setError(null);
  };
  const refresh = () => {
    if(!connected || !window.SoleyaGCal) return;
    setLoading(true);
    window.SoleyaGCal.fetchEvents()
      .then(items => {
        const norm = expandCICO((items||[]).map(normalizeGEvent).filter(e => e.dateStr));
        setEvents(norm); setError(null);
      })
      .catch(e => setError(e.message || String(e)))
      .then(() => setLoading(false));
  };
  // Supprime un evenement Google puis met a jour la liste locale.
  const deleteEvent = (eventId) => {
    if(!window.SoleyaGCal || !window.SoleyaGCal.deleteEvent) return Promise.reject(new Error("Module Google indisponible."));
    // Un evenement peut vivre sur un sous-calendrier (Soleya, SCIC) et/ou etre une moitie
    // dedoublee d'un CI/CO : on retrouve son calendrier et son id Google reels.
    const src = events.find(e => e.id === eventId);
    const gid = (src && src.gid) || eventId;
    return window.SoleyaGCal.deleteEvent(gid, src && src.calendarId).then(() => {
      setEvents(prev => prev.filter(e => e.id !== eventId && e.gid !== gid));
      return true;
    });
  };

  return { connected, events, loading, error, connect, disconnect, refresh, deleteEvent };
}

// Bascule tarifaire : le check-out passe a 35 EUR pour les missions executees a partir du 1er aout 2026.
// Missions anterieures = ancien tarif par personne (eq.tarifCO, 30 par defaut) -> juillet et avant intacts,
// meme si on rouvre le mois. Happy Bay reste a 35 (TARIF_CICO_PHILO) quelle que soit la date.
const CO_NOUVEAU_TARIF_DATE = "2026-08-01";
const CO_NOUVEAU_TARIF = 35;
function tarifCOpourMission(eq,mission){
  if(mission&&mission.villa==="Happy Bay")return TARIF_CICO_PHILO;
  const d=((mission&&mission.date)||"").slice(0,10);
  if(d&&d>=CO_NOUVEAU_TARIF_DATE)return CO_NOUVEAU_TARIF;
  return (eq&&eq.tarifCO)||30;
}

// Systeme generique : chaque villa peut porter sa propre checklist de check-out (zones + points).
// Villa.checklistCheckout = [{id,zone,ordre,points:[{id,libelle,aide,critique}]}]
// Villa.consignesCheckout = string (encart affiche en tete de checklist)
// L'etat coche vit sur la mission : etats[id].checklistEtat = {[pointId]:{coche,cocheLe}} + etats[id].checklistNote
// Generateur d'id unique (edition manuelle cote Johalann)
const clkUid=(p)=>(p||"cl")+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// Construit une checklist a ids deterministes (seed stable, persistee au 1er enregistrement)
function buildChecklistCO(prefix,zones){
  return zones.map((z,zi)=>({
    id:prefix+"-z"+zi,
    zone:z.zone,
    ordre:zi+1,
    points:z.points.map((p,pi)=>({
      id:prefix+"-z"+zi+"-p"+pi,
      libelle:p.l,
      aide:p.a||null,
      critique:!!p.c
    }))
  }));
}

function seedChecklistsCO(villas){
  if(!villas||typeof villas!=="object")return villas;
  let changed=false;const out={...villas};
  Object.keys(CHECKLIST_CO_SEED).forEach(nom=>{
    if(out[nom] && out[nom].checklistCheckout===undefined){
      out[nom]={...out[nom],
        checklistCheckout:CHECKLIST_CO_SEED[nom].checklist,
        consignesCheckout:out[nom].consignesCheckout||CHECKLIST_CO_SEED[nom].consignes};
      changed=true;
    }
  });
  return changed?out:villas;
}

// Numero WhatsApp au format international, sans + ni espaces.
// Martinique : 0696, 0697 et 0596 deviennent 596. Un autre 0 suivi de 9 chiffres est
// traite comme metropolitain (33). Un numero court (3901) ou absent renvoie null.
function waNumero(t){
if(!t)return null;
const str=String(t).trim();const plus=str.charAt(0)==="+";
const d=str.replace(/[^0-9]/g,"");
if(plus)return d.length>=10?d:null;
if(d.length===10&&d.charAt(0)==="0"){
const p=d.slice(0,4);
if(p==="0696"||p==="0697"||p==="0596")return "596"+d.slice(1);
return "33"+d.slice(1);
}
return d.length>=11?d:null;
}

function supaGetSession(){
  try{const raw=localStorage.getItem(SUPA_TOKEN_KEY);if(!raw)return null;
    const t=JSON.parse(raw);if(!t||!t.access_token)return null;return t;}catch(e){return null;}
}
function supaSaveSession(t){try{localStorage.setItem(SUPA_TOKEN_KEY,JSON.stringify(t));}catch(e){}}
function supaClearSession(){try{localStorage.removeItem(SUPA_TOKEN_KEY);}catch(e){}}
function supaSessionValide(t){return !!(t&&t.access_token&&t.expires_at&&Date.now()<t.expires_at-60000);}
async function supaLogin(email,password){
  const r=await fetch(SUPA.url+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA.anon},
    body:JSON.stringify({email:email,password:password})
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error_description||data.msg||data.message||("Echec de connexion ("+r.status+")"));
  const s={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+(data.expires_in||3600)*1000,user_email:(data.user&&data.user.email)||email};
  supaSaveSession(s);return s;
}
async function supaRefreshWith(rt){
  try{
    const r=await fetch(SUPA.url+"/auth/v1/token?grant_type=refresh_token",{
      method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA.anon},
      body:JSON.stringify({refresh_token:rt})
    });
    if(!r.ok){supaClearSession();return null;}
    const data=await r.json();
    const s={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+(data.expires_in||3600)*1000,user_email:(data.user&&data.user.email)||""};
    supaSaveSession(s);return s;
  }catch(e){supaClearSession();return null;}
}
async function supaEnsureSession(){
  let s=supaGetSession();
  if(supaSessionValide(s))return s;
  if(s&&s.refresh_token){const r=await supaRefreshWith(s.refresh_token);if(r)return r;}
  return null;
}
async function edlApi(path,opts){
  opts=opts||{};
  let s=await supaEnsureSession();
  if(!s)throw new Error("AUTH_REQUIRED");
  const headers={"Content-Type":"application/json","apikey":SUPA.anon,"Authorization":"Bearer "+s.access_token,...(opts.headers||{})};
  let r=await fetch(SUPA.url+"/rest/v1"+path,{...opts,headers});
  if(r.status===401){
    // Token rejete : on tente un refresh une fois
    const rt=s&&s.refresh_token;
    if(rt){const ns=await supaRefreshWith(rt);if(ns){s=ns;r=await fetch(SUPA.url+"/rest/v1"+path,{...opts,headers:{...headers,"Authorization":"Bearer "+ns.access_token}});}}
    if(r.status===401){supaClearSession();throw new Error("AUTH_REQUIRED");}
  }
  if(!r.ok){const txt=await r.text();throw new Error("Erreur API ("+r.status+")"+(txt?": "+txt.slice(0,200):""));}
  const txt=await r.text();return txt?JSON.parse(txt):null;
}

// Helper standalone : calcule le tarif suggéré selon la grille
// Retourne { mode, tarif, tauxHoraire } — mode parmi 'horaire'|'forfait'|'forfait_plus_achat'|'libre'
function calculerTarifSuggere(typeCode,prestataire,duree,grilleTarifs){
  if(!grilleTarifs||!grilleTarifs.length)return {mode:'libre',tarif:0,tauxHoraire:0};
  // 1. Tarif spécifique au prestataire (ex: ménage Samantha)
  let entry=grilleTarifs.find(g=>g.type_prestation===typeCode&&g.prestataire===prestataire);
  // 2. Sinon tarif global pour ce type
  if(!entry)entry=grilleTarifs.find(g=>g.type_prestation===typeCode&&!g.prestataire);
  if(!entry)return {mode:'libre',tarif:0,tauxHoraire:0};
  const mode=entry.mode;
  const montant=parseFloat(entry.montant)||0;
  let tarif=0;
  if(mode==='horaire'&&duree&&!isNaN(parseFloat(duree))){
    tarif=Math.round(montant*parseFloat(duree)*100)/100;
  }else if(mode==='forfait'){
    tarif=montant;
  }else if(mode==='forfait_plus_achat'){
    tarif=montant; // 0 par défaut, Johalann ajustera si déplacement
  }
  // mode 'libre' → tarif = 0 (Johalann ajustera systématiquement)
  return {mode,tarif,tauxHoraire:montant};
}
// Calcul du statut "métier" pour persistance Supabase
function statutPourSupa(m,etat){
  const s=etat||{};
  if(s.rapport||(s.manualEdit&&s.manualEdit.validated))return "fait";
  if(s.confirmedBy)return "confirme";
  const ba=Array.isArray(m.backup)?m.backup:(m.backup?[m.backup]:[]);
  if(s.primaryDeclined&&ba.length&&ba.every(b=>s["declined_"+b]))return "non_couvert";
  const esc=s.primaryDeclined||(s.dispatchedAt&&!s.primaryResponse&&Date.now()-s.dispatchedAt>MS_DELAI_REPONSE);
  if(esc)return "escalade";
  if(!s.dispatchedAt)return "non_envoye";
  return "attente";
}
// Conversion mission + etat -> row pour Supabase missions_soleya
function missionToSoleyaRow(m,etat){
  const s=etat||{};
  const rap=s.rapport||null;
  const dateMission=(s.interventionDate||m.date||"").slice(0,10);
  let heureDebut=null,heureFin=null,nbInter=null,heuresTotal=null;
  if(rap){
    heureDebut=rap.heureDebut||null;
    heureFin=rap.heureFin||null;
    nbInter=rap.intervenants||rap.nbIntervenantes||null;
    heuresTotal=rap.heuresTotales||rap.heuresTotal||null;
  }
  if(!heureDebut&&s.interventionTime)heureDebut=s.interventionTime;
  if(!heureDebut&&s.heureDebut)heureDebut=s.heureDebut;
  if(!heureFin&&s.heureFin)heureFin=s.heureFin;
  return {
    id:m.id,
    villa:m.villa||"",
    type:m.type||"Menage",
    date_mission:dateMission||null,
    assignee:s.confirmedBy||null,
    statut:statutPourSupa(m,s),
    heure_debut:heureDebut||null,
    heure_fin:heureFin||null,
    nb_intervenantes:nbInter||null,
    heures_total:heuresTotal||null,
    rapport_data:{
      etat:s,
      mission_meta:{
        client:m.client||null,
        detail:m.detail||null,
        phone:m.phone||null,
        primary:m.primary||null,
        backup:m.backup||null,
        cautionStatus:m.cautionStatus||null,
        cautionAmount:m.cautionAmount||null,
        taxeAirbnb:m.taxeAirbnb||null,
        taxeAmount:m.taxeAmount||null,
        notesSpeciales:m.notesSpeciales||null,
        nextCI:m.nextCI||null
      }
    },
    notes:s.managerNotes||null
  };
}
// Reconstruction mission + etat depuis row Supabase
function soleyaRowToMissionEtat(row){
  const meta=(row.rapport_data&&row.rapport_data.mission_meta)||{};
  const etat=(row.rapport_data&&row.rapport_data.etat)?{...row.rapport_data.etat}:{};
  // Colonnes dédiées = source autoritative (écrasent les valeurs stockées dans rapport_data.etat)
  if(row.assignee)etat.confirmedBy=row.assignee;
  if(row.notes)etat.managerNotes=row.notes;
  if(row.heure_debut&&row.type!=="Menage")etat.interventionTime=row.heure_debut;
  // Mission : on ne met QUE les champs définis (sinon le spread écrase les valeurs existantes avec undefined)
  const mission={
    id:row.id,
    date:(row.date_mission||"").slice(0,10),
    type:row.type,
    villa:row.villa
  };
  if(meta.client)mission.client=meta.client;
  if(meta.detail)mission.detail=meta.detail;
  if(meta.phone)mission.phone=meta.phone;
  if(meta.primary)mission.primary=meta.primary;
  if(meta.backup!==undefined&&meta.backup!==null)mission.backup=meta.backup;
  if(meta.cautionStatus)mission.cautionStatus=meta.cautionStatus;
  if(meta.cautionAmount)mission.cautionAmount=meta.cautionAmount;
  if(meta.taxeAirbnb!==undefined&&meta.taxeAirbnb!==null)mission.taxeAirbnb=meta.taxeAirbnb;
  if(meta.taxeAmount)mission.taxeAmount=meta.taxeAmount;
  if(meta.notesSpeciales)mission.notesSpeciales=meta.notesSpeciales;
  if(meta.nextCI)mission.nextCI=meta.nextCI;
  // Cas ménage démarré sans rapport encore validé : on stocke heure_debut hors rapport
  if(row.type==="Menage"&&row.heure_debut&&!etat.rapport)etat.heureDebut=row.heure_debut;
  return {mission,etat};
}

function edlVillaNom(slug){if(!slug)return "?";return EDL_VILLA_MAP[slug]||(slug.charAt(0).toUpperCase()+slug.slice(1));}
function edlVillaColor(slug){return EDL_VILLA_COLOR[slug]||"#888";}

function edlClientNom(e){return ((e.client_prenom||"")+" "+(e.client_nom||"")).trim()||"(sans nom)";}
function edlMatchResa(edl,resa){
  if(!edl||!resa)return false;
  const villaApp=edlVillaNom(edl.villa_slug);
  if(resa.villa&&villaApp){
    const rv=resa.villa.toLowerCase();const va=villaApp.toLowerCase();
    if(rv!==va&&!rv.includes(va)&&!va.includes(rv))return false;
  }
  if(!edl.date_arrivee||!edl.date_depart||!resa.ciYMD||!resa.coYMD)return false;
  if(edl.date_arrivee>resa.coYMD||edl.date_depart<resa.ciYMD)return false;
  if(resa.client){
    const fullEdl=((edl.client_prenom||"")+" "+(edl.client_nom||"")).trim().toLowerCase();
    const fullResa=(resa.client||"").toLowerCase();
    if(!fullEdl)return true;
    const wordsEdl=fullEdl.split(/\s+/).filter(w=>w.length>=3);
    const wordsResa=fullResa.split(/\s+/).filter(w=>w.length>=3);
    const hasMatch=wordsEdl.some(w=>wordsResa.some(w2=>w2.includes(w)||w.includes(w2)));
    if(!hasMatch)return false;
  }
  return true;
}

const MS_DELAI_REPONSE = 48*60*60*1000; // 48h pour repondre avant escalade vers backup
const fmtDate = d => d ? new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}) : "";
const fmtMois = d => d ? new Date(d+"-15").toLocaleDateString("fr-FR",{month:"long",year:"numeric"}) : "";
const joursEntre = (d1,d2) => Math.round((new Date(d2+"T12:00:00")-new Date(d1+"T12:00:00"))/86400000);
// Decale une date AAAA-MM-JJ de n jours (n negatif = en arriere). Midi pour eviter les sauts d'heure d'ete.
const decalerJours = (d,n) => {const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);
return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const heureMaintenant = () => new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
// Duree ecoulee depuis HH:MM (jour courant) -> "Xh YY" ou "YY min"
const dureeDepuis=(heureHHMM,startedAtMs)=>{
  if(!heureHHMM&&!startedAtMs)return "";
  let totalMin;
  if(startedAtMs){
    totalMin=Math.max(0,Math.floor((Date.now()-startedAtMs)/60000));
  }else{
    const [h,m]=heureHHMM.split(":").map(Number);
    const now=new Date();
    totalMin=now.getHours()*60+now.getMinutes()-(h*60+m);
    if(totalMin<0)totalMin+=24*60;
  }
  const hh=Math.floor(totalMin/60),mm=totalMin%60;
  return hh>0?hh+"h"+String(mm).padStart(2,"0"):mm+" min";
};

// Statut affiche sur la carte : confirme / en_cours / termine (sinon null -> fallback CFG_ST)
function statutAffiche(m,s){
  if(!s)return null;
  // === NEW: option photos via whatsapp === rapport avec photos par WhatsApp non encore validee -> "A valider"
  if(s.rapport&&s.rapport.photosViaWhatsapp&&!(s.manualEdit&&s.manualEdit.validated))return "saisi";
  if(s.rapport)return "termine";
  if(s.manualEdit&&s.manualEdit.validated)return "valide";
  if(m&&m.type==="Menage"&&s.heureDebut){
    if(s.heureFin)return "saisi"; // heures completes saisies, en attente de validation
    return "en_cours";            // demarre, pas encore d'heure de fin
  }
  if(s.confirmedBy)return "confirme";
  return null;
}
const CFG_ST_DERIVE={confirme:{l:"Confirme",bg:"#E8F5E9",c:"#1A6B4A"},en_cours:{l:"En cours",bg:"#FFF4D6",c:"#B7500A"},saisi:{l:"A valider",bg:"#FFF8E6",c:"#B7500A"},valide:{l:"Valide",bg:"#E0EFE6",c:"#1A6B4A"},termine:{l:"Termine",bg:"#E0EFE6",c:"#1A6B4A"}};
// ---- Helpers validation / saisie manuelle des heures ----
// Heure de debut disponible (saisie manuelle, horodatage ou rapport)
function heureDebutDispo(s){return (s&&(s.heureDebut||s.interventionTime))||(s&&s.rapport&&s.rapport.heureDebut)||null;}
// Heure de fin disponible (saisie manuelle ou rapport)
function heureFinDispo(s){return (s&&s.heureFin)||(s&&s.rapport&&s.rapport.heureFin)||null;}
// Y a-t-il des photos (uploadees dans le rapport, ou recues par un autre canal) ?
function aPhotosDispo(s){
  if(!s)return false;
  if(s.manualEdit&&s.manualEdit.photosAutreCanal)return true;
  const ph=s.rapport&&s.rapport.photos;
  return !!(ph&&Object.keys(ph).filter(k=>ph[k]).length>0);
}
// Mission consideree comme validee (rapport technique OU validation manuelle Johalann)
function estValidee(s){
  s=s||{};
  // === NEW: option photos via whatsapp (finalisation menage) ===
  // Un rapport menage finalise avec photos transmises par WhatsApp (pas dans l'app) n'est PAS
  // considere valide tant que Johalann ne l'a pas validee manuellement (attache les preuves).
  if(s.rapport&&s.rapport.photosViaWhatsapp&&!(s.manualEdit&&s.manualEdit.validated))return false;
  return !!(s.rapport||(s.manualEdit&&s.manualEdit.validated));
}
// Une mission entre-t-elle dans le suivi "a valider" ? (prise en charge + date <= aujourd'hui + pas encore validee)
function aValider(m,s){
  s=s||{};
  if(!["CI","CO","Menage"].includes(m.type))return false;
  if(estValidee(s))return false;
  if(!s.confirmedBy)return false;
  const dateEff=(s.interventionDate||m.date||"").slice(0,10);
  if(!dateEff)return false;
  const fin=new Date();fin.setHours(23,59,59,999);
  return new Date(dateEff+"T12:00:00")<=fin;
}
// Drapeaux de ce qui manque + age depuis l'heure prevue (en heures)
function flagsValidation(m,s){
  s=s||{};
  const needsDebut=!heureDebutDispo(s);
  const needsFin=!heureFinDispo(s);
  const needsPhoto=m.type==="Menage"&&!aPhotosDispo(s);
  const dateEff=(s.interventionDate||m.date||"").slice(0,10);
  const heureEff=(s.interventionTime||"12:00").slice(0,5);
  const t=new Date(dateEff+"T"+heureEff+":00").getTime();
  const ageH=isNaN(t)?0:(Date.now()-t)/3600000;
  return {needsDebut,needsFin,needsPhoto,ageH};
}
// === NEW: ecran mon mois ===
// Mission "a finaliser" ce mois : confirmee (confirmedBy), echue (date <= aujourd'hui),
// SANS rapport final (definition litterale validee : on ne compte PAS la validation manuelle
// Johalann comme finalisation -> volontairement different de aValider()/estValidee()).
function aFinaliser(m,s){
  s=s||{};
  if(!s.confirmedBy)return false;      // assignee / confirmee par une fille
  if(s.rapport)return false;           // finalisee = rapport present (litteral)
  const dateEff=(s.interventionDate||m.date||"").slice(0,10);
  if(!dateEff)return false;
  const fin=new Date();fin.setHours(23,59,59,999);
  return new Date(dateEff+"T12:00:00")<=fin; // echue (calque la logique de date d'aValider)
}
// Sous-statut d'une mission a finaliser : "demarrer" (pas commencee) ou "finaliser" (demarree sans rapport).
// Reutilise heureDebutDispo (heureDebut || interventionTime, le cas rapport etant deja exclu par aFinaliser).
function sousStatutFinal(s){return heureDebutDispo(s)?"finaliser":"demarrer";}
// Regroupe les missions par Aujourd hui / A venir / Passees (utilise s.interventionDate si dispo)
function grouperMissions(missions,etats){
  const today=(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
  const aujourdhui=[],aVenir=[],passees=[];
  missions.forEach(m=>{
    const d=(etats&&etats[m.id]&&etats[m.id].interventionDate)||m.date;
    if(d===today)aujourdhui.push(m);
    else if(d>today)aVenir.push(m);
    else passees.push(m);
  });
  aujourdhui.sort((a,b)=>a.date.localeCompare(b.date));
  aVenir.sort((a,b)=>a.date.localeCompare(b.date));
  passees.sort((a,b)=>b.date.localeCompare(a.date));
  return {aujourdhui,aVenir,passees};
}
const dateMaintenant = () => new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"long"});
// === NEW: fix nextCI meme jour === recalcule la fenetre CI->CO des menages a l'affichage, depuis les CI en memoire.
// Necessaire car les missions persistees (Supabase/soleya_state) portent un nextCI FIGE : calcule avant que le CI
// n'existe, ou avec l'ancienne regle "strictement apres" qui ratait le CI du meme jour que le CO. On derive donc
// nextCI (et urgent) au rendu au lieu de faire confiance au champ stocke. Ne modifie QUE les menages (CI/CO intacts).
function ymdAujourdhui(){
const d=new Date();
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function enrichirNextCI(list,all,resas){
const src=all||list;
const cis=src.filter(m=>m.type==="CI");
const cos=src.filter(m=>m.type==="CO");
const rs=Array.isArray(resas)?resas:[];
const today=ymdAujourdhui();
return list.map(m=>{
if(m.type!=="Menage")return m;
const nCI=cis.filter(c=>c.villa===m.villa&&c.date>=m.date).sort((a,b)=>a.date.localeCompare(b.date))[0];
const nextCI=nCI?nCI.date:(m.nextCI||null); // fallback: garde un nextCI manuel si aucun CI en memoire
const j=nextCI?joursEntre(m.date,nextCI):null;
// === Fenetre d intervention ===
// La villa est libre du depart precedent jusqu a la VEILLE de l arrivee. Quand aucun
// depart n est connu (villas en menage seul : elles n ont pas de mission CO), on part
// d aujourd hui. L intervenante choisit sa date dans cette fenetre, elle n est plus
// collee a la veille de l arrivee.
let libreAu=nextCI?decalerJours(nextCI,-1):null;
let libreDu=null;
if(libreAu){
// On part du dernier depart connu : on retient la date de presence client la plus
// tardive, prise sur trois sources, parce qu aucune n est toujours renseignee.
const plusTard=d=>{if(d&&d<=libreAu&&(!libreDu||d>libreDu))libreDu=d;};
// 1. une mission CO de la villa : le client part ce jour-la
cos.filter(c=>c.villa===m.villa).forEach(c=>plusTard(c.date));
// 2. un menage d apres depart tombe par construction le jour du depart. L info est
//    portee par la mission elle-meme : elle survit meme si la mission CO a disparu.
if(typeof m.detail==="string"&&/apr[e\u00e8]s\s*co/i.test(m.detail))plusTard(m.date);
// 3. les reservations : fin de sejour connue meme sans mission CO
rs.filter(r=>r&&r.villa===m.villa).forEach(r=>plusTard(r.coYMD));
// 4. aucune presence client connue : la villa est libre depuis aujourd hui
if(!libreDu)libreDu=today;
if(libreDu<today&&libreAu>=today)libreDu=today;       // on ne propose jamais une date passee
if(libreDu>libreAu)libreDu=m.date<=libreAu?m.date:libreAu; // fenetre deja refermee
}
return {...m,nextCI,libreDu,libreAu,urgent:j!==null?j<=2:m.urgent};
});
}
// villasRef permet de reconnaitre les villas en "menage seul" (v.menageSeul) :
// aucune mission CI/CO n'est creee pour elles, et le menage est une PREPARATION la veille de l'arrivee,
// au lieu du menage classique qui suit le depart.
function construire(evts, villasRef) {
const vx=villasRef||{};
const menageSeul=v=>!!(vx[v]&&vx[v].menageSeul);
const ms=[]; const tries=[...evts].sort((a,b)=>a.date.localeCompare(b.date));
tries.forEach(ev=>{
if(ev.type!=="CI"&&ev.type!=="CO"&&ev.type!=="Menage") return;
if(ev.type==="Menage"){

function extraireClientResa(title){
  if(!title)return"";
  let s=title.replace(/^(reserved by\s*[-:]?\s*|reservation\s*[-:]?\s*|reserve par\s*[-:]?\s*|resa\s*[-:]?\s*|booking\s*[-:]?\s*)/i,"").trim();
  s=s.replace(/\([^)]*\)/g,"").replace(/\d{4}-\d{2}-\d{2}/g,"").trim();
  return s||title;
}
function getResaPhase(ciYMD,coYMD,today){
  if(!ciYMD||!coYMD)return"avenir";
  if(today<ciYMD)return"avenir";
  if(today>=ciYMD&&today<coYMD)return"encours";
  return"postsejour";
}
function dueDateItem(item,ciYMD,coYMD){
  if(item.anchor==="mid"){
    if(!ciYMD||!coYMD)return null;
    const n=joursEntre(ciYMD,coYMD);
    if(n<=0)return null;
    return addDaysYMD(ciYMD,Math.floor(n/2)); // milieu du sejour, arrondi au jour inferieur
  }
  if(item.anchor==="manual"||typeof item.offset!=="number")return null;
  const base=item.anchor==="co"?coYMD:ciYMD;
  if(!base)return null;
  return addDaysYMD(base,item.offset);
}
function getResaProgress(resa){
  const checklist=resa&&resa.checklist;
  const items=checklistItemsResa(resa);
  const total=items.length;
  const done=items.reduce((s,it)=>s+(checklist&&checklist[it.id]?1:0),0);
  return {done,total,pct:total?Math.round(done/total*100):0};
}
function getProchaineAction(resa,today){
  for(const it of checklistItemsResa(resa)){
    if(resa.checklist&&resa.checklist[it.id])continue;
    const due=dueDateItem(it,resa.ciYMD,resa.coYMD);
    let etat="normal";
    if(due){
      if(due<today)etat="retard";
      else if(joursEntre(today,due)<=3)etat="imminent";
    }
    return {item:it,due,etat};
  }
  return null;
}
function extraireClientDepuisDescription(desc){
  if(!desc)return"";
  const lignes=desc.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  // 1. Patterns explicites : "Client: ...", "Nom: ...", "Name: ...", "Reserved by ..."
  for(const ligne of lignes){
    const m=ligne.match(/^(?:client|nom|name|guest|invit[ée]|reserved by|reservation pour|booking)\s*[:\-=]\s*(.+)$/i);
    if(m&&m[1].trim().length>1&&m[1].trim().length<80){
      return m[1].trim().replace(/[<>"']/g,"").trim();
    }
  }
  // 2. Sinon, 1re ligne qui ressemble à un nom (lettres + espaces, peu de chiffres, pas d'arobase)
  for(const ligne of lignes){
    if(ligne.length<2||ligne.length>80)continue;
    if(/@/.test(ligne))continue; // email
    if(/^https?:\/\//i.test(ligne))continue; // url
    const digitsRatio=(ligne.match(/\d/g)||[]).length/ligne.length;
    if(digitsRatio>0.3)continue; // trop de chiffres
    if(/^[\d\s+().\-]+$/.test(ligne))continue; // que des chiffres/ponctuation
    if(/^(check|villa|booking|reservation|info|note)/i.test(ligne))continue; // mots-clés à ignorer
    // OK ça ressemble à un nom
    return ligne.replace(/[<>"']/g,"").trim();
  }
  return"";
}
// Parse les details client/vol depuis un event Google Calendar (titre + description + location).
// Cherche email, telephone, WhatsApp, n° de vol (codes IATA), heure d arrivee.
function parseEventDetails(gEvent){
  if(!gEvent)return{};
  const cleanHtml=s=>String(s||"").replace(/<br\s*\/?>/gi,"\n").replace(/<\/p>/gi,"\n").replace(/<[^>]+>/g," ").replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&").replace(/&lt;/gi,"<").replace(/&gt;/gi,">");
  const desc=cleanHtml(gEvent.description||"");
  const title=gEvent.title||"";
  const blob=title+"\n"+desc+"\n"+(gEvent.location||"");
  // Email
  const emailMatch=blob.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
  const email=emailMatch?emailMatch[0]:"";
  // WhatsApp (mention explicite)
  let whatsapp="";
  const waMatch=blob.match(/(?:whatsapp|wa)\s*[:\-]?\s*((?:\+|00)?[\d\s().\-]{9,25})/i);
  if(waMatch)whatsapp=waMatch[1].replace(/\s+/g," ").trim();
  // Telephones (international ou local, au moins 9 chiffres)
  const phoneMatches=blob.match(/(?:(?:\+|00)\d{1,3}[\s.\-]?)?(?:\(?\d{1,4}\)?[\s.\-]?){2,5}\d{2,4}/g)||[];
  const phones=phoneMatches.map(p=>p.trim()).filter(p=>{
    const digits=p.replace(/[^0-9]/g,"");
    return digits.length>=9&&digits.length<=15;
  });
  // Eviter le n° de vol (ex "AF607") en filtrant les patterns purement courts
  const phone=phones[0]||"";
  if(!whatsapp)whatsapp=phone;
  // N° de vol : code IATA (2-3 lettres MAJUSCULES) + 1-4 chiffres, avec ou sans espace
  let flightNumber="";
  // Cherche d abord avec mot-cle "vol" ou "flight"
  const flightCtx=blob.match(/(?:vol|flight|n°\s*vol|num[ée]ro\s*de\s*vol)\s*[:\-]?\s*([A-Z]{2,3})\s?(\d{1,4})/i);
  if(flightCtx){flightNumber=flightCtx[1].toUpperCase()+flightCtx[2];}
  else{
    const flightMatch=blob.match(/\b([A-Z]{2,3})\s?(\d{2,4})\b/);
    if(flightMatch&&!/^(WHA|MMS|VAT|TVA|SARL|EURO|EUR|USD|GBP|TGV)$/i.test(flightMatch[1])){
      flightNumber=flightMatch[1]+flightMatch[2];
    }
  }
  // Heure arrivee : 14h30, 14:30, 14h
  let arrivalTime="";
  const timeCtx=blob.match(/(?:arriv[ée]e|landing|atterr|heure)\s*[:\-]?\s*(\d{1,2})[h:](\d{0,2})/i);
  const timeAny=blob.match(/\b(\d{1,2})[h:](\d{2})\b/);
  const tm=timeCtx||timeAny;
  if(tm){
    const h=String(tm[1]).padStart(2,"0");
    const m=(tm[2]||"00").padEnd(2,"0").slice(0,2);
    if(parseInt(h)<=23&&parseInt(m)<=59)arrivalTime=h+":"+m;
  }
  const client=extraireClientDepuisDescription(desc)||extraireClientResa(title);
  return {client,email,phone,whatsapp,flightNumber,arrivalTime};
}

function buildResas(gEvents,reservations,villas){
  if(!Array.isArray(gEvents))return[];
  // 1. Tous les CO de l'agenda, indexés (pour les rechercher après chaque CI)
  const cosParVilla={};
  gEvents.forEach(e=>{
    if(!e.allDay||!e.dateStr)return;
    const titre=(e.title||"").trim();
    if(!/^co\s/i.test(titre))return;
    const villa=detecterVillaResa(titre,e.location,villas);
    if(!villa)return;
    if(!cosParVilla[villa])cosParVilla[villa]=[];
    cosParVilla[villa].push({date:e.dateStr,event:e});
  });
  // Trier les CO par date pour chaque villa
  Object.keys(cosParVilla).forEach(v=>cosParVilla[v].sort((a,b)=>a.date.localeCompare(b.date)));

  // 2. Construire les réservations à partir des CI
  return gEvents
    .filter(e=>{
      if(!e.allDay||!e.dateStr||!e.endDateStr||e.endDateStr<=e.dateStr)return false;
      const titre=(e.title||"").trim();
      // Une réservation = un événement dont le titre commence par "CI " (case-insensitive)
      return /^ci\s/i.test(titre);
    })
    .map(e=>{
      const override=reservations[e.id]||{};
      const parsed=parseEventDetails(e);
      const ciYMD=override.ciOverride||e.dateStr;
      const villa=override.villa||detecterVillaResa(e.title,e.location,villas);
      // 2.B Chercher le CO correspondant : 1er CO de la même villa dont la date > ciYMD
      let coYMD=override.coOverride||"";
      if(!coYMD&&villa&&cosParVilla[villa]){
        const coTrouve=cosParVilla[villa].find(co=>co.date>ciYMD);
        if(coTrouve)coYMD=coTrouve.date;
      }
      // Fallback : si vraiment rien trouvé, utiliser endDateStr de l'événement CI
      if(!coYMD)coYMD=e.endDateStr;
      // override = "" (champ vidé volontairement) > parsed > ""
      const pick=(o,p)=>o!==undefined&&o!==null?o:(p||"");
      return {
        id:e.id,
        gEvent:e,
        cle:override.cle||"",
        ciYMD,coYMD,
        villa,
        client:pick(override.client,parsed.client),
        firstName:override.firstName||"",
        lastName:override.lastName||"",
        email:pick(override.email,parsed.email),
        whatsapp:pick(override.whatsapp,parsed.whatsapp),
        phone:pick(override.phone,parsed.phone),
        arrivalTime:pick(override.arrivalTime,parsed.arrivalTime),
        flightNumber:pick(override.flightNumber,parsed.flightNumber),
        cautionMode:override.cautionMode||"swikly",
        cautionAmount:override.cautionAmount||(CAUTIONS[villa]||""),
        // === NEW: Defaut 2 — gestion & suivi caution ===
        typeCaution:override.typeCaution||typeCautionFromMode(override.cautionMode),
        cautionMoyen:override.cautionMoyen||override.cautionMode||"",
        cautionRestituee:!!override.cautionRestituee,
        cautionDateRestitution:override.cautionDateRestitution||"",
        // === NEW: champs facturation resa === (stockes dans l'override, meme mecanisme que caution)
        taxeAmount:override.taxeAmount||"",
        taxeAirbnb:!!override.taxeAirbnb,
        ciFacture:override.ciFacture!==undefined?override.ciFacture:true,
        coFacture:override.coFacture!==undefined?override.coFacture:true,
        // === NEW: Defaut 1 — accueil realise (choix du forfait) + facturer ce sejour au proprio ===
        // Retrocompat : accueilRealise herite de ciFacture ; factureProprio herite de coFacture.
        accueilRealise:override.accueilRealise!==undefined?override.accueilRealise:(override.ciFacture!==undefined?override.ciFacture:true),
        factureProprio:override.factureProprio!==undefined?override.factureProprio:(override.coFacture!==undefined?override.coFacture:true),
        notes:override.notes||"",
        noteEquipe:override.noteEquipe||"", // note saisie par Johalann, destinee a lequipe terrain
        checklist:override.checklist||{},
        ignored:!!override.ignored,
        archived:!!override.archived, // === NEW: Feature archiver résas === (masquage manuel, reversible, garde la resa pour stats)
        parsed,
        raw:override,
      };
    })
    .filter(r=>!r.ignored)
    .sort((a,b)=>a.ciYMD.localeCompare(b.ciYMD));
}

// =============== INFOS RESERVATION DANS LES MISSIONS ===============
// Retrouve la reservation correspondant a une mission.
// CI -> la resa dont le check-in tombe ce jour-la sur cette villa.
// CO et Menage -> la resa dont le check-out tombe ce jour-la sur cette villa.
function resaPourMission(m,resas){
  if(!m||!Array.isArray(resas))return null;
  const t=(m.type||"").toUpperCase();
  const cle=t==="CI"?"ciYMD":"coYMD";
  return resas.find(r=>r.villa===m.villa&&r[cle]===m.date)||null;
}
// Vrai si plusieurs resas tombent sur la meme villa a la meme date (avertissement discret).
function resasMultiplesPourMission(m,resas){
  if(!m||!Array.isArray(resas))return false;
  const t=(m.type||"").toUpperCase();
  const cle=t==="CI"?"ciYMD":"coYMD";
  return resas.filter(r=>r.villa===m.villa&&r[cle]===m.date).length>1;
}
// Vue "intervenante" d'une reservation : uniquement les champs terrain.
// Les champs de facturation (ciFacture, coFacture, accueilRealise, factureProprio, forfaits)
// ne sont JAMAIS recopies ici — ils ne doivent pas descendre jusqu'aux intervenantes.
// Champs devines depuis la description de l evenement Google par parseEventDetails.
// Ils n existent que dans la session de Johalann tant qu on ne les a pas recopies dans reservations[id].
const CHAMPS_RESA_PARSES=["client","phone","whatsapp","email","arrivalTime","flightNumber"];
const CHAMPS_RESA_TERRAIN=["id","cle","villa","ciYMD","coYMD","client","firstName","lastName","email","phone","whatsapp","arrivalTime","flightNumber","typeCaution","cautionAmount","cautionMoyen","cautionRestituee","taxeAmount","taxeAirbnb","notes","noteEquipe"];
function resasTerrain(resas){
  if(!Array.isArray(resas))return[];
  return resas.filter(r=>r&&r.villa&&!r.archived).map(r=>{
    const o={};CHAMPS_RESA_TERRAIN.forEach(k=>{if(r[k]!==undefined&&r[k]!==null&&r[k]!=="")o[k]=r[k];});
    // buildResas applique des valeurs par defaut (typeCaution "soleya", montant CAUTIONS[villa]) :
    // on garde donc trace de ce que Johalann a REELLEMENT saisi, pour ne pas afficher une alerte
    // rouge sur une resa dont la caution na jamais ete renseignee.
    const raw=r.raw||{};
    o.cautionConfiguree=!!(raw.typeCaution||raw.cautionMode||raw.cautionAmount);
    o.taxeConfiguree=!!(raw.taxeAmount||raw.taxeAirbnb);
    return o;
  });
}
// Nombre de voyageurs devine depuis les notes libres de la resa ("4 voyageurs", "pax 6", "3 adultes"...).
function voyageursDepuisNotes(notes){
  const s=(notes||"").toString();
  if(!s)return "";
  let m=s.match(/(\d{1,2})\s*(?:voyageur|personne|adulte|pax|invit|guest)/i);
  if(!m)m=s.match(/(?:voyageur|personne|adulte|pax|invit|guest)[a-z]*\s*[:=]?\s*(\d{1,2})/i);
  const n=m?parseInt(m[1],10):0;
  return n>0&&n<40?String(n):"";
}
// Lien WhatsApp a partir d'un numero libre : on ne garde que les chiffres.
function lienWhatsapp(num){
  const d=(num||"").toString().replace(/\D/g,"");
  return d.length>=6?"https://wa.me/"+d:"";
}

// Reconstruit une liste de resas a partir des seuls overrides persistes dans soleya_state.
// Depuis le correctif "persistance ciYMD/coYMD" (cron alertes), reservations[id] contient deja
// villa + dates CI/CO : c'est suffisant pour rattacher une mission a sa resa SANS acces Google.
// Les champs devines depuis la description de l evenement Google (telephone, WhatsApp, mail, heure,
// vol) y sont recopies par la session de Johalann (voir l effet dans App) : tout vit au meme endroit.
function resasDepuisOverrides(reservations){
  const src=(reservations&&typeof reservations==="object")?reservations:{};
  const out=[];
  Object.keys(src).forEach(id=>{
    const o=src[id]||{};
    if(o.ignored||o.archived)return;
    if(!o.villa||(!o.ciYMD&&!o.coYMD))return;
    out.push({
      id,cle:o.cle||"",villa:o.villa,ciYMD:o.ciYMD||"",coYMD:o.coYMD||"",
      client:o.client||"",firstName:o.firstName||"",lastName:o.lastName||"",
      email:o.email||"",phone:o.phone||"",whatsapp:o.whatsapp||"",
      arrivalTime:o.arrivalTime||"",flightNumber:o.flightNumber||"",
      typeCaution:o.typeCaution||(o.cautionMode?typeCautionFromMode(o.cautionMode):""),
      cautionAmount:o.cautionAmount||"",
      cautionMoyen:o.cautionMoyen||o.cautionMode||"",
      cautionRestituee:!!o.cautionRestituee,
      cautionConfiguree:!!(o.typeCaution||o.cautionMode||o.cautionAmount),
      taxeAmount:o.taxeAmount||"",
      taxeAirbnb:!!o.taxeAirbnb,
      taxeConfiguree:!!(o.taxeAmount||o.taxeAirbnb),
      notes:o.notes||"",
      noteEquipe:o.noteEquipe||"",
    });
  });
  return out;
}
// Liste des personnes sollicitees par un appel ouvert (mission envoyee a plusieurs,
// sans hierarchie : la premiere qui repond oui prend la mission).
function candidatsMission(m){
if(!m||!m.ouvert)return [];
return Array.isArray(m.candidats)?m.candidats.filter(Boolean):[];
}
function getStatut(m,etats) {
const s=etats[m.id]||{};
if(s.confirmedBy) return "confirme";
// Appel ouvert : pas de titulaire, pas d escalade. Tant que tout le monde n a pas
// refuse, la mission est simplement en attente d une reponse.
const ca=candidatsMission(m);
if(ca.length){
if(ca.every(c=>s["declined_"+c])) return "non_couvert";
if(!s.dispatchedAt) return "non_envoye";
// Personne n a refuse, mais personne n a pris non plus : passe le delai, la mission
// remonte en alerte. Sans ca, un appel ouvert que tout le monde ignore resterait
// silencieusement "en attente" jusqu au jour J.
if(Date.now()-s.dispatchedAt>MS_DELAI_REPONSE) return "escalade";
return "attente";
}
const ba=Array.isArray(m.backup)?m.backup:(m.backup?[m.backup]:[]);
if(s.primaryDeclined&&ba.every(b=>s["declined_"+b])) return "non_couvert";
const esc=s.primaryDeclined||(s.dispatchedAt&&!s.primaryResponse&&Date.now()-s.dispatchedAt>MS_DELAI_REPONSE);
if(esc) return "escalade";
if(!s.dispatchedAt) return "non_envoye";
return "attente";
}
// Titulaire financier d'une mission : celle qui l'a realisee.
// Fallback sur primary tant que personne n'a confirme (retrocompat missions juillet sans confirmedBy).
function titulaireMission(m,etats){
const c=etats&&etats[m.id]&&etats[m.id].confirmedBy;
if(c)return c;
// Sur un appel ouvert personne n est titulaire tant que personne n a repondu oui.
return (m&&m.ouvert)?null:((m&&m.primary)||null);
}
function peutRepondre(m,s,user,statut) {
if(user==="johalann"||statut==="confirme") return false;
// Appel ouvert : tout le monde peut repondre des l envoi, tant que personne n a pris.
const ca=candidatsMission(m);
if(ca.length) return ca.includes(user)&&!!s.dispatchedAt&&!s["declined_"+user];
if(user===m.primary) return !!s.dispatchedAt&&!s.primaryResponse;
const ba=Array.isArray(m.backup)?m.backup:(m.backup?[m.backup]:[]);
return ba.includes(user)&&statut==="escalade"&&!s["declined_"+user]&&!s.confirmedBy;
}
async function compresserPhoto(file) {
return new Promise(resolve=>{
const r=new FileReader();
r.onload=e=>{
const img=new window.Image();
img.onload=()=>{
const canvas=document.createElement("canvas");
const max=600;const ratio=Math.min(max/img.width,max/img.height);
canvas.width=img.width*ratio;canvas.height=img.height*ratio;
canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
resolve(canvas.toDataURL("image/jpeg",0.55));
};img.src=e.target.result;
};r.readAsDataURL(file);
});
}

// === NEW: ecran alertes ===
// Tableau de bord "points a traiter" cote Johalann uniquement. LECTURE SEULE : aucune ecriture Supabase.
// Chaque regle est recalculee a chaque rendu -> une alerte disparait des que sa condition n'est plus vraie.
// ===== Interrupteur d'alerte voyageurs =====
// Un seul message, visible par tous les clients en sejour. Pas d'automatisme :
// une alerte fausse est pire qu'une absence d'alerte.
const ALERTE_NIVEAUX=[
  {k:"jaune", lab:"Jaune",  bg:"#FEF3C7", bord:"#F0C040", txt:"#7A5B00"},
  {k:"orange",lab:"Orange", bg:"#FFE4CC", bord:"#F08C2E", txt:"#8A4A00"},
  {k:"rouge", lab:"Rouge",  bg:"#FEE2E2", bord:"#E05252", txt:"#8A1C1C"},
  {k:"info",  lab:"Info",   bg:"#E0F2F1", bord:"#2E8B7A", txt:"#0E4A42"}
];
function AlerteVoyageurs({alerte,onAlerte,resas}){
  const a=alerte||{actif:false,niveau:"jaune",texte:"",maj:null};
  const [ouvert,setOuvert]=React.useState(false);
  const [txt,setTxt]=React.useState(a.texte||"");
  const [niv,setNiv]=React.useState(a.niveau||"jaune");
  React.useEffect(()=>{setTxt(a.texte||"");setNiv(a.niveau||"jaune");},[a.texte,a.niveau]);
  const N=ALERTE_NIVEAUX.find(x=>x.k===(a.actif?a.niveau:niv))||ALERTE_NIVEAUX[0];
  const activer=()=>{
    if(!txt.trim())return;
    onAlerte&&onAlerte({actif:true,niveau:niv,texte:txt.trim(),maj:new Date().toISOString()});
    setOuvert(false);
  };
  const couper=()=>onAlerte&&onAlerte({actif:false,niveau:niv,texte:txt.trim(),maj:new Date().toISOString()});
  // Le bandeau s'affiche a ceux qui rouvrent le compagnon ou le livret d'accueil.
  // Pour une info qui ne peut pas attendre (couvre-feu, route coupee), c'est
  // WhatsApp qui pousse : un lien pre-rempli par client en sejour, zero copier-coller.
  const aujAl=todayYMD();
  const enSejour=(Array.isArray(resas)?resas:[]).filter(r=>
    !r.archived&&r.ciYMD&&r.coYMD&&r.ciYMD<=aujAl&&r.coYMD>=aujAl);
  const lienWA=r=>{
    const num=waNumero(r.whatsapp||r.phone);
    if(!num)return null;
    const prenom=(r.firstName||String(r.client||"").trim().split(" ")[0]||"").trim();
    const intro=a.niveau==="rouge"?"information importante de Soleya Conciergerie :"
      :a.niveau==="orange"?"information de Soleya Conciergerie :"
      :"un message de Soleya Conciergerie :";
    const corps=(prenom?("Bonjour "+prenom+", "):"Bonjour, ")+intro+"\n\n"+(a.texte||"");
    return "https://wa.me/"+num+"?text="+encodeURIComponent(corps);
  };
  return (
  <div style={{background:a.actif?N.bg:"#fff",border:"1px solid "+(a.actif?N.bord:"#E3EBE8"),
    borderRadius:14,padding:"13px 15px",marginBottom:14}}>
    <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <div style={{fontSize:"0.68rem",letterSpacing:"1px",textTransform:"uppercase",

// ===== Evenements voyageurs =====
// Meme canal que l'alerte : Johalann saisit ici, le compagnon de sejour lit via
// l'Edge Function "alerte-publique". Aucun fichier a reuploader, aucune cle cote public.
// Un evenement n'apparait au client que s'il tombe pendant son sejour.
function paquesDate(an){
  // Meeus/Jones/Butcher. Sert a dater le Carnaval tout seul, chaque annee,
  // sans que personne ait a le ressaisir.
  const a=an%19,b=Math.floor(an/100),c=an%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4;
  const l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const mois=Math.floor((h+l-7*m+114)/31),jour=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(an,mois-1,jour));
}
const evYMD=d=>d.toISOString().slice(0,10);
const evDecale=(d,n)=>new Date(d.getTime()+n*86400000);
// Carnaval : dimanche gras (J-49) au mercredi des Cendres (J-46).
function evCarnaval(an){const p=paquesDate(an);return {debut:evYMD(evDecale(p,-49)),fin:evYMD(evDecale(p,-46))};}
function evFixe(an,md1,md2){return {debut:an+"-"+md1,fin:an+"-"+(md2||md1)};}
// Pour un modele du catalogue : la prochaine occurrence a venir (cette annee, sinon l'an prochain).
function evProchaine(modele){
  const auj=todayYMD(), an=new Date().getFullYear();
  for(const y of [an,an+1]){
    const d=modele.dates?modele.dates(y):null;
    if(d&&d.fin>=auj)return d;
  }
  return {debut:"",fin:""};
}
const EV_MOIS=["janv.","févr.","mars","avril","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function evEtiquette(debut,fin){
  if(!debut)return "";
  const [a1,m1,j1]=debut.split("-"), [a2,m2,j2]=(fin||debut).split("-");
  const n=s=>String(parseInt(s,10));
  if(debut===fin||!fin)return n(j1)+" "+EV_MOIS[+m1-1]+" "+a1;
  if(a1===a2&&m1===m2)return n(j1)+"–"+n(j2)+" "+EV_MOIS[+m1-1]+" "+a1;
  if(a1===a2)return n(j1)+" "+EV_MOIS[+m1-1]+" – "+n(j2)+" "+EV_MOIS[+m2-1]+" "+a1;
  return n(j1)+" "+EV_MOIS[+m1-1]+" "+a1+" – "+n(j2)+" "+EV_MOIS[+m2-1]+" "+a2;
}

// un clic suffit. Tout reste modifiable ensuite, et rien ne part sans validation.

function VueAlertes({missions,etats,equipe,villas,anomalies,gcal,reservations,setVuePage,setModule,alerte,onAlerte,evenements,onEvenements,resasApp}){
const today=todayYMD();
const now=Date.now();
const nomFille=id=>(equipe&&equipe[id]&&equipe[id].nom)||id||"—";

// 1. Menages sans heures : menage confirme, echu (date hier ou avant), sans heure debut ou fin.
const menagesSansHeures=missions.filter(m=>{
if(m.type!=="Menage")return false;
if(getStatut(m,etats)!=="confirme")return false;
const s=etats[m.id]||{};
const dateEff=(s.interventionDate||m.date||"").slice(0,10);
if(!dateEff||dateEff>=today)return false;
return !heureDebutDispo(s)||!heureFinDispo(s);
});

// 2. Missions non confirmees > 48h : dispatchees (statut attente) envoyees il y a plus de 48h.
const H48=48*3600*1000;
const nonConfirmees=missions.filter(m=>{
if(getStatut(m,etats)!=="attente")return false;
const s=etats[m.id]||{};
return s.dispatchedAt&&(now-s.dispatchedAt>H48);
});

// 3 & 4. Etapes client / cautions : parcours RESA_CHECKLIST sur les resas actives (CO recent ou a venir).
const resas=buildResas((gcal&&gcal.events)||[],reservations||{},villas);
const resasActives=resas.filter(r=>r.coYMD&&r.coYMD>=addDaysYMD(today,-14));
const etapesRetard=[];
const cautionsRetard=[];
resasActives.forEach(r=>{
RESA_CHECKLIST.forEach(it=>{
if(it.anchor==="manual")return;               // exclut les items sans echeance
if(!itemVisibleResa(it,r))return;             // exclut les items hors perimetre (ex: mi-sejour < 8 nuits)
if(r.checklist&&r.checklist[it.id])return;     // deja coche
const due=dueDateItem(it,r.ciYMD,r.coYMD);
if(!due||due>today)return;                      // echeance non atteinte
if(it.id==="cautionRecue"){
cautionsRetard.push({resa:r,due,avantCI:joursEntre(today,r.ciYMD)});
}else{
etapesRetard.push({resa:r,item:it,due,retard:joursEntre(due,today)});
}
});
});
etapesRetard.sort((a,b)=>b.retard-a.retard);
cautionsRetard.sort((a,b)=>a.avantCI-b.avantCI);

// === NEW: Defaut 2 — cautions Soleya a restituer (risque juridique) ===
// Cautions gerees par Soleya, non restituees, dont le CO est passe. Recalcule a chaque rendu.
const cautionsARestituer=resas
.filter(r=>r.typeCaution==="soleya"&&!r.cautionRestituee&&r.coYMD&&r.coYMD<today)
.map(r=>({resa:r,depuis:joursEntre(r.coYMD,today)}))
.sort((a,b)=>b.depuis-a.depuis);

// 5. Anomalies non traitees > 10 jours : statut != resolu, signalee il y a plus de 10 jours.
const anomaliesVieilles=(anomalies||[]).filter(a=>a.status!=="done"&&a.date&&joursEntre(a.date,today)>10)
.map(a=>({...a,age:joursEntre(a.date,today)})).sort((a,b)=>b.age-a.age);

const total=menagesSansHeures.length+nonConfirmees.length+etapesRetard.length+cautionsRetard.length+cautionsARestituer.length+anomaliesVieilles.length;

// --- styles / helpers de rendu ---
const carte={background:"white",borderRadius:13,padding:"13px",marginBottom:12,boxShadow:"0 1px 6px rgba(0,0,0,0.06)"};
const ligne=(accent,bg)=>({display:"flex",alignItems:"center",gap:8,padding:"9px 11px",background:bg||C.fond,borderRadius:9,marginBottom:6,cursor:"pointer",borderLeft:"3px solid "+accent});
const badge=(n,c)=><span style={{background:n?c:"#E8F5E9",color:n?"white":"#1A6B4A",fontWeight:800,fontSize:"0.7rem",borderRadius:20,padding:"2px 9px",minWidth:20,textAlign:"center"}}>{n}</span>;
const vide=<div style={{fontSize:"0.75rem",color:"#1A6B4A",padding:"4px 2px"}}>✅ Rien à signaler</div>;
const section=(emoji,titre,count,accent,rows)=>(
<div style={carte}>
<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:count?10:0}}>
<span style={{fontSize:"1rem"}}>{emoji}</span>
<span style={{fontWeight:800,fontSize:"0.82rem",color:C.sombre,flex:1}}>{titre}</span>
{badge(count,accent)}
</div>

// Helper d'affichage de durée
function formatDuree(h){
  if(h==null||isNaN(h))return "";
  const heures=Math.floor(h);
  const minutes=Math.round((h-heures)*60);
  if(heures&&minutes)return heures+"h"+(minutes<10?"0":"")+minutes;
  if(heures)return heures+"h";
  return minutes+"min";
}

);
}

// Zone de validation manager (Johalann) — intégrée dans VueManager
function ZoneValidationPrestations({prestations,setPrestations,villas,equipe,notifier}){
const [ouvert,setOuvert]=useState(true);
const [showAll,setShowAll]=useState(false);
const [ajustementOuvert,setAjustementOuvert]=useState(null);
const [nouveauTarif,setNouveauTarif]=useState("");
const [motifAjustement,setMotifAjustement]=useState("");
const enAttente=prestations.filter(p=>p.statut==="en_attente")
  .slice().sort((a,b)=>(a.created_at||"").localeCompare(b.created_at||""));
const autres=prestations.filter(p=>p.statut!=="en_attente")
  .slice().sort((a,b)=>(b.validated_at||b.created_at||"").localeCompare(a.validated_at||a.created_at||""));
const liste=showAll?[...enAttente,...autres]:enAttente;
const valider=async(p)=>{
  const patch={statut:"valide",validated_at:new Date().toISOString(),validated_by:"johalann"};
  const ok=await prestationsAnnexesPatch(p.id,patch);
  if(!ok){notifier("Erreur : "+(window.__lastPrestaError||"inconnue"),false);return;}
  setPrestations(prev=>prev.map(x=>x.id===p.id?{...x,...patch}:x));
  notifier("Prestation validée !");
};
const ouvrirAjustement=(p)=>{
  setAjustementOuvert(p.id);
  setNouveauTarif(String(p.tarif_suggere!=null?p.tarif_suggere:(p.tarif||0)));
  setMotifAjustement("");
};
const validerAvecAjustement=async(p)=>{
  const tarifNum=parseFloat(nouveauTarif);
  if(isNaN(tarifNum)||tarifNum<0){notifier("Tarif invalide",false);return;}
  const motif=(motifAjustement||"").trim();
  if(!motif){notifier("Motif obligatoire pour ajuster",false);return;}
  const patch={
    statut:"valide",
    tarif:tarifNum,
    tarif_ajuste_par:"johalann",
    motif_ajustement:motif,
    validated_at:new Date().toISOString(),
    validated_by:"johalann"
  };
  const ok=await prestationsAnnexesPatch(p.id,patch);
  if(!ok){notifier("Erreur : "+(window.__lastPrestaError||"inconnue"),false);return;}
  setPrestations(prev=>prev.map(x=>x.id===p.id?{...x,...patch}:x));
  setAjustementOuvert(null);setNouveauTarif("");setMotifAjustement("");
  notifier("Prestation validée avec ajustement");
};
// === NEW: marqueur facturable proprio === Johalann coche/decoche au moment de la validation
const toggleFacturableProprio=async(p)=>{
  const nv=!p.facturable_proprio;
  const ok=await prestationsAnnexesPatch(p.id,{facturable_proprio:nv});
  if(!ok){notifier("Erreur : "+(window.__lastPrestaError||"inconnue"),false);return;}
  setPrestations(prev=>prev.map(x=>x.id===p.id?{...x,facturable_proprio:nv}:x));
  notifier(nv?"Marquée « à facturer au propriétaire »":"Retirée de la facturation proprio");
};
const refuser=async(p)=>{
  const raison=(prompt("Raison du refus (obligatoire) :")||"").trim();
  if(!raison)return;
  const patch={statut:"refuse",note_refus:raison,validated_at:new Date().toISOString(),validated_by:"johalann"};
  const ok=await prestationsAnnexesPatch(p.id,patch);
  if(!ok){notifier("Erreur : "+(window.__lastPrestaError||"inconnue"),false);return;}
  setPrestations(prev=>prev.map(x=>x.id===p.id?{...x,...patch}:x));
  notifier("Prestation refusée.");
};
return (
<div style={{background:"white",borderRadius:13,padding:"13px",marginBottom:12,boxShadow:"0 1px 6px rgba(0,0,0,0.06)",borderLeft:"4px solid "+(enAttente.length?"#F0C765":"#EEE")}}>
<button onClick={()=>setOuvert(!ouvert)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",background:"none",border:"none",cursor:"pointer",padding:0}}>
<div style={{fontWeight:800,fontSize:"0.88rem",color:C.sombre}}>🔔 Prestations à valider ({enAttente.length})</div>
<span style={{color:"#CCC",fontSize:"1rem"}}>{ouvert?"-":"+"}</span>
</button>
{ouvert&&<div style={{marginTop:10}}>
<div style={{display:"flex",gap:6,marginBottom:10}}>
<button onClick={()=>setShowAll(false)} style={{flex:1,padding:"7px",background:!showAll?C.sombre:"#F5F5F5",color:!showAll?"white":"#666",border:"none",borderRadius:8,fontWeight:700,fontSize:"0.72rem",cursor:"pointer"}}>En attente ({enAttente.length})</button>
<button onClick={()=>setShowAll(true)} style={{flex:1,padding:"7px",background:showAll?C.sombre:"#F5F5F5",color:showAll?"white":"#666",border:"none",borderRadius:8,fontWeight:700,fontSize:"0.72rem",cursor:"pointer"}}>Voir toutes ({prestations.length})</button>
</div>
{!liste.length&&<div style={{textAlign:"center",color:"#999",fontSize:"0.78rem",padding:"14px 6px"}}>Aucune prestation {showAll?"":"en attente"}.</div>}
{liste.map(p=>{
  const t=typePrestation(p.type);
  const label=p.type==="autre"?("Autre - "+(p.type_autre_libelle||"")):(t?t.label:p.type);
  const eq=equipe[p.prestataire]||{nom:p.prestataire,couleur:"#888",lettre:(p.prestataire||"?").charAt(0).toUpperCase()};
  const stCfg=p.statut==="valide"
    ?{bg:"#E8F8F0",bord:"#9FE1CB",coul:"#0F6E56",emoji:"✅",txt:"Validée"}
    :p.statut==="refuse"
    ?{bg:"#FFEBEE",bord:"#F5B7B1",coul:"#922B21",emoji:"❌",txt:"Refusée"}
    :{bg:"#FFF8E1",bord:"#F0C765",coul:"#7A5B00",emoji:"⏳",txt:"En attente"};
  const aChiffre=p.duree_heures!=null||p.montant_achat!=null;
  return <div key={p.id} style={{borderTop:"0.5px solid #F0F0F0",padding:"10px 0"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:5}}>
      <div style={{display:"flex",alignItems:"center",gap:8,flex:1,minWidth:0}}>
        <div style={{width:24,height:24,borderRadius:6,background:eq.couleur,color:"white",fontWeight:800,fontSize:"0.7rem",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{eq.lettre}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:"0.78rem",fontWeight:800,color:C.sombre,lineHeight:1.3}}>{label}</div>
          <div style={{fontSize:"0.66rem",color:"#888",marginTop:1}}>{eq.nom} · {p.date_execution}{p.villa?" · "+p.villa:""}</div>
        </div>
      </div>
      <div style={{background:stCfg.bg,color:stCfg.coul,padding:"3px 8px",borderRadius:10,fontSize:"0.6rem",fontWeight:800,whiteSpace:"nowrap"}}>{stCfg.emoji} {stCfg.txt}</div>

+(caution?"\nCaution : "+cautionStr:"")
+(mission.taxeAmount||mission.taxeAirbnb?"\nTaxe de sejour : "+taxeStr:"")
+(rapport.note?"\n\nObservation : "+rapport.note:"")
+"\n\nBonne journee,\nSoleya Conciergerie";

const etat=nonConf===0?"Logement laisse propre et conforme.":"Quelques points signales (voir rapport).";
const lingeTotal=Object.values(rapport.linge||{}).reduce((s,v)=>s+v,0);
msg="Bonjour,\n\nCheck-out "+mission.villa+" effectue le "+dateMaintenant()+"."
+(mission.client?"\n\nDepart : "+mission.client:"")
+"\n\n"+etat
+(lingeTotal>0?"\nLinge recupere : "+lingeTotal+" pieces.":"")
+(rapport.note?"\n\nObservation : "+rapport.note:"")
+"\n\nBonne journee,\nSoleya Conciergerie";
}
if(!msg) return null;
if(!v.waProprio) return (

WA Proprio — {mission.villa}

// === NEW: ecran mon mois ===
// Bloc affiche en haut de l'onglet Missions.
// - equipeMode=false (fille) : synthese de SES missions du mois (missions = mesMissions).
// - equipeMode=true (Johalann) : meme logique agregee par fille (missions = toutes les missions).
function BlocMonMois({user,missions,etats,equipe,villas,prestationsAnnexes,setModule,equipeMode}){
  const now=new Date();
  const moisCourant=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const typeMod=m=>m.type==="CI"?"ci":m.type==="CO"?"co":"menage";
  const dateEff=m=>((etats[m.id]&&etats[m.id].interventionDate)||m.date||"");
  const labelMois=ym=>{const p=(ym||"").split("-");return new Date(+p[0],+p[1]-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});};
  // Mois selectionnable = tous les mois presents dans les missions + le mois courant, du plus recent au plus ancien.
  const moisDispo=(()=>{const s=new Set((missions||[]).map(m=>dateEff(m).slice(0,7)).filter(Boolean));s.add(moisCourant);return [...s].sort().reverse();})();
  const [moisSel,setMoisSel]=useState(moisCourant);
  const [open,setOpen]=useState({cico:false,men:false,frais:false});
  const [copied,setCopied]=useState(false);
  const msMois=(missions||[]).filter(m=>dateEff(m).slice(0,7)===moisSel);
  // Partition titulaire : en mode intervenante on ne compte QUE ses propres missions ;
  // en mode Johalann (equipeMode) on garde la vue equipe complete.
  const mesMs   = equipeMode ? msMois : msMois.filter(m=>titulaireMission(m,etats)===user);
  const equipeMs= equipeMode ? []     : msMois.filter(m=>titulaireMission(m,etats)!==user);
  const baseMs  = equipeMode ? msMois : mesMs;
  const finalisees=baseMs.filter(m=>!!(etats[m.id]&&etats[m.id].rapport)).length;
  const aFin=baseMs.filter(m=>aFinaliser(m,etats[m.id])).sort((a,b)=>dateEff(a).localeCompare(dateEff(b)));
  const SS={demarrer:{l:"A demarrer",bg:"#FFF4D6",c:"#B7500A"},finaliser:{l:"A finaliser",bg:"#FDECEA",c:"#B03A2E"}};
  const cadre={background:C.creme,borderRadius:16,padding:"14px 14px 12px",marginBottom:14,border:"1px solid #EFE4C8"};
  const stat=(v,l,col)=>(<div style={{flex:1,minWidth:100,background:"white",borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
    <div style={{fontSize:"1.3rem",fontWeight:800,color:col}}>{v}</div>
    <div style={{fontSize:"0.6rem",color:"#999",textTransform:"uppercase",letterSpacing:0.5}}>{l}</div></div>);
  const ligne=(m)=>{const s=etats[m.id]||{};const ss=SS[sousStatutFinal(s)];const vc=villas[m.villa]?.couleur||"#888";return(
    <div key={m.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"white",border:"1px solid #F0EAE0",borderRadius:10,marginBottom:6}}>
      <div style={{width:8,height:8,borderRadius:"50%",background:vc,flexShrink:0}}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:700,fontSize:"0.78rem",color:C.sombre,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{m.villa}{m.type!=="Menage"?" · "+m.type:""}</div>
        <div style={{fontSize:"0.66rem",color:"#999"}}>{fmtDate(dateEff(m))}</div>
      </div>
      <span style={{background:ss.bg,color:ss.c,padding:"2px 8px",borderRadius:20,fontSize:"0.62rem",fontWeight:800,whiteSpace:"nowrap"}}>{ss.l}</span>
      <button onClick={()=>setModule({id:m.id,type:typeMod(m)})} style={{padding:"6px 12px",border:"none",borderRadius:8,background:C.sombre,color:"white",fontWeight:700,fontSize:"0.7rem",cursor:"pointer",whiteSpace:"nowrap"}}>Ouvrir</button>
    </div>);};
  const header=(<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
    <div style={{fontFamily:"'Playfair Display',serif",fontSize:"1.05rem",color:C.sombre}}>{equipeMode?"🌸 Recap equipe":"📊 Mon mois"}</div>
    <select value={moisSel} onChange={e=>setMoisSel(e.target.value)} style={{padding:"5px 9px",border:"1.5px solid #E6D9B8",borderRadius:8,fontSize:"0.7rem",fontWeight:700,color:C.sombre,background:"white",outline:"none",textTransform:"capitalize",cursor:"pointer"}}>
      {moisDispo.map(ym=><option key={ym} value={ym}>{labelMois(ym)}</option>)}
    </select></div>);
  // ===== Couche financiere (montants derives des taux parametres, jamais saisis a la main) =====
  const eur=n=>Number(n||0).toFixed(2).replace(".",",")+" €";
  const fmtH=h=>{const r=Math.round((h||0)*10)/10;return (Number.isInteger(r)?String(r):String(r).replace(".",","))+"h";};
  // Heures reelles d'un menage (rapport / saisie manuelle / interventionTime) x nb intervenantes si duo. null si absentes.
  const heuresMission=(s)=>{const hd=heureDebutDispo(s),hf=heureFinDispo(s);if(!hd||!hf)return null;
    const d=hd.split(":").map(Number),f=hf.split(":").map(Number);const hh=(f[0]*60+f[1]-d[0]*60-d[1])/60;
    if(!(hh>0))return null;const inter=(s.rapport&&s.rapport.intervenants)||s.intervenants||1;return hh*(inter>1?inter:1);};
  // Detail chiffre d'une mission. Un taux 0/absent => "tarif non defini", ligne exclue du total (jamais de 0 EUR muet).
  const detailMission=(m,eq)=>{const s=etats[m.id]||{};const fin=!!(s.rapport);
    const kind=m.type==="CI"?"ci":m.type==="CO"?"co":"menage";
    let montant=null,defini=false,h=null,taux=null,note=null;
    if(kind==="ci"){taux=m.villa==="Happy Bay"?TARIF_CICO_PHILO:Number((eq&&eq.tarifCI)||0);
      if(taux>0){montant=taux;defini=true;}else note="tarif non defini";}
    else if(kind==="co"){const t=tarifCOpourMission(eq,m);if(t>0){montant=t;taux=t;defini=true;}else note="tarif non defini";}
    else{taux=Number((eq&&eq.tarifMenage)||0);h=heuresMission(s);
      if(!(taux>0))note="tarif non defini";else if(h==null)note="heures non saisies";else{montant=h*taux;defini=true;}}
    return {m,fin,kind,montant,defini,h,taux,note};};
  const ligneMontant=(r)=>(<div key={r.m.id} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 0",borderTop:"1px solid #F5F0E6"}}>
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontWeight:700,fontSize:"0.72rem",color:C.sombre,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.m.villa}{r.kind!=="menage"?" · "+r.m.type:""}{r.kind==="menage"&&r.h!=null?" · "+fmtH(r.h):""}{r.kind==="menage"&&r.taux>0?" × "+r.taux+"€/h":""}</div>
      <div style={{fontSize:"0.62rem",color:"#999"}}>{fmtDate(dateEff(r.m))}{r.fin?"":" · ⏳ en attente"}</div>
    </div>
    <div style={{fontWeight:700,fontSize:"0.74rem",color:r.defini?C.sombre:"#B03A2E",whiteSpace:"nowrap"}}>{r.defini?eur(r.montant):r.note}</div>
  </div>);
  const sousBloc=(key,titre,sousTotal,rows)=>(<div style={{background:"white",borderRadius:10,marginBottom:8,border:"1px solid #F0EAE0",overflow:"hidden"}}>
    <button onClick={()=>setOpen(o=>({...o,[key]:!o[key]}))} style={{width:"100%",display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:"none",border:"none",cursor:"pointer",textAlign:"left"}}>
      <span style={{fontSize:"0.7rem",color:"#BBB",display:"inline-block",transform:open[key]?"rotate(90deg)":"none",transition:"transform .15s"}}>▶</span>
      <span style={{fontWeight:800,fontSize:"0.76rem",color:C.sombre,flex:1}}>{titre}</span>
      <span style={{fontWeight:800,fontSize:"0.82rem",color:C.sombre}}>{eur(sousTotal)}</span>
    </button>
    {open[key]&&<div style={{padding:"0 12px 8px"}}>{rows}</div>}
  </div>);
  // ---------- Mode Johalann : recap financier par fille ----------
  if(equipeMode){
    const parFille={};
    aFin.forEach(m=>{const f=titulaireMission(m,etats);if(!f)return;(parFille[f]=parFille[f]||[]).push(m);});
    const filles=Object.keys(parFille).sort((a,b)=>parFille[b].length-parFille[a].length);
    // Montants du mois par fille : missions finalisees + prestations annexes validees.
    const money={};let totalAtt=0;
    msMois.forEach(m=>{const f=titulaireMission(m,etats);if(!f||!equipe[f])return;const d=detailMission(m,equipe[f]);
      if(!d.defini)return;if(d.fin)money[f]=(money[f]||0)+d.montant;else totalAtt+=d.montant;});
    (prestationsAnnexes||[]).filter(p=>p.statut==="valide"&&p.date_execution&&p.date_execution.slice(0,7)===moisSel)
      .forEach(p=>{const f=p.prestataire;if(!equipe[f])return;money[f]=(money[f]||0)+(parseFloat(p.tarif)||0)+(parseFloat(p.montant_achat)||0);});
    const totalEquipe=Object.values(money).reduce((s,v)=>s+v,0);
    const fillesMoney=Object.keys(money).sort((a,b)=>money[b]-money[a]);
    return(<div style={cadre}>{header}
      {(fillesMoney.length>0||totalEquipe>0)&&<div style={{marginBottom:12}}>
        <div style={{background:C.sombre,borderRadius:12,padding:"11px 13px",display:"flex",alignItems:"center",marginBottom:8,color:"white"}}>
          <div><div style={{fontSize:"0.58rem",opacity:0.75,textTransform:"uppercase",letterSpacing:0.8}}>Total equipe · finalise</div>
            <div style={{fontSize:"1.4rem",fontWeight:800,lineHeight:1.1}}>{eur(totalEquipe)}</div></div>
          {totalAtt>0&&<div style={{marginLeft:"auto",textAlign:"right",fontSize:"0.64rem",color:C.or,fontWeight:700}}>⏳ {eur(totalAtt)}<br/>en attente</div>}
        </div>
        {fillesMoney.map(f=>(<div key={f} style={{display:"flex",alignItems:"center",padding:"7px 10px",background:"white",border:"1px solid #F0EAE0",borderRadius:9,marginBottom:5}}>
          <span style={{width:9,height:9,borderRadius:"50%",background:equipe[f]?.couleur||"#888",marginRight:8,flexShrink:0}}/>
          <span style={{fontWeight:700,fontSize:"0.76rem",color:C.sombre,flex:1}}>{equipe[f]?.nom||f}</span>
          <span style={{fontWeight:800,fontSize:"0.8rem",color:C.sombre}}>{eur(money[f])}</span>
        </div>))}
      </div>}
      <div style={{display:"flex",gap:8,marginBottom:aFin.length?12:0,flexWrap:"wrap"}}>
        {stat(msMois.length,"Missions du mois",C.sombre)}{stat(finalisees,"Finalisees","#1A6B4A")}{stat(aFin.length,"A finaliser",aFin.length?"#B03A2E":"#1A6B4A")}</div>
      {aFin.length===0
        ?<div style={{textAlign:"center",padding:"6px",color:"#1A6B4A",fontWeight:700,fontSize:"0.8rem"}}>✅ Toute l'equipe est a jour ce mois-ci</div>
        :filles.map(f=>(<div key={f} style={{marginBottom:10}}>
          <div style={{fontWeight:800,fontSize:"0.74rem",color:C.sombre,margin:"2px 0 6px"}}>{(equipe[f]?.nom)||f} · <span style={{color:"#B03A2E"}}>{parFille[f].length} a finaliser</span></div>
          {parFille[f].map(ligne)}</div>))}
    </div>);
  }
  // ---------- Mode intervenante : total du mois + detail deroulant ----------
  const eqMoi=equipe[user]||null;
  const rows=mesMs.map(m=>detailMission(m,eqMoi));
  const cicoR=rows.filter(r=>r.kind!=="menage").sort((a,b)=>dateEff(a.m).localeCompare(dateEff(b.m)));
  const menR=rows.filter(r=>r.kind==="menage").sort((a,b)=>dateEff(a.m).localeCompare(dateEff(b.m)));
  const stCico=cicoR.filter(r=>r.fin&&r.defini).reduce((s,r)=>s+r.montant,0);
  const stMen=menR.filter(r=>r.fin&&r.defini).reduce((s,r)=>s+r.montant,0);
  const totAtt=rows.filter(r=>!r.fin&&r.defini).reduce((s,r)=>s+r.montant,0);
  const fraisMois=(prestationsAnnexes||[]).filter(p=>p.prestataire===user&&p.statut==="valide"&&p.date_execution&&p.date_execution.slice(0,7)===moisSel).sort((a,b)=>a.date_execution.localeCompare(b.date_execution));
  const fraisTotal=fraisMois.reduce((s,p)=>s+(parseFloat(p.tarif)||0)+(parseFloat(p.montant_achat)||0),0);
  const totalDuMois=stCico+stMen+fraisTotal;
  const nbCico=cicoR.filter(r=>r.fin&&r.defini).length;
  const hMenFin=menR.filter(r=>r.fin&&r.defini).reduce((s,r)=>s+r.h,0);
  const copierRecap=()=>{let t="Recap "+labelMois(moisSel)+" — "+((eqMoi&&eqMoi.nom)||"")+"\n";
    t+="CI/CO : "+nbCico+" mission"+(nbCico>1?"s":"")+" — "+eur(stCico)+"\n";
    t+="Menages : "+fmtH(hMenFin)+" — "+eur(stMen)+"\n";
    if(fraisTotal>0)t+="Frais : "+eur(fraisTotal)+"\n";
    t+="TOTAL : "+eur(totalDuMois);
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1800);}).catch(()=>{});};
  return(<div style={cadre}>{header}
    <div style={{background:C.sombre,borderRadius:14,padding:"14px 12px",textAlign:"center",marginBottom:12,color:"white"}}>
      <div style={{fontSize:"0.6rem",letterSpacing:1,opacity:0.75,textTransform:"uppercase"}}>Total du mois</div>
      <div style={{fontSize:"2rem",fontWeight:800,lineHeight:1.15,margin:"2px 0"}}>{eur(totalDuMois)}</div>
      {totAtt>0&&<div style={{fontSize:"0.72rem",color:C.or,fontWeight:700}}>⏳ {eur(totAtt)} en attente de validation</div>}

    {sousBloc("men","Menages et prestations",stMen,menR.length?menR.map(ligneMontant):<div style={{fontSize:"0.68rem",color:"#AAA",padding:"6px 0"}}>Aucun menage ce mois-ci.</div>)}
    {fraisMois.length>0&&sousBloc("frais","Deplacements et frais",fraisTotal,fraisMois.map(p=>(
      <div key={p.id} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 0",borderTop:"1px solid #F5F0E6"}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:"0.72rem",color:C.sombre,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.villa||p.lieu||"Frais"}</div>
          <div style={{fontSize:"0.62rem",color:"#999"}}>{fmtDate(p.date_execution)}</div>
        </div>
