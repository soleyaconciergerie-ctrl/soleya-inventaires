function VueGrilleTarifs({grilleTarifs,setGrilleTarifs,equipe,notifier}){
const [editingId,setEditingId]=useState(null);
const [newValue,setNewValue]=useState("");
// Grouper par type_prestation, dans l'ordre TYPES_PRESTATION
const grouped=useMemo(()=>{
  const g={};
  grilleTarifs.forEach(t=>{
    if(!g[t.type_prestation])g[t.type_prestation]=[];
    g[t.type_prestation].push(t);
  });
  return g;
},[grilleTarifs]);
const sauverTarif=async(id,val)=>{
  const num=parseFloat(val);
  if(isNaN(num)||num<0){notifier("Tarif invalide",false);return;}
  const ok=await grilleTarifsUpdate(id,num);
  if(!ok){notifier("Erreur enregistrement",false);return;}
  setGrilleTarifs(prev=>prev.map(t=>t.id===id?{...t,montant:num}:t));
  setEditingId(null);setNewValue("");
  notifier("Tarif mis à jour");
};
const modeBadge=(mode)=>{
  const cfg={
    horaire:{bg:"#1A6B4A11",col:"#1A6B4A",txt:"€/h"},
    forfait:{bg:"#1A527611",col:"#1A5276",txt:"Forfait"},
    forfait_plus_achat:{bg:"#92760011",col:"#927600",txt:"Forfait + Achat"},
    libre:{bg:"#5B2C6F11",col:"#5B2C6F",txt:"Libre"}
  }[mode]||{bg:"#88811",col:"#888",txt:mode};
  return <span style={{background:cfg.bg,color:cfg.col,padding:"2px 7px",borderRadius:8,fontSize:"0.6rem",fontWeight:800,textTransform:"uppercase"}}>{cfg.txt}</span>;
};
if(!grilleTarifs.length)return <div style={{textAlign:"center",padding:"30px 0",color:"#999",fontSize:"0.85rem"}}>Grille tarifaire non chargée. Recharge la page.</div>;
return (
<div>
<div style={{fontSize:"0.7rem",color:"#888",marginBottom:12,fontStyle:"italic"}}>
  Cette grille s'applique automatiquement aux nouvelles prestations déclarées. Pour les ménages, le tarif peut varier selon la prestataire. Les modes "Libre" et "Forfait + Achat" permettent à Johalann d'ajuster à la validation.
</div>
{TYPES_PRESTATION.map(tp=>{
  const lignes=grouped[tp.code]||[];
  if(!lignes.length)return null;
  // Trier : globales d'abord, puis par prestataire
  const sorted=lignes.slice().sort((a,b)=>{
    if(!a.prestataire&&b.prestataire)return -1;
    if(a.prestataire&&!b.prestataire)return 1;
    return (a.prestataire||"").localeCompare(b.prestataire||"");
  });
  return <div key={tp.code} style={{background:"white",borderRadius:12,padding:"12px 14px",marginBottom:10,boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
      <div style={{fontWeight:800,fontSize:"0.84rem",color:C.sombre,flex:1}}>{tp.label}</div>
      {sorted[0]&&modeBadge(sorted[0].mode)}
    </div>
    {sorted.map(l=>{
      const eq=l.prestataire?equipe[l.prestataire]:null;
      const lib=l.prestataire?(eq?.nom||l.prestataire):"Tous prestataires";
      const isEditing=editingId===l.id;
      return <div key={l.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderTop:"0.5px solid #F5F5F5"}}>
        {eq&&<div style={{width:22,height:22,borderRadius:5,background:eq.couleur,color:"white",fontWeight:800,fontSize:"0.68rem",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{eq.lettre}</div>}
        {!eq&&<div style={{width:22,height:22,borderRadius:5,background:"#EEE",color:"#888",fontWeight:800,fontSize:"0.68rem",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>∗</div>}
        <div style={{flex:1,fontSize:"0.74rem",color:C.sombre,fontWeight:600}}>{lib}</div>
        {isEditing?<>
          <input type="number" step="0.01" min="0" value={newValue} onChange={e=>setNewValue(e.target.value)} autoFocus style={{width:80,padding:"5px 7px",border:"1.5px solid #DDD",borderRadius:6,fontSize:"0.78rem",textAlign:"right"}}/>
          <span style={{fontSize:"0.72rem",color:"#888"}}>{l.mode==="horaire"?"€/h":"€"}</span>
          <button onClick={()=>sauverTarif(l.id,newValue)} style={{padding:"5px 9px",background:C.vert,color:"white",border:"none",borderRadius:6,fontWeight:700,fontSize:"0.7rem",cursor:"pointer"}}>OK</button>
          <button onClick={()=>{setEditingId(null);setNewValue("");}} style={{padding:"5px 9px",background:"#F5F5F5",color:"#666",border:"none",borderRadius:6,fontWeight:700,fontSize:"0.7rem",cursor:"pointer"}}>×</button>
        </>:<>
          <div style={{fontSize:"0.84rem",fontWeight:800,color:C.sombre}}>
            {l.mode==="libre"?"—":(l.montant!=null?Number(l.montant).toFixed(2)+(l.mode==="horaire"?" €/h":" €"):"—")}
          </div>
          {l.mode!=="libre"&&<button onClick={()=>{setEditingId(l.id);setNewValue(String(l.montant||0));}} style={{padding:"4px 8px",background:"#F5F5F5",border:"none",borderRadius:6,fontWeight:700,fontSize:"0.68rem",color:C.sombre,cursor:"pointer"}}>✏️</button>}
        </>}
      </div>;
    })}
  </div>;
})}
</div>
);
}

// === NEW: edition forfaits proprio (brique 2) === admin Johalann
// Édite forfait_complet / forfait_sans_accueil de chaque villa. Aucun calcul de facturation ici.
function VueForfaitsVilla({forfaitsVilla,setForfaitsVilla,notifier}){
const [editing,setEditing]=useState(null); // {id,champ} ou null
const [newValue,setNewValue]=useState("");
const CHAMPS=[["forfait_complet","Forfait complet (€)"],["forfait_sans_accueil","Forfait sans accueil (€)"]];
const sauver=async(id,champ,val)=>{
  const brut=(val||"").trim();
  let montant;
  if(brut===""){
    // Vide autorisé uniquement pour le forfait sans accueil (nullable)
    if(champ==="forfait_complet"){notifier("Forfait complet requis",false);return;}
    montant=null;
  }else{
    const num=parseFloat(brut);
    if(isNaN(num)||num<0){notifier("Montant invalide",false);return;}
    montant=num;
  }
  const ok=await forfaitsVillaUpdate(id,champ,montant);
  if(!ok){notifier("Erreur enregistrement",false);return;}
  setForfaitsVilla(prev=>prev.map(f=>f.id===id?{...f,[champ]:montant}:f));
  setEditing(null);setNewValue("");
  notifier("Forfait mis à jour");
};
if(!forfaitsVilla.length)return null;
const sorted=forfaitsVilla.slice().sort((a,b)=>(a.villa||"").localeCompare(b.villa||""));
return (
<div style={{marginTop:22}}>
<div style={{fontWeight:800,fontSize:"0.9rem",color:C.sombre,marginBottom:6}}>💶 Forfaits proprio par villa</div>
<div style={{fontSize:"0.7rem",color:"#888",marginBottom:12,fontStyle:"italic"}}>
  Montants facturés au propriétaire par villa. Modifiables ici pour gérer les augmentations futures.
</div>
{sorted.map(f=>(
<div key={f.id} style={{background:"white",borderRadius:12,padding:"12px 14px",marginBottom:10,boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:f.mode==="forfait"?8:0}}>
    <div style={{fontWeight:800,fontSize:"0.84rem",color:C.sombre,flex:1}}>{f.villa}</div>
    {f.mode==="a_la_ligne"&&<span style={{background:"#92760011",color:"#927600",padding:"2px 7px",borderRadius:8,fontSize:"0.6rem",fontWeight:800,textTransform:"uppercase"}}>à la ligne</span>}
  </div>
  {f.mode==="forfait"&&CHAMPS.map(([champ,label])=>{
    const isEditing=editing&&editing.id===f.id&&editing.champ===champ;
    const val=f[champ];
    return <div key={champ} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderTop:"0.5px solid #F5F5F5"}}>
      <div style={{flex:1,fontSize:"0.74rem",color:C.sombre,fontWeight:600}}>{label}</div>
      {isEditing?<>
        <input type="number" step="0.01" min="0" value={newValue} onChange={e=>setNewValue(e.target.value)} autoFocus style={{width:80,padding:"5px 7px",border:"1.5px solid #DDD",borderRadius:6,fontSize:"0.78rem",textAlign:"right"}}/>
        <span style={{fontSize:"0.72rem",color:"#888"}}>€</span>
        <button onClick={()=>sauver(f.id,champ,newValue)} style={{padding:"5px 9px",background:C.vert,color:"white",border:"none",borderRadius:6,fontWeight:700,fontSize:"0.7rem",cursor:"pointer"}}>OK</button>
        <button onClick={()=>{setEditing(null);setNewValue("");}} style={{padding:"5px 9px",background:"#F5F5F5",color:"#666",border:"none",borderRadius:6,fontWeight:700,fontSize:"0.7rem",cursor:"pointer"}}>×</button>
      </>:<>
        <div style={{fontSize:"0.84rem",fontWeight:800,color:val!=null?C.sombre:"#BBB"}}>{val!=null?Number(val).toFixed(2)+" €":"—"}</div>
        <button onClick={()=>{setEditing({id:f.id,champ});setNewValue(val!=null?String(val):"");}} style={{padding:"4px 8px",background:"#F5F5F5",border:"none",borderRadius:6,fontWeight:700,fontSize:"0.68rem",color:C.sombre,cursor:"pointer"}}>✏️</button>
      </>}
    </div>;

</div>))}

);

// Onglet ISOLÉ, lecture seule. Calcule les FORFAITS SECS proprio par villa pour un mois.
// Règle : forfait facturé au mois du CI (date d'arrivée). Un séjour = un forfait (sauf exclusion explicite).
//  - factureProprio === false       -> séjour exclu (aucun forfait)
//  - accueilRealise === true         -> forfait_complet de la villa
//  - accueilRealise === false        -> forfait_sans_accueil de la villa
// Ignore les villas mode 'a_la_ligne' (Blackstone), affichées à part sans chiffrage.
// Frais de gestion caution : uniquement si typeCaution === 'soleya'.
// === NEW: frais caution (brique 4b) === ancienne grille par montant (fallback historique, conservee pour reference)
const FRAIS_CAUTION={1500:40,2000:50};
// === NEW: Defaut 3 — parametrage villa (stocke sur l'objet villa, blob JSON, zero migration) ===
// Valeurs par defaut (spec) utilisees quand la fiche villa ne les a pas encore renseignees.
const TARIF_REFACT_DEFAUT=35;                     // €/h refacture au proprio
const FRAIS_CAUTION_DEFAUT={"On The Rock":50,"Lili":40,"Mae":40,"Nature Paradise":50}; // Happy Bay/Blackstone : a saisir
const COEF_REFACT_DEFAUT=1;                        // refacturation achats : proprio = cout × coef
// Taux horaire refacture proprio pour une villa (fiche villa > defaut).
function villaTarifRefact(v){const x=v&&v.tarifRefactHoraire;return (x!=null&&x!=="")?Number(x):TARIF_REFACT_DEFAUT;}
// Frais de gestion caution factures au proprio (fiche villa > defaut spec). undefined => a verifier.
function villaFraisCaution(v,nom){const x=v&&v.fraisCaution;if(x!=null&&x!=="")return Number(x);return FRAIS_CAUTION_DEFAUT[nom];}
// === NEW: Defaut 3 — deux montants d'une prestation (coutPrestataire vs prixProprio) ===
// Ne stocke rien : derive tout des donnees existantes (heures, tarif paye, montant achat, taux equipe/villa).
function calcMontantsPresta(p,equipe,villas){
  const tp=typePrestation(p.type);
  const villa=villas&&villas[p.villa];
  const tauxRefact=villaTarifRefact(villa);
  const person=equipe&&equipe[p.prestataire];
  let cout,proprio,base;
  if(tp&&tp.hasDuree&&p.duree_heures){
    const h=Number(p.duree_heures);
    // Cout = ce qui est reellement paye a l'intervenante (tarif valide, aligne sur l'onglet Equipe) ;
    // fallback = heures × taux menage de la personne.
    cout=(p.tarif!=null&&p.tarif!=="")?Number(p.tarif):h*Number((person&&person.tarifMenage)||0);
    proprio=h*tauxRefact;
    base="horaire";
  }else if(tp&&tp.hasAchat&&p.montant_achat!=null){
    cout=Number(p.montant_achat);
    proprio=cout*COEF_REFACT_DEFAUT;   // avance de frais refacturee (coef par defaut 1)
    base="refacturation";
  }else{
    cout=Number(p.tarif||0);
    proprio=cout;                       // forfait/libre sans prix proprio distinct -> marge nulle -> badge
    base="forfait";
  }
  const marge=proprio-cout;
  const margePct=proprio>0?(marge/proprio*100):0;
  return {cout,proprio,marge,margePct,base};
}
function VueFactProprio({gcal,reservations,villas,equipe,forfaitsVilla,prestationsAnnexes,ajoutsManuels,setAjoutsManuels}){

(forfaitsVilla||[]).forEach(f=>{forfaitByVilla[f.villa]=f;});

  if(type==="complet"){

  if(r.taxeAmount>0&&!r.taxeAirbnb&&!masque("taxe:"+r.villa)){

  if(r.typeCaution==="soleya"&&!masque("caution:"+r.villa)){

  }
});

// Elles s'ADDITIONNENT au total de la villa. Une presta peut concerner une villa sans sejour forfait ce mois :

(ajoutsManuels||[]).filter(a=>a.mois===mois&&a.villa&&!(a.detail&&a.detail.indexOf(MASK_PREFIX)===0)).forEach(a=>{

  rows.push(["","TOTAL GÉNÉRAL","",mois,"",totalGeneral,""]);
  const body=rows.map(r=>r.map((c,i)=>i>=4?csvNum(c):csvCell(c)).join(";")).join("\r\n");
  const blob=new Blob(["﻿"+body],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="facturation-proprio-"+mois+".csv";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};
return <div>
<div style={{display:"flex",gap:8,marginBottom:14}}>
<input type="month" value={mois} onChange={e=>setMois(e.target.value)} style={{flex:1,padding:"8px 10px",border:"1.5px solid #EEE",borderRadius:9,fontSize:"0.82rem",outline:"none"}}/>

</div>

</div>
{rien&&<div style={{textAlign:"center",padding:"30px 0",color:"#CCC",fontSize:"0.85rem"}}>Aucun séjour facturable pour ce mois</div>}
{lignes.map(l=>{

      {/* === NEW: ajouts manuels facturation === badge villa a la ligne (Blackstone) */}
      {l.aLaLigne&&<span style={{background:"#92760011",color:"#927600",padding:"2px 7px",borderRadius:8,fontSize:"0.58rem",fontWeight:800,textTransform:"uppercase"}}>à la ligne</span>}
      {/* === NEW: frais caution (brique 4b) === */}
      {l.cautionAVerifier&&<span style={{background:"#92760011",color:"#927600",padding:"2px 7px",borderRadius:8,fontSize:"0.58rem",fontWeight:800,textTransform:"uppercase"}}>⚠️ caution à vérifier</span>}
      {/* === NEW: Defaut 3 === au moins une prestation refacturée à marge nulle/négative */}
      {l.margeAlerte&&<span style={{background:"#922B2111",color:"#922B21",padding:"2px 7px",borderRadius:8,fontSize:"0.58rem",fontWeight:800,textTransform:"uppercase"}}>⚠️ marge nulle</span>}
      <div style={{marginLeft:"auto",fontWeight:800,fontSize:"1.1rem",color:C.sombre}}>{eur(l.total)}</div>

      <div style={{background:"#1A527611",borderRadius:8,padding:"7px",textAlign:"center"}}>

        <div style={{fontSize:"0.58rem",color:"#1A5276"}}>{pc!=null?eur(pc)+" / séjour":"tarif complet non défini"}</div>
      </div>

      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <div style={{fontSize:"0.72rem",color:"#1A6B4A",fontWeight:600}}>Prestation : {pr.label}{pr.heures?<span style={{color:"#AAA",fontWeight:400}}> · {pr.heures}h</span>:null}<span style={{color:"#AAA",fontWeight:400}}> · {pr.date}</span></div>
        <div style={{marginLeft:"auto",fontSize:"0.82rem",fontWeight:800,color:"#1A6B4A"}}>+{eur(pr.proprio)}</div>
        {pr.id&&<BoutonX onClick={()=>masquer(l.villa,"presta:"+pr.id)}/>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3,fontSize:"0.62rem",color:"#999",paddingLeft:2}}>
        <span>coût {eur(pr.cout)}</span>

        {perte
          ?<span style={{background:"#922B2111",color:"#922B21",padding:"1px 6px",borderRadius:7,fontWeight:800,textTransform:"uppercase"}}>⚠️ marge {eur(pr.marge)} — refacturé à perte</span>
          :<span style={{color:"#0F6E56",fontWeight:700}}>marge {eur(pr.marge)} ({Math.round(pr.margePct)}%)</span>}

    </div>;})}
    {/* === NEW: ajouts manuels facturation === lignes libres + suppression + formulaire d'ajout */}
    {l.ajouts&&l.ajouts.map(a=>(
    <div key={a.id} style={{display:"flex",alignItems:"center",gap:8,marginTop:8,paddingTop:8,borderTop:"0.5px solid #F0F0F0"}}>

    </div>))}
    {openVilla===l.villa
    ?<div style={{marginTop:8,paddingTop:8,borderTop:"0.5px solid #F0F0F0",display:"flex",flexDirection:"column",gap:6}}>
      <input value={nvDetail} onChange={e=>setNvDetail(e.target.value)} placeholder="Détail (ex: Réparation volet)" autoFocus style={{padding:"7px 9px",border:"1.5px solid #EEE",borderRadius:8,fontSize:"0.78rem",outline:"none",boxSizing:"border-box"}}/>
      <div style={{display:"flex",gap:6}}>
        <input type="number" step="0.01" value={nvMontant} onChange={e=>setNvMontant(e.target.value)} placeholder="Montant €" style={{width:110,padding:"7px 9px",border:"1.5px solid #EEE",borderRadius:8,fontSize:"0.78rem",outline:"none",textAlign:"right"}}/>
        <button onClick={()=>ajouterLigne(l.villa)} style={{flex:1,padding:"7px",background:C.vert,color:"white",border:"none",borderRadius:8,fontWeight:700,fontSize:"0.74rem",cursor:"pointer"}}>Ajouter</button>
        <button onClick={()=>{setOpenVilla(null);setNvDetail("");setNvMontant("");}} style={{padding:"7px 11px",background:"#F5F5F5",color:"#666",border:"none",borderRadius:8,fontWeight:700,fontSize:"0.74rem",cursor:"pointer"}}>×</button>
      </div>
    </div>
    :<button onClick={()=>{setOpenVilla(l.villa);setNvDetail("");setNvMontant("");}} style={{marginTop:8,width:"100%",padding:"7px",background:"white",color:C.sombre,border:"1.5px dashed "+C.vert,borderRadius:8,fontWeight:700,fontSize:"0.72rem",cursor:"pointer"}}>+ Ajouter une ligne</button>}
    {/* === NEW: masquage === rappel + reaffichage des lignes retirees de cette villa */}
    {nbMasquesVilla(l.villa)>0&&<div style={{display:"flex",alignItems:"center",gap:8,marginTop:8,paddingTop:8,borderTop:"0.5px solid #F0F0F0"}}>
      <div style={{fontSize:"0.66rem",color:"#999",fontStyle:"italic"}}>🚫 {nbMasquesVilla(l.villa)} ligne{nbMasquesVilla(l.villa)>1?"s":""} masquée{nbMasquesVilla(l.villa)>1?"s":""}</div>
      <button onClick={()=>reafficher(l.villa)} style={{marginLeft:"auto",background:"none",border:"none",color:C.vert,fontWeight:700,fontSize:"0.68rem",cursor:"pointer",padding:0,textDecoration:"underline"}}>Tout réafficher</button>
    </div>}

})}
{lignes.length>0&&<div style={{background:C.creme,borderRadius:12,padding:"12px 14px",marginBottom:10,display:"flex",alignItems:"center"}}>
  <div style={{fontWeight:800,fontSize:"0.9rem",color:C.sombre}}>Total du mois</div>
  <div style={{marginLeft:"auto",fontWeight:800,fontSize:"1.25rem",color:C.sombre}}>{eur(totalGeneral)}</div>
</div>}
</div>;
}

function VuePaie({missions,etats,equipe,prestationsAnnexes,notifier}){
const [onglet,setOnglet]=useState("paie");
const [mois,setMois]=useState(new Date().toISOString().slice(0,7));
const msMois=missions.filter(m=>m.date.startsWith(mois));
const membres=Object.entries(equipe).filter(([id])=>id!=="johalann"&&equipe[id].actif);
const calculer=(id,eq)=>{
const conf=msMois.filter(m=>etats[m.id]?.confirmedBy===id);
const ci=conf.filter(m=>m.type==="CI");const co=conf.filter(m=>m.type==="CO");const men=conf.filter(m=>m.type==="Menage");
let tCI=0;ci.forEach(m=>{tCI+=m.villa==="Happy Bay"?TARIF_CICO_PHILO:(eq.tarifCI||30);});
let tCO=0;co.forEach(m=>{tCO+=tarifCOpourMission(eq,m);});
let tMen=0;let h=0;
// === NEW: calcul menage heures robuste + 0 par defaut (fix) ===
// Lit les VRAIES heures ou qu'elles soient (rapport, saisie manuelle, interventionTime) via les helpers.
// Pas d'heures -> 0h/0EUR (aucun else, aucune heure fantome).
men.forEach(m=>{const s=etats[m.id]||{};
const hd=heureDebutDispo(s);const hf=heureFinDispo(s);
if(hd&&hf){const d=hd.split(":").map(Number);const f=hf.split(":").map(Number);const hh=(f[0]*60+f[1]-d[0]*60-d[1])/60;if(hh>0){const inter=s.rapport?.intervenants||s.intervenants||1;const mult=inter>1?inter:1;const hTot=hh*mult;h+=hTot;tMen+=hTot*(eq.tarifMenage||17);}}});
return {ci:ci.length,co:co.length,men:men.length,h:Math.round(h*10)/10,tCI,tCO,tMen,total:Math.round(tCI+tCO+tMen)};};
// Prestations annexes validées du mois, groupées par prestataire
const presMois=(prestationsAnnexes||[]).filter(p=>p.statut==="valide"&&p.date_execution&&p.date_execution.startsWith(mois));
const calculerPrestations=(id)=>{
const lignes=presMois.filter(p=>p.prestataire===id);
const tarifTotal=lignes.reduce((s,p)=>s+(parseFloat(p.tarif)||0),0);
const remboursementTotal=lignes.reduce((s,p)=>s+(parseFloat(p.montant_achat)||0),0);
return {
  lignes,
  nbLignes:lignes.length,
  tarifTotal:Math.round(tarifTotal*100)/100,
  remboursementTotal:Math.round(remboursementTotal*100)/100,
  total:Math.round((tarifTotal+remboursementTotal)*100)/100
};};
const exporter=()=>{
let txt="FACTURATION SOLEYA - "+mois+"\n"+"=".repeat(30)+"\n\n";
membres.forEach(([id,eq])=>{
  const r=calculer(id,eq);
  const rp=calculerPrestations(id);
  if(r.total===0&&rp.total===0)return;
  txt+=eq.nom+"\n"+"-".repeat(20)+"\n";
  if(r.ci>0)txt+="CI: "+r.ci+" x tarif = "+r.tCI+"E\n";
  if(r.co>0)txt+="CO: "+r.co+" x tarif = "+r.tCO+"E\n";
  if(r.men>0)txt+="Menage: "+r.men+" ("+r.h+"h) = "+r.tMen+"E\n";
  if(rp.nbLignes>0){
    txt+="Prestations annexes: "+rp.nbLignes+" = "+rp.tarifTotal+"E\n";
    if(rp.remboursementTotal>0)txt+="Remboursement frais: "+rp.remboursementTotal+"E\n";
  }
  txt+="TOTAL: "+(r.total+rp.total)+"E\n\n";
});
const blob=new Blob([txt],{type:"text/plain"});const url=URL.createObjectURL(blob);
const a=document.createElement("a");a.href=url;a.download="facturation_soleya_"+mois+".txt";a.click();};
// Rapport blanchisserie
const lingeTotal={};
msMois.filter(m=>m.type==="CO").forEach(m=>{
const rap=etats[m.id]?.rapport;if(!rap?.linge)return;
Object.entries(rap.linge).forEach(([item,qty])=>{if(qty>0)lingeTotal[item]=(lingeTotal[item]||0)+qty;});});
const totalPieces=Object.values(lingeTotal).reduce((s,v)=>s+v,0);
const exporterLinge=()=>{
let txt="RAPPORT LINGE CCBELL&CO - "+mois+"\n"+"=".repeat(30)+"\n\n";
LINGE_ITEMS.forEach(item=>{if(lingeTotal[item]>0)txt+=item+" : "+lingeTotal[item]+"\n";});
txt+="\nTOTAL : "+totalPieces+" pieces\n";
const blob=new Blob([txt],{type:"text/plain"});const url=URL.createObjectURL(blob);
const a=document.createElement("a");a.href=url;a.download="linge_soleya_"+mois+".txt";a.click();};

// ============================================================
// Jalon 4 : Exports PDF & CSV par fille (prestations annexes)
// ============================================================
const notif=notifier||((msg,ok=true)=>{if(!ok)alert(msg);});

const exporterCSVFille=(id,eq,moisExport)=>{
  const lignes=(prestationsAnnexes||[]).filter(p=>
    p.prestataire===id&&
    p.statut==="valide"&&
    p.date_execution&&
    p.date_execution.startsWith(moisExport)
  ).sort((a,b)=>a.date_execution.localeCompare(b.date_execution));
  if(lignes.length===0){notif("Aucune prestation a exporter pour "+eq.nom,false);return;}
  const headers=["Date","Type","Villa","Lieu","Duree (h)","Tarif prestation (E)","Montant achat (E)","Total ligne (E)","Ajuste","Motif ajustement","Note"];
  const rows=lignes.map(p=>{
    const tp=(typeof TYPES_PRESTATION!=="undefined")?TYPES_PRESTATION.find(t=>t.code===p.type):null;
    const typeLabel=tp?tp.label:p.type;
    const typeFinal=p.type==="autre"&&p.type_autre_libelle?typeLabel+" : "+p.type_autre_libelle:typeLabel;
    const tarif=parseFloat(p.tarif)||0;
    const achat=parseFloat(p.montant_achat)||0;
    return [
      p.date_execution,
      typeFinal,
      p.villa||"",
      p.lieu||"",
      p.duree_heures||"",
      tarif.toFixed(2),
      achat?achat.toFixed(2):"",
      (tarif+achat).toFixed(2),
      p.motif_ajustement?"Oui":"Non",
      p.motif_ajustement||"",
      (p.note||"").replace(/[\r\n]+/g," ")
    ];
  });
  const totalTarif=lignes.reduce((s,p)=>s+(parseFloat(p.tarif)||0),0);
  const totalAchat=lignes.reduce((s,p)=>s+(parseFloat(p.montant_achat)||0),0);
  rows.push([]);
  rows.push(["","","","","TOTAL",totalTarif.toFixed(2),totalAchat.toFixed(2),(totalTarif+totalAchat).toFixed(2),"","",""]);
  const escape=(v)=>{
    const s=String(v);
    if(s.includes(";")||s.includes('"')||s.includes("\n")){return '"'+s.replace(/"/g,'""')+'"';}
    return s;
  };
  const csv=[headers,...rows].map(r=>r.map(escape).join(";")).join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="prestations_"+id+"_"+moisExport+".csv";
  a.click();
  URL.revokeObjectURL(url);
};

const exporterPDFFille=(id,eq,moisExport)=>{

  doc.setFontSize(9);
  doc.setFont("helvetica","normal");
  doc.text("Date d'edition : "+new Date().toLocaleDateString("fr-FR"),14,50);
  doc.text("Nombre de prestations : "+lignes.length,14,55);
  // Tableau
  const body=lignes.map(p=>{
    const tp=(typeof TYPES_PRESTATION!=="undefined")?TYPES_PRESTATION.find(t=>t.code===p.type):null;
    const typeLabel=tp?tp.label:p.type;
    const typeFinal=p.type==="autre"&&p.type_autre_libelle?typeLabel+" : "+p.type_autre_libelle:typeLabel;
    const tarif=parseFloat(p.tarif)||0;
    const achat=parseFloat(p.montant_achat)||0;
    return [
      p.date_execution,
      typeFinal+(p.villa?"\n("+p.villa+")":""),
      p.duree_heures?p.duree_heures+" h":"-",
      tarif.toFixed(2)+" EUR",
      achat?achat.toFixed(2)+" EUR":"-",
      (tarif+achat).toFixed(2)+" EUR"
    ];
  });
  doc.autoTable({
    startY:62,
    head:[["Date","Prestation","Duree","Tarif","Achat","Total"]],
    body:body,
    theme:"grid",
    headStyles:{fillColor:sombre,textColor:255,fontStyle:"bold",fontSize:9},
    bodyStyles:{fontSize:8,cellPadding:2},
    alternateRowStyles:{fillColor:[252,240,211]},
    columnStyles:{
      0:{cellWidth:22},
      1:{cellWidth:70},
      2:{cellWidth:18,halign:"center"},
      3:{cellWidth:25,halign:"right"},
      4:{cellWidth:25,halign:"right"},
      5:{cellWidth:30,halign:"right",fontStyle:"bold"}
    }
  });
  // Totaux
  const finalY=doc.lastAutoTable.finalY+8;
  const totalTarif=lignes.reduce((s,p)=>s+(parseFloat(p.tarif)||0),0);
  const totalAchat=lignes.reduce((s,p)=>s+(parseFloat(p.montant_achat)||0),0);
  const totalGeneral=totalTarif+totalAchat;
  doc.setFillColor(252,240,211);
  doc.roundedRect(110,finalY,86,30,2,2,"F");
  doc.setTextColor(sombre[0],sombre[1],sombre[2]);
  doc.setFont("helvetica","normal");
  doc.setFontSize(9);
  doc.text("Total prestations",114,finalY+7);
  doc.setFont("helvetica","bold");
  doc.text(totalTarif.toFixed(2)+" EUR",192,finalY+7,{align:"right"});
  doc.setFont("helvetica","normal");
  doc.text("Remboursements frais",114,finalY+14);
  doc.setFont("helvetica","bold");
  doc.text(totalAchat.toFixed(2)+" EUR",192,finalY+14,{align:"right"});
  doc.setDrawColor(sombre[0],sombre[1],sombre[2]);
  doc.setLineWidth(0.3);
  doc.line(114,finalY+18,192,finalY+18);
  doc.setFont("helvetica","bold");

// =============== CONSTATS — remontee rapport menage -> mission suivante (F1/F2) ===============
// Un constat est saisi pendant le menage et se rattache automatiquement (calcul derive, aucun
// champ Supabase supplementaire) a la prochaine mission de la meme villa, pour anticiper le besoin.
const CONSTAT_TYPES=[
  {key:"linge_manquant",  label:"Linge manquant",         icon:"🧺", urgence:"bloquant", action:"a recuperer a la blanchisserie sur le trajet"},
  {key:"produit_epuise",  label:"Produit epuise",         icon:"🧴", urgence:"a_prevoir", action:"a racheter"},
  {key:"equipement_defaut",label:"Equipement defectueux", icon:"🔧", urgence:"a_prevoir", action:"a verifier / reparer"},
  {key:"degradation",     label:"Degradation",            icon:"⚠️", urgence:"a_prevoir", action:"a controler"},
  {key:"autre",           label:"Autre",                  icon:"📝", urgence:"a_prevoir", action:""}
];
function constatTypeMeta(k){return CONSTAT_TYPES.find(t=>t.key===k)||CONSTAT_TYPES[CONSTAT_TYPES.length-1];}
function constatDateEff(m,etat){return (((etat&&etat.interventionDate)||(m&&m.date)||"")+"").slice(0,10);}
function constatLibelle(c){
  if(!c)return "";
  if(c.type==="linge_manquant"&&c.articleConcerne)return (c.quantiteManquante?c.quantiteManquante+" ":"")+c.articleConcerne;
  return c.description||constatTypeMeta(c.type).label;
}
// Prochaine mission chronologique sur la meme villa (hors source, missions finalisees, ou deja reportees)
function prochaineMissionVilla(sourceId,missions,etats,exclureIds){
  const src=missions.find(m=>m.id===sourceId);if(!src)return null;
  const dSrc=constatDateEff(src,etats[sourceId]);
  const skip=new Set([sourceId,...(exclureIds||[])]);
  const cands=missions.filter(m=>{
    if(skip.has(m.id))return false;
    if((m.villa||"")!==(src.villa||""))return false;
    const st=etats[m.id]||{};
    if(st.rapport)return false;               // mission deja finalisee -> le constat glisse a la suivante
    return constatDateEff(m,st)>=dSrc;
  });
  cands.sort((a,b)=>{
    const da=constatDateEff(a,etats[a.id]),db=constatDateEff(b,etats[b.id]);
    if(da!==db)return da<db?-1:1;
    return (a.id<b.id?-1:1);
  });
  return cands[0]||null;
}
// Index missionId -> [{constat, sourceId}] pour tous les constats "ouvert" rattaches
function buildConstatsIndex(missions,etats){
  const idx={};
  if(!Array.isArray(missions))return idx;
  for(const m of missions){
    const rap=etats[m.id]&&etats[m.id].rapport;
    const cs=rap&&Array.isArray(rap.constats)?rap.constats:null;
    if(!cs)continue;
    for(const c of cs){
      if(!c||c.statut!=="ouvert")continue;
      const cible=prochaineMissionVilla(m.id,missions,etats,c.reporteParMissions||[]);
      if(!cible)continue;
      (idx[cible.id]||(idx[cible.id]=[])).push({constat:c,sourceId:m.id});
    }
  }
  return idx;
}

// Zones triees + stats de completion d'une checklist check-out
function zonesCheckoutTriees(checklist){
  return (Array.isArray(checklist)?checklist:[]).slice().sort((a,b)=>(a.ordre||0)-(b.ordre||0));
}
function statsChecklistCO(checklist,etat){
  const e=etat||{};const zones=zonesCheckoutTriees(checklist);
  const pts=zones.flatMap(z=>z.points||[]);
  const total=pts.length;
  const coches=pts.filter(p=>e[p.id]&&e[p.id].coche).length;
  const critiques=pts.filter(p=>p.critique);
  const critiquesManquants=critiques.filter(p=>!(e[p.id]&&e[p.id].coche));
  const pct=total?Math.round((coches/total)*100):0;
  const nonCoches=pts.filter(p=>!(e[p.id]&&e[p.id].coche));
  return {total,coches,pct,critiques,critiquesManquants,nonCoches};
}

// === NEW: persistance ciYMD/coYMD pour cron alertes ===
// Les dates CI/CO d'une resa sont resolues par buildResas (fusion Google Calendar + overrides) mais
// n'etaient pas stockees dans soleya_state. On les recopie dans reservations[id] (MERGE, sans ecraser
// villa/caution/toggles/taxe...) pour que l'Edge Function alertes-matin calcule les regles c/d cote serveur.
// Purement additif : buildResas lit ciOverride/coOverride (pas ciYMD/coYMD), donc aucun impact sur la logique.
// Ecrit seulement si une date differe -> pas de boucle, declenche au chargement ET apres chaque Sync (gcal.events change).
useEffect(()=>{
  if(!gcal||!gcal.connected)return;
  let changes=null;
  for(const r of resas){
    const cur=reservations[r.id]||{};
    // + villa resolue (override||detectee) pour que les crons affichent le nom au lieu de "Villa ?".
    if(cur.ciYMD!==r.ciYMD||cur.coYMD!==r.coYMD||(r.villa&&cur.villa!==r.villa)){
      (changes||(changes={}))[r.id]={...cur,ciYMD:r.ciYMD,coYMD:r.coYMD,villa:r.villa||cur.villa};
    }
  }
  if(changes)onSave({...reservations,...changes});
},[gcal&&gcal.connected,gcal&&gcal.events,reservations,villas]);
// === NEW: Feature archiver résas === partition archivees/actives AVANT tout autre filtre (compteurs + villas se basent dessus)
const resasBase=resas.filter(r=>voirArchivees?r.archived:!r.archived);
const nbArchivees=resas.filter(r=>r.archived).length; // discret (affiche dans le toggle uniquement)
const villasDispo=[...new Set(resasBase.map(r=>r.villa).filter(Boolean))].sort();
const resasFiltrees=resasBase.filter(r=>{
  if(filtreVilla&&r.villa!==filtreVilla)return false;
  // === NEW: filtre mois (brique 3.5) === CI OU CO dans le mois, phases ignorees (resas passees incluses)
  if(filtreMois){
    return (r.ciYMD&&r.ciYMD.startsWith(filtreMois))||(r.coYMD&&r.coYMD.startsWith(filtreMois));
  }
  const phase=getResaPhase(r.ciYMD,r.coYMD,today);
  if(filtrePhase!=="toutes"&&phase!==filtrePhase)return false;
  return true;
});
const counts={
  toutes:resasBase.length,
  avenir:resasBase.filter(r=>getResaPhase(r.ciYMD,r.coYMD,today)==="avenir").length,
  encours:resasBase.filter(r=>getResaPhase(r.ciYMD,r.coYMD,today)==="encours").length,
  postsejour:resasBase.filter(r=>getResaPhase(r.ciYMD,r.coYMD,today)==="postsejour").length,
};
const sauverResa=(id,patch)=>{
  const next={...reservations,[id]:{...(reservations[id]||{}),...patch}};
  onSave(next);
};
const toggleItem=(id,itemId)=>{
  const cur=reservations[id]||{};
  const cl={...(cur.checklist||{})};
  cl[itemId]=!cl[itemId];
  sauverResa(id,{checklist:cl,_updatedAt:Date.now()});
};
const ignorer=(id)=>{
  if(!confirm("Masquer cette reservation de la liste ?"))return;
  sauverResa(id,{ignored:true});
  setSelectedId(null);notifier("Reservation masquee");
};
// === NEW: Feature archiver résas === archiver = masquer sans supprimer (reversible), pas de confirm (action douce)
const archiver=(id)=>{ sauverResa(id,{archived:true}); notifier("Résa archivée"); };
const restaurer=(id)=>{ sauverResa(id,{archived:false}); notifier("Résa restaurée"); };
const supprimerGoogle=async(id)=>{
  if(!gcal||!gcal.deleteEvent){notifier("Suppression Google indisponible",false);return;}
  const r=resas.find(x=>x.id===id);
  const nom=(r&&(r.client||(r.gEvent&&r.gEvent.title)))||"cet evenement";
  if(!confirm("Supprimer DEFINITIVEMENT \""+nom+"\" de ton agenda Google ?\n\nCette action est irreversible et retire l'evenement partout (page Calendrier incluse)."))return;
  try{
    await gcal.deleteEvent(id);
    // Nettoyer l'override local eventuel (orphelin apres suppression Google)
    if(reservations[id]){const next={...reservations};delete next[id];onSave(next);}
    setSelectedId(null);
    notifier("Evenement supprime de Google Agenda");
  }catch(e){
    notifier(e.message||"Erreur lors de la suppression",false);
  }
};
const selected=resas.find(r=>r.id===selectedId);

if(!gcal||!gcal.connected){
  return <div>
    <div style={{fontWeight:800,fontSize:"0.95rem",color:C.sombre,marginBottom:10}}>Reservations</div>
    <div style={{background:"white",borderRadius:14,padding:"22px 18px",textAlign:"center",boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
      <div style={{fontSize:"2rem",marginBottom:8}}>📅</div>
      <div style={{fontWeight:700,color:C.sombre,marginBottom:6}}>Google Calendar non connecte</div>
      <div style={{fontSize:"0.78rem",color:"#888",lineHeight:1.5,marginBottom:14}}>Connecte ton agenda Google depuis l'Accueil pour importer automatiquement tes reservations Airbnb.</div>
      {gcal&&gcal.connect&&<button onClick={gcal.connect} style={{padding:"10px 22px",background:C.vert,color:"white",border:"none",borderRadius:10,fontWeight:700,fontSize:"0.85rem",cursor:"pointer"}}>Connecter Google Calendar</button>}
      {gcal&&gcal.error&&<div style={{marginTop:10,fontSize:"0.7rem",color:"#922B21"}}>{gcal.error}</div>}
    </div>
  </div>;
}

return <div>
  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
    <div style={{fontWeight:800,fontSize:"0.95rem",color:C.sombre}}>{voirArchivees?"Réservations archivées":"Reservations actives"}</div>
    <button onClick={()=>gcal.refresh&&gcal.refresh()} disabled={gcal.loading} style={{padding:"6px 12px",background:gcal.loading?"#EEE":"white",color:C.sombre,border:"1px solid #DDD",borderRadius:9,fontWeight:600,fontSize:"0.72rem",cursor:gcal.loading?"default":"pointer"}}>{gcal.loading?"Sync...":"Sync"}</button>
  </div>
  {/* === NEW: Feature archiver résas === toggle en haut de la vue, OFF par defaut */}
  <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
    <button onClick={()=>setVoirArchivees(v=>!v)} style={{padding:"6px 12px",background:voirArchivees?C.sombre:"white",color:voirArchivees?"white":"#888",border:"1px solid "+(voirArchivees?C.sombre:"#DDD"),borderRadius:9,fontWeight:700,fontSize:"0.72rem",cursor:"pointer"}}>{voirArchivees?"← Retour aux actives":"🕐 Voir les archivées"+(nbArchivees?" ("+nbArchivees+")":"")}</button>
  </div>
  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginBottom:12}}>
    {[{k:"toutes",l:"Toutes",c:C.sombre,bg:"white"},{k:"avenir",l:"A venir",c:"#1A5276",bg:"#D6EAF8"},{k:"encours",l:"En cours",c:"#0F6E56",bg:"#E1F5EE"},{k:"postsejour",l:"Post-sejour",c:"#854F0B",bg:"#FAEEDA"}].map(s=>(
      <button key={s.k} onClick={()=>setFiltrePhase(s.k)} style={{background:filtrePhase===s.k?s.c:s.bg,color:filtrePhase===s.k?"white":s.c,borderRadius:10,padding:"10px 4px",textAlign:"center",border:"none",cursor:"pointer",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
        <div style={{fontSize:"1.3rem",fontWeight:800,lineHeight:1}}>{counts[s.k]}</div>
        <div style={{fontSize:"0.58rem",fontWeight:700,marginTop:2}}>{s.l}</div>
      </button>
    ))}
  </div>
  {/* === NEW: reservations passees + filtre mois (brique 3.5) === */}
  <div style={{display:"flex",gap:8,marginBottom:filtreMois?6:12,alignItems:"center"}}>
    <input type="month" value={filtreMois} onChange={e=>setFiltreMois(e.target.value)} placeholder="Filtrer par mois" style={{flex:1,padding:"8px 10px",border:"1.5px solid "+(filtreMois?C.vert:"#EEE"),borderRadius:9,fontSize:"0.82rem",outline:"none"}}/>
    {filtreMois&&<button onClick={()=>setFiltreMois("")} style={{padding:"8px 12px",background:"#F5F5F5",color:"#666",border:"none",borderRadius:9,fontWeight:700,fontSize:"0.72rem",cursor:"pointer",whiteSpace:"nowrap"}}>✕ mois</button>}
  </div>
  {filtreMois&&<div style={{fontSize:"0.68rem",color:C.vert,marginBottom:12,fontWeight:600}}>Mois {filtreMois} : toutes les résas (arrivée ou départ) dans ce mois, passées incluses — le filtre de phase est ignoré.</div>}
  {villasDispo.length>0&&<div style={{display:"flex",gap:5,marginBottom:12,flexWrap:"wrap"}}>
    <button onClick={()=>setFiltreVilla("")} style={{padding:"4px 10px",borderRadius:18,border:"none",background:filtreVilla===""?C.sombre:"white",color:filtreVilla===""?"white":"#666",fontWeight:700,fontSize:"0.7rem",cursor:"pointer"}}>Toutes villas</button>
    {villasDispo.map(v=><button key={v} onClick={()=>setFiltreVilla(v)} style={{padding:"4px 10px",borderRadius:18,border:"none",background:filtreVilla===v?C.sombre:"white",color:filtreVilla===v?"white":"#666",fontWeight:700,fontSize:"0.7rem",cursor:"pointer"}}>{v}</button>)}
  </div>}
  {resasFiltrees.length===0?<div style={{textAlign:"center",padding:"40px 20px",color:"#AAA",fontSize:"0.85rem"}}>{resas.length===0?"Aucune reservation detectee dans ton agenda Google.":voirArchivees?"Aucune réservation archivée.":"Aucune reservation dans ce filtre."}</div>:
    resasFiltrees.map(r=><CarteResa key={r.id} resa={r} today={today} onOpen={()=>setSelectedId(r.id)} onPatch={p=>sauverResa(r.id,p)} onDelete={()=>supprimerGoogle(r.id)} onArchive={()=>archiver(r.id)} onRestore={()=>restaurer(r.id)} edls={edls}/>)}
  {selected&&<ResaSheet resa={selected} today={today} anomalies={anomalies} onClose={()=>setSelectedId(null)} onPatch={p=>sauverResa(selected.id,p)} onToggle={itemId=>toggleItem(selected.id,itemId)} onIgnorer={()=>ignorer(selected.id)} onArchive={()=>{archiver(selected.id);setSelectedId(null);}} onRestore={()=>{restaurer(selected.id);setSelectedId(null);}} onSupprimerGoogle={()=>supprimerGoogle(selected.id)} notifier={notifier} villas={villas}/>}
</div>;
}

function PanneauMessage({resa,checklistId,onClose,onMarkSent,notifier}){
  const meta = MESSAGES_PARCOURS[checklistId];
  const [objet2,setObjet2] = React.useState("");
  const [corps,setCorps] = React.useState("");
  // Initialise le contenu une fois la méta connue (les Hooks restent appelés inconditionnellement).
  React.useEffect(()=>{
    if(!meta){setObjet2("");setCorps("");return;}
    const today = todayYMD();
    const anticipee = resa.ciYMD && joursEntre(today, resa.ciYMD) > 14;
    let objet = "", corpsBrut = "";
    if(meta.versions){
      const version = anticipee ? meta.versions.anticipee : meta.versions.tardive;
      objet = version.objet || ""; corpsBrut = version.corps || "";
    } else {
      objet = meta.objet || ""; corpsBrut = meta.corps || "";
    }
    setObjet2(remplacerVariablesMessage(objet, resa));
    setCorps(remplacerVariablesMessage(corpsBrut, resa));
  },[checklistId,resa.id]);
  if(!meta) return null;

  const today = todayYMD();
  const isAnticipee = resa.ciYMD && joursEntre(today, resa.ciYMD) > 14;
  const email = resa.email || "";
  const whatsapp = (resa.whatsapp || resa.phone || "").replace(/[\s.\-()]/g, "");

  const confirmCocher = () => {
    setTimeout(()=>{
      if(window.confirm("Le message a-t-il bien été envoyé ?\n\nSi oui, je coche la case correspondante."))onMarkSent();
    },800);
  };
  const ouvrirGmail = () => {
    if(!email){notifier("Pas d'email client renseigné pour cette résa",false);return;}
    const url = "https://mail.google.com/mail/?view=cm&fs=1"
      + "&to=" + encodeURIComponent(email)
      + "&su=" + encodeURIComponent(objet2)
      + "&body=" + encodeURIComponent(corps);
    window.open(url,"_blank");
    confirmCocher();
  };
  const ouvrirWhatsApp = () => {
    if(!whatsapp){notifier("Pas de numéro WhatsApp renseigné pour cette résa",false);return;}
    const num = whatsapp.startsWith("+") ? whatsapp.slice(1) : whatsapp;
    const url = "https://wa.me/" + num + "?text=" + encodeURIComponent(corps);
    window.open(url,"_blank");
    confirmCocher();
  };
  const copier = () => {
    const txt = meta.canal === "email" ? ("Objet : " + objet2 + "\n\n" + corps) : corps;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(
        ()=>notifier("Copié dans le presse-papier"),
        ()=>notifier("Impossible de copier automatiquement",false)
      );
    } else { notifier("Copie non supportée par ce navigateur",false); }
  };

  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"white",borderRadius:14,maxWidth:680,width:"100%",maxHeight:"90vh",overflowY:"auto",boxShadow:"0 10px 40px rgba(0,0,0,0.2)"}}>
        <div style={{padding:"16px 20px",borderBottom:"1px solid #EEE",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:"0.7rem",fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:.5}}>Étape {meta.etape} · {meta.canal === "email" ? "📧 Email" : "💬 WhatsApp"}</div>
            <div style={{fontSize:"1.1rem",fontWeight:800,color:C.sombre,marginTop:2}}>{meta.titre}</div>
            <div style={{fontSize:"0.75rem",color:"#666",marginTop:2}}>
              {resa.client || "Client à renseigner"} · {resa.villa} · {resa.ciYMD}
              {meta.versions && (
                <span style={{marginLeft:8,padding:"2px 7px",background:isAnticipee?"#E0F2F1":"#FFF4E5",color:isAnticipee?"#1A6B4A":"#A35A0E",borderRadius:5,fontSize:"0.65rem",fontWeight:700}}>
                  {isAnticipee ? "Version anticipée (>14j)" : "Version tardive (<14j)"}
                </span>
              )}
            </div>
          </div>
          <button onClick={onClose} style={{background:"transparent",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#888"}}>×</button>
        </div>

        <div style={{padding:"10px 20px",background:"#FCF0D3",fontSize:"0.78rem",color:C.sombre,borderBottom:"1px solid #EEE"}}>
          {meta.canal === "email" ? (
            <>📧 Destinataire : <strong>{email || <em style={{color:"#A32D2D"}}>Aucun email renseigné</em>}</strong></>
          ) : (
            <>💬 Destinataire : <strong>{whatsapp || <em style={{color:"#A32D2D"}}>Aucun numéro renseigné</em>}</strong></>
          )}
        </div>

        <div style={{padding:"16px 20px"}}>
          {meta.canal === "email" && (
            <>
              <label style={{fontSize:"0.7rem",fontWeight:700,color:"#888",textTransform:"uppercase"}}>Objet</label>
              <input type="text" value={objet2} onChange={e=>setObjet2(e.target.value)} style={{width:"100%",padding:"8px 10px",border:"1px solid #DDD",borderRadius:6,fontSize:"0.85rem",marginTop:4,marginBottom:12,fontFamily:"inherit",boxSizing:"border-box"}}/>
            </>
          )}
          <label style={{fontSize:"0.7rem",fontWeight:700,color:"#888",textTransform:"uppercase"}}>Message (modifiable avant envoi)</label>
          <textarea value={corps} onChange={e=>setCorps(e.target.value)} rows={16} style={{width:"100%",padding:"10px 12px",border:"1px solid #DDD",borderRadius:6,fontSize:"0.82rem",marginTop:4,fontFamily:"inherit",resize:"vertical",lineHeight:1.4,boxSizing:"border-box"}}/>
          <div style={{fontSize:"0.65rem",color:"#888",marginTop:6,fontStyle:"italic"}}>
            💡 Pense à compléter les variables restantes entre crochets (ex : [lien Swikly], [contact accueil], [montant]).
          </div>
        </div>

        <div style={{padding:"14px 20px",borderTop:"1px solid #EEE",display:"flex",gap:8,flexWrap:"wrap",justifyContent:"flex-end"}}>
          <button onClick={copier} style={{padding:"9px 14px",background:"#F0F0F0",border:"none",borderRadius:7,fontSize:"0.78rem",fontWeight:700,cursor:"pointer",color:C.sombre}}>📋 Copier</button>
          {meta.canal === "email" && (
            <button onClick={ouvrirGmail} style={{padding:"9px 16px",background:"#EA4335",border:"none",borderRadius:7,fontSize:"0.8rem",fontWeight:700,cursor:"pointer",color:"white"}}>📧 Ouvrir Gmail</button>
          )}
          {meta.canal === "whatsapp" && (
            <button onClick={ouvrirWhatsApp} style={{padding:"9px 16px",background:"#25D366",border:"none",borderRadius:7,fontSize:"0.8rem",fontWeight:700,cursor:"pointer",color:"white"}}>💬 Ouvrir WhatsApp</button>
          )}
        </div>
      </div>
    </div>
  );
}

function CarteResa({resa,today,onOpen,onPatch,onDelete,onArchive,onRestore,edls}){
  const phase=getResaPhase(resa.ciYMD,resa.coYMD,today);
  const ph=RESA_PHASES.find(p=>p.id===phase);
  const prog=getResaProgress(resa);
  const proch=getProchaineAction(resa,today);
  const jusquCI=joursEntre(today,resa.ciYMD);
  const jusquCO=joursEntre(today,resa.coYMD);
  const villaCol=resa.villa?"#0F6E56":"#888";
  const sansEmail=!(resa.email&&resa.email.trim());
  const sansWA=!((resa.whatsapp&&resa.whatsapp.trim())||(resa.phone&&resa.phone.trim()));
  const alerteContact=phase!=="postsejour";
  const edlMatch=(edls||[]).filter(e=>edlMatchResa(e,resa));
  const edlEntree=edlMatch.find(e=>e.type==="entree");
  const edlSortie=edlMatch.find(e=>e.type==="sortie");
  // Edition rapide du nom client (crayon) sans ouvrir le panneau de detail
  const [editNom,setEditNom]=useState(false);
  const [draftNom,setDraftNom]=useState(resa.client||"");
  // === NEW: Feature archiver résas === animation legere de sortie avant archivage/restauration
  const [leaving,setLeaving]=useState(false);
  const animerEtQuitter=fn=>e=>{e.stopPropagation();if(leaving)return;setLeaving(true);setTimeout(()=>fn&&fn(),260);};
  const stop=e=>e.stopPropagation();
  const ouvrirEdit=e=>{e.stopPropagation();setDraftNom(resa.client||"");setEditNom(true);};
  const validerEdit=e=>{if(e)e.stopPropagation();if(onPatch)onPatch({client:draftNom.trim()});setEditNom(false);};
  const annulerEdit=e=>{if(e)e.stopPropagation();setEditNom(false);};
  return <div onClick={onOpen} style={{background:"white",borderRadius:12,marginBottom:10,boxShadow:"0 1px 6px rgba(0,0,0,0.06)",borderLeft:"4px solid "+(proch&&proch.etat==="retard"?"#E24B4A":proch&&proch.etat==="imminent"?"#EF9F27":ph.c),cursor:"pointer",overflow:"hidden",opacity:leaving?0:1,transform:leaving?"translateX(24px)":"none",transition:"opacity 0.25s ease, transform 0.25s ease"}}>
    <div style={{padding:"14px 16px"}}>
      {/* Ligne 1 : badges villa + statut + progression */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          <span style={{background:resa.villa?(C.vert+"22"):"#F5F2ED",color:villaCol,padding:"3px 9px",borderRadius:6,fontSize:"0.68rem",fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>{resa.villa||"Villa ?"}</span>
          <span style={{background:ph.bg,color:ph.c,padding:"3px 8px",borderRadius:6,fontSize:"0.62rem",fontWeight:700}}>{ph.label}</span>
          {alerteContact&&sansEmail&&<span title="Email client manquant — necessaire pour les messages du parcours" style={{background:"#FCEBEB",color:"#A32D2D",padding:"3px 8px",borderRadius:6,fontSize:"0.62rem",fontWeight:700}}>✉ Email manquant</span>}
          {alerteContact&&sansWA&&<span title="WhatsApp/telephone client manquant — necessaire pour les messages du parcours" style={{background:"#FCEBEB",color:"#A32D2D",padding:"3px 8px",borderRadius:6,fontSize:"0.62rem",fontWeight:700}}>📱 WhatsApp manquant</span>}
        </div>
        <span style={{fontSize:"0.68rem",color:"#888",fontWeight:600}}>{prog.done}/{prog.total} · {prog.pct}%</span>
      </div>

      {/* Ligne 2 : nom client (l'info principale) + crayon d'edition rapide */}
      {editNom?
        <div onClick={stop} style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
          <input autoFocus value={draftNom} onClick={stop} onChange={e=>setDraftNom(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")validerEdit(e);if(e.key==="Escape")annulerEdit(e);}} placeholder="Prenom NOM" style={{flex:1,minWidth:0,padding:"7px 9px",border:"1.5px solid "+C.vert,borderRadius:8,fontSize:"0.95rem",fontWeight:700,color:C.sombre,outline:"none"}}/>
          <button onClick={validerEdit} title="Enregistrer" style={{border:"none",background:C.vert,color:"white",borderRadius:8,padding:"7px 10px",fontWeight:800,cursor:"pointer",fontSize:"0.8rem"}}>✓</button>
          <button onClick={annulerEdit} title="Annuler" style={{border:"none",background:"#F0F0F0",color:"#888",borderRadius:8,padding:"7px 10px",fontWeight:800,cursor:"pointer",fontSize:"0.8rem"}}>×</button>
        </div>
        :
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <div style={{fontSize:"1.05rem",fontWeight:800,color:C.sombre,lineHeight:1.25,flex:1,minWidth:0}}>
            {resa.client && resa.client.trim() ? resa.client : <span style={{color:"#BBB",fontStyle:"italic",fontWeight:600}}>Client à renseigner</span>}
          </div>
          <button onClick={ouvrirEdit} title="Modifier le nom" style={{border:"none",background:"none",color:"#BBB",cursor:"pointer",fontSize:"0.95rem",padding:"2px 4px",lineHeight:1,flexShrink:0}}>✏️</button>
          {/* === NEW: Feature archiver résas === bouton discret archiver / restaurer */}
          {resa.archived
            ? (onRestore&&<button onClick={animerEtQuitter(onRestore)} title="Restaurer cette réservation" style={{border:"none",background:"none",color:"#0F6E56",cursor:"pointer",fontSize:"0.95rem",padding:"2px 4px",lineHeight:1,flexShrink:0}}>↩️</button>)
            : (onArchive&&<button onClick={animerEtQuitter(onArchive)} title="Archiver cette réservation" style={{border:"none",background:"none",color:"#BBB",cursor:"pointer",fontSize:"0.95rem",padding:"2px 4px",lineHeight:1,flexShrink:0}}>🗄️</button>)}
          {onDelete&&<button onClick={e=>{e.stopPropagation();onDelete();}} title="Supprimer dans Google Agenda" style={{border:"none",background:"none",color:"#D88",cursor:"pointer",fontSize:"0.95rem",padding:"2px 4px",lineHeight:1,flexShrink:0}}>🗑️</button>}
        </div>
      }

      {/* Ligne 3 : dates en gros */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:"0.62rem",color:"#888",fontWeight:700,textTransform:"uppercase"}}>Arrivée</span>
          <span style={{fontSize:"0.95rem",fontWeight:700,color:C.sombre}}>{fmtDate(resa.ciYMD)}</span>
          {phase==="avenir"&&jusquCI>=0&&<span style={{fontSize:"0.65rem",color:"#888",fontWeight:600}}>(J-{jusquCI})</span>}
        </div>
        <span style={{color:"#CCC",fontSize:"0.9rem"}}>→</span>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:"0.62rem",color:"#888",fontWeight:700,textTransform:"uppercase"}}>Départ</span>
          <span style={{fontSize:"0.95rem",fontWeight:700,color:C.sombre}}>{fmtDate(resa.coYMD)}</span>
          {phase==="encours"&&jusquCO>=0&&<span style={{fontSize:"0.65rem",color:"#888",fontWeight:600}}>(J-{jusquCO})</span>}
        </div>
      </div>

      {/* Ligne 4 : barre de progression */}
      <div style={{height:4,background:"#F0F0F0",borderRadius:4,overflow:"hidden",marginBottom:8}}>
        <div style={{height:"100%",width:prog.pct+"%",background:prog.pct===100?C.vert:C.or,transition:"width 0.3s"}}/>
      </div>

      {/* Ligne 5 : prochaine action (si présente) */}
      {proch?<div style={{display:"flex",alignItems:"center",gap:6,fontSize:"0.7rem"}}>
        {proch.etat==="retard"&&<span style={{background:"#FCEBEB",color:"#A32D2D",padding:"2px 7px",borderRadius:6,fontWeight:700,fontSize:"0.62rem"}}>EN RETARD</span>}
        {proch.etat==="imminent"&&<span style={{background:"#FAEEDA",color:"#854F0B",padding:"2px 7px",borderRadius:6,fontWeight:700,fontSize:"0.62rem"}}>{proch.due===today?"AUJOURD HUI":"J-"+joursEntre(today,proch.due)}</span>}
        <span style={{color:"#666",lineHeight:1.4}}>{proch.item.label}</span>
      </div>:<div style={{fontSize:"0.7rem",color:"#1D9E75",fontWeight:700}}>✓ Checklist complete</div>}

      {/* Ligne 6 : badges EDL (état des lieux) — accessibles ici, détail complet au clic */}
      {(edlEntree||edlSortie)&&<div style={{display:"flex",gap:5,marginTop:7,flexWrap:"wrap"}}>
        {edlEntree?<span title={"Soumis le "+new Date(edlEntree.created_at).toLocaleDateString("fr-FR")} style={{background:"#E1F5EE",color:"#0F6E56",padding:"2px 7px",borderRadius:6,fontSize:"0.62rem",fontWeight:700}}>📝 EDL entree {new Date(edlEntree.created_at).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}{edlEntree.nb_items_non>0?" ⚠":""}</span>:<span style={{background:"#F5F2ED",color:"#999",padding:"2px 7px",borderRadius:6,fontSize:"0.62rem",fontWeight:600}}>⏳ EDL entree</span>}
        {edlSortie?<span title={"Soumis le "+new Date(edlSortie.created_at).toLocaleDateString("fr-FR")} style={{background:"#D6EAF8",color:"#1A5276",padding:"2px 7px",borderRadius:6,fontSize:"0.62rem",fontWeight:700}}>📤 EDL sortie {new Date(edlSortie.created_at).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}{edlSortie.nb_items_non>0?" ⚠":""}</span>:phase==="postsejour"?<span style={{background:"#F5F2ED",color:"#999",padding:"2px 7px",borderRadius:6,fontSize:"0.62rem",fontWeight:600}}>⏳ EDL sortie</span>:null}
      </div>}
    </div>
  </div>;
}

function ResaSheet({resa,today,anomalies,onClose,onPatch,onToggle,onIgnorer,onArchive,onRestore,onSupprimerGoogle,notifier,villas}){
  const [tab,setTab]=useState("checklist");
  const [panneauOuvert,setPanneauOuvert]=useState(null); // checklistId | null
  const phase=getResaPhase(resa.ciYMD,resa.coYMD,today);
  const ph=RESA_PHASES.find(p=>p.id===phase);
  const prog=getResaProgress(resa);
  const villaKeys=Object.keys(villas||{});
  const v=villas&&villas[resa.villa];
  const waLink=resa.whatsapp?"https://wa.me/"+resa.whatsapp.replace(/[^0-9]/g,""):null;
  const emailLink=resa.email?"mailto:"+resa.email:null;
  return <Sheet onFermer={onClose}>
    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,marginBottom:6}}>
      <div>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,flexWrap:"wrap"}}>
          <span style={{background:resa.villa?(C.vert+"22"):"#F5F2ED",color:resa.villa?"#0F6E56":"#888",padding:"2px 8px",borderRadius:6,fontSize:"0.66rem",fontWeight:700,textTransform:"uppercase"}}>{resa.villa||"Villa ?"}</span>
          <span style={{background:ph.bg,color:ph.c,padding:"2px 7px",borderRadius:6,fontSize:"0.62rem",fontWeight:700}}>{ph.label}</span>
        </div>
        <div style={{fontWeight:800,fontSize:"1rem",color:C.sombre,lineHeight:1.25}}>{resa.client||"(client a renseigner)"}</div>
        <div style={{fontSize:"0.72rem",color:"#666",marginTop:3}}>{fmtDate(resa.ciYMD)} → {fmtDate(resa.coYMD)} &nbsp;·&nbsp; {joursEntre(resa.ciYMD,resa.coYMD)} nuits</div>
      </div>
      <button onClick={onClose} style={{background:"none",border:"none",fontSize:"1.4rem",color:"#888",cursor:"pointer",padding:0,lineHeight:1}}>×</button>
    </div>
    <div style={{height:5,background:"#EEE",borderRadius:5,overflow:"hidden",margin:"10px 0 14px"}}>
      <div style={{height:"100%",width:prog.pct+"%",background:prog.pct===100?C.vert:C.or}}/>
    </div>
    <div style={{display:"flex",gap:6,marginBottom:14}}>
      {[["checklist","Checklist "+prog.done+"/"+prog.total],["infos","Infos"]].map(([k,l])=>(
        <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"8px",border:"none",borderRadius:9,fontWeight:700,fontSize:"0.74rem",cursor:"pointer",background:tab===k?C.sombre:"white",color:tab===k?"white":"#666"}}>{l}</button>
      ))}
    </div>

    {tab==="checklist"&&<div>
      {RESA_PHASES.map(p=>{
        const items=RESA_CHECKLIST.filter(it=>it.phase===p.id&&itemVisibleResa(it,resa));
        return <div key={p.id} style={{marginBottom:14}}>
          <div style={{fontSize:"0.72rem",fontWeight:800,color:p.c,textTransform:"uppercase",letterSpacing:1,marginBottom:6,padding:"4px 10px",background:p.bg,borderRadius:6,display:"inline-block"}}>{p.label}</div>
          <div style={{background:"white",borderRadius:11,boxShadow:"0 1px 4px rgba(0,0,0,0.05)",overflow:"hidden"}}>
            {items.map((it,i)=>{
              const checked=!!(resa.checklist&&resa.checklist[it.id]);
              const due=dueDateItem(it,resa.ciYMD,resa.coYMD);
              const retard=due&&!checked&&due<today;
              const imminent=due&&!checked&&due>=today&&joursEntre(today,due)<=3;
              return <div key={it.id} onClick={()=>onToggle(it.id)} style={{display:"flex",alignItems:"flex-start",gap:9,padding:"10px 12px",borderTop:i===0?"none":"0.5px solid #F5F5F5",cursor:"pointer",background:retard?"#FFFAFA":(imminent?"#FFFEF5":"white")}}>
                <CB on={checked}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:"0.78rem",color:checked?"#999":C.sombre,lineHeight:1.4,textDecoration:checked?"line-through":"none"}}>{it.label}</div>
                  {due&&!checked&&<div style={{fontSize:"0.62rem",marginTop:2,color:retard?"#A32D2D":imminent?"#854F0B":"#888",fontWeight:retard||imminent?700:500}}>
                    {retard?"En retard depuis ":"Echeance "}{fmtDate(due)}{retard?" ("+Math.abs(joursEntre(due,today))+"j)":""}
                  </div>}
                </div>
                {MESSAGES_PARCOURS[it.id]&&<button
                  onClick={e=>{e.stopPropagation();setPanneauOuvert(it.id);}}
                  title={"Envoyer le message : "+MESSAGES_PARCOURS[it.id].titre}
                  style={{flexShrink:0,padding:"4px 8px",background:C.vert2,color:"white",border:"none",borderRadius:5,fontSize:"0.65rem",fontWeight:700,cursor:"pointer",alignSelf:"center"}}
                >📱 Envoyer</button>}
              </div>;
            })}
          </div>
        </div>;
      })}
    </div>}

    {tab==="infos"&&<div>
      <Champ label="Villa">
        <select value={resa.villa||""} onChange={e=>onPatch({villa:e.target.value})} style={champStyleInput}>
          <option value="">-</option>
          {villaKeys.map(v=><option key={v} value={v}>{v}</option>)}
        </select>
      </Champ>
      <Champ label="Nom complet client">
        <input type="text" value={resa.client||""} onChange={e=>onPatch({client:e.target.value})} placeholder="Prenom NOM" style={champStyleInput}/>
      </Champ>
      <ChampGrid>
        <Champ label="Email">
          <input type="email" value={resa.email} onChange={e=>onPatch({email:e.target.value})} placeholder="client@..." style={champStyleInput}/>
        </Champ>
        <Champ label="WhatsApp">
          <input type="tel" value={resa.whatsapp} onChange={e=>onPatch({whatsapp:e.target.value})} placeholder="+596..." style={champStyleInput}/>
        </Champ>
      </ChampGrid>
      <ChampGrid>
        <Champ label="Telephone">
          <input type="tel" value={resa.phone} onChange={e=>onPatch({phone:e.target.value})} placeholder="+33..." style={champStyleInput}/>
        </Champ>
        <Champ label="Heure arrivee">
          <input type="time" value={resa.arrivalTime} onChange={e=>onPatch({arrivalTime:e.target.value})} style={champStyleInput}/>
        </Champ>
      </ChampGrid>
      <Champ label="N° vol">
        <input type="text" value={resa.flightNumber} onChange={e=>onPatch({flightNumber:e.target.value})} placeholder="AF607 / TX510..." style={champStyleInput}/>
      </Champ>
      {/* === NEW: Defaut 2 — gestion caution (qui l'encaisse) : pilote les frais proprio === */}
      <ChampGrid>
        <Champ label="Gestion caution">
          <select value={resa.typeCaution} onChange={e=>onPatch({typeCaution:e.target.value})} style={champStyleInput}>
            {RESA_TYPES_CAUTION.map(([k,l])=><option key={k} value={k}>{l}</option>)}
          </select>
        </Champ>
        <Champ label="Moyen (justificatif)">
          <select value={resa.cautionMoyen||resa.cautionMode} onChange={e=>onPatch({cautionMoyen:e.target.value,cautionMode:e.target.value})} style={champStyleInput}>
            {RESA_CAUTION_MODES.map(([k,l])=><option key={k} value={k}>{l}</option>)}
          </select>
        </Champ>
      </ChampGrid>
      <Champ label="Montant caution (E)">
        <input type="number" value={resa.cautionAmount} onChange={e=>onPatch({cautionAmount:e.target.value})} placeholder="0" style={champStyleInput}/>
      </Champ>
      {/* === NEW: Defaut 2 — suivi restitution (visible seulement si caution geree par Soleya) === */}
      {resa.typeCaution==="soleya"&&<ChampGrid>
        <Champ label="Caution restituée ?">
          <ToggleOuiNon value={resa.cautionRestituee} onChange={v=>onPatch({cautionRestituee:v,cautionDateRestitution:v?(resa.cautionDateRestitution||today):resa.cautionDateRestitution})}/>
        </Champ>
        <Champ label="Date restitution">
          <input type="date" value={resa.cautionDateRestitution} onChange={e=>onPatch({cautionDateRestitution:e.target.value})} style={champStyleInput}/>
        </Champ>
      </ChampGrid>}
      {/* === NEW: champs facturation resa === */}
      <Champ label="Taxe de sejour (E)">
        {resa.taxeAirbnb
          ?<div style={{...champStyleInput,background:"#E8F8F5",border:"1.5px solid #9FE1CB",color:"#0F6E56",fontWeight:600,fontSize:"0.78rem"}}>Collectee en ligne</div>
          :<input type="number" value={resa.taxeAmount} onChange={e=>onPatch({taxeAmount:e.target.value})} placeholder="0" style={champStyleInput}/>}
      </Champ>
      {/* === NEW: Defaut 1 — accueil realise (choix du forfait) + exclusion facturation === */}
      <ChampGrid>
        <Champ label="Accueil réalisé ?">
          <ToggleOuiNon value={resa.accueilRealise} onChange={v=>onPatch({accueilRealise:v})}/>
        </Champ>
        <Champ label="Facturer au proprio ?">
          <ToggleOuiNon value={resa.factureProprio} onChange={v=>onPatch({factureProprio:v})}/>
        </Champ>
      </ChampGrid>
      <Champ label="Note pour l'équipe — visible dans les missions">
        <textarea value={resa.noteEquipe} onChange={e=>onPatch({noteEquipe:e.target.value})} rows={3} placeholder="Ex : client a signale une fuite, sejour tendu, se montrer prudente au check-out..." style={{...champStyleInput,resize:"vertical",fontFamily:"inherit",background:"#FFF8F0",border:"1.5px solid #FFD9A8"}}/>
        <div style={{fontSize:"0.62rem",color:"#B7500A",marginTop:3,lineHeight:1.4}}>Lue par l'intervenante sur sa mission (check-in, check-out et menage). Laisser vide s'il n'y a rien a signaler.</div>
      </Champ>
      <Champ label="Notes libres">
        <textarea value={resa.notes} onChange={e=>onPatch({notes:e.target.value})} rows={4} placeholder="Allergies, lit bebe, particularites..." style={{...champStyleInput,resize:"vertical",fontFamily:"inherit"}}/>
      </Champ>
      <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
        {waLink&&<a href={waLink} target="_blank" rel="noopener noreferrer" style={{flex:1,minWidth:120,padding:"10px",background:"#25D366",color:"white",borderRadius:9,fontWeight:700,fontSize:"0.78rem",textAlign:"center",textDecoration:"none"}}>WhatsApp client</a>}
        {emailLink&&<a href={emailLink} style={{flex:1,minWidth:120,padding:"10px",background:C.sombre,color:"white",borderRadius:9,fontWeight:700,fontSize:"0.78rem",textAlign:"center",textDecoration:"none"}}>Email client</a>}
      </div>
      <div style={{marginTop:18,padding:"10px 12px",background:"#FAFAFA",borderRadius:9,fontSize:"0.65rem",color:"#888",lineHeight:1.5}}>
        Source : {resa.gEvent.title||"(sans titre)"}<br/>
        Event Google : <code style={{fontSize:"0.6rem"}}>{resa.id.slice(0,20)}...</code>
      </div>
      <div style={{marginTop:14,paddingTop:12,borderTop:"1px solid #EEE"}}>
        {/* === NEW: Feature archiver résas === archiver/restaurer depuis le detail */}
        {resa.archived
          ? (onRestore&&<button onClick={onRestore} style={{width:"100%",padding:"9px",marginBottom:8,background:"#E1F5EE",border:"1px solid #B7E0D2",color:"#0F6E56",borderRadius:9,fontWeight:700,fontSize:"0.72rem",cursor:"pointer"}}>↩️ Restaurer cette réservation</button>)
          : (onArchive&&<button onClick={onArchive} style={{width:"100%",padding:"9px",marginBottom:8,background:"none",border:"1px solid #DDD",color:"#666",borderRadius:9,fontWeight:600,fontSize:"0.72rem",cursor:"pointer"}}>🗄️ Archiver cette réservation</button>)}
        <button onClick={onIgnorer} style={{width:"100%",padding:"9px",background:"none",border:"1px dashed #DDD",color:"#888",borderRadius:9,fontWeight:600,fontSize:"0.72rem",cursor:"pointer"}}>🙈 Masquer ce doublon (sans supprimer Google)</button>
        {onSupprimerGoogle&&<button onClick={onSupprimerGoogle} style={{marginTop:8,width:"100%",padding:"9px",background:"#FCEBEB",border:"1px solid #E9B6B6",color:"#A32D2D",borderRadius:9,fontWeight:700,fontSize:"0.72rem",cursor:"pointer"}}>🗑️ Supprimer définitivement dans Google Agenda</button>}
        <div style={{marginTop:6,fontSize:"0.6rem",color:"#AAA",lineHeight:1.4,textAlign:"center"}}>Masquer = retire juste de cette page. Supprimer = efface l'événement de ton agenda Google (définitif, partout).</div>
      </div>
    </div>}

    {panneauOuvert&&<PanneauMessage
      resa={resa}
      checklistId={panneauOuvert}
      notifier={notifier}
      onClose={()=>setPanneauOuvert(null)}
      onMarkSent={()=>{
        // Coche la case si elle ne l'est pas déjà (onToggle bascule l'état)
        if(!(resa.checklist&&resa.checklist[panneauOuvert]))onToggle(panneauOuvert);
        setPanneauOuvert(null);
        notifier("Case cochee");
      }}
    />}
  </Sheet>;
}

const champStyleInput={width:"100%",padding:"9px",border:"1.5px solid #EEE",borderRadius:9,fontSize:"0.85rem",outline:"none",boxSizing:"border-box",background:"white"};
function Champ({label,children}){return <div style={{marginBottom:10}}><div style={{fontSize:"0.68rem",fontWeight:700,color:C.sombre,marginBottom:4}}>{label}</div>{children}</div>;}
function ChampGrid({children}){return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{children}</div>;}
// === NEW: champs facturation resa === toggle Oui/Non reutilisable
function ToggleOuiNon({value,onChange}){
  const opt=(v,l)=>(<button type="button" onClick={()=>onChange(v)} style={{flex:1,padding:"9px",border:"1.5px solid "+(value===v?C.vert:"#EEE"),background:value===v?C.vert:"white",color:value===v?"white":"#999",fontWeight:700,fontSize:"0.78rem",borderRadius:9,cursor:"pointer"}}>{l}</button>);
  return <div style={{display:"flex",gap:8}}>{opt(true,"Oui")}{opt(false,"Non")}</div>;
}

// =============== PROTOCOLE INCIDENTS ===============
function VueIncidents(){

const [urg,setUrg]=useState("Tous");
const [cat,setCat]=useState("Toutes");
const [open,setOpen]=useState({});
const filtered=INCIDENTS.filter(x=>{
const uok=urg==="Tous"||x.urg===urg;
const cok=cat==="Toutes"||x.cat===cat;
const t=search.toLowerCase().trim();
const tok=!t||[x.title,x.cat,x.trigger,...(x.steps||[]),...(x.contacts||[]),x.notes||"",x.escalade||""].some(s=>s&&s.toLowerCase().includes(t));
return uok&&cok&&tok;
});

const urgBg=u=>u==="critique"?"#FCEBEB":u==="urgent"?"#FAEEDA":"#E1F5EE";

return <div>

<div style={{background:"#FAEEDA",border:"1px solid #EF9F27",borderRadius:9,padding:"9px 12px",fontSize:"0.74rem",color:"#854F0B",marginBottom:12,lineHeight:1.5}}>
<b>Regle des 3 minutes</b> — Avant d'appeler Johalann, consulte ce protocole. Si la reponse est ici, applique et informe par message.
</div>
<input type="search" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher un incident..." style={{width:"100%",padding:"9px 12px",fontSize:"0.85rem",border:"1.5px solid #EEE",borderRadius:9,outline:"none",marginBottom:10,boxSizing:"border-box"}}/>
<div style={{display:"flex",gap:5,marginBottom:6,flexWrap:"wrap",alignItems:"center"}}>
<span style={{fontSize:"0.6rem",color:"#AAA",fontWeight:700,letterSpacing:.5,textTransform:"uppercase",minWidth:50}}>Urgence</span>
{INC_URGS.map(([v,l])=><button key={v} onClick={()=>setUrg(v)} style={{padding:"3px 11px",borderRadius:18,border:"1px solid "+(urg===v?C.vert:"#DDD"),background:urg===v?C.vert:"white",color:urg===v?"white":"#666",fontWeight:600,fontSize:"0.7rem",cursor:"pointer"}}>{l}</button>)}
</div>
<div style={{display:"flex",gap:5,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
<span style={{fontSize:"0.6rem",color:"#AAA",fontWeight:700,letterSpacing:.5,textTransform:"uppercase",minWidth:50}}>Cat.</span>
{INC_CATS.map(c=><button key={c} onClick={()=>setCat(c)} style={{padding:"3px 11px",borderRadius:18,border:"1px solid "+(cat===c?C.vert:"#DDD"),background:cat===c?C.vert:"white",color:cat===c?"white":"#666",fontWeight:600,fontSize:"0.7rem",cursor:"pointer"}}>{c}</button>)}
</div>
<div style={{fontSize:"0.72rem",color:"#AAA",marginBottom:10}}>{filtered.length} incident{filtered.length>1?"s":""}</div>
{filtered.length===0?<div style={{textAlign:"center",padding:"30px 0",color:"#CCC",fontSize:"0.85rem"}}>Aucun resultat.</div>:
filtered.map((x,i)=>{const isOpen=!!open[i];return (
<div key={i} style={{background:"white",borderRadius:11,marginBottom:8,boxShadow:"0 1px 4px rgba(0,0,0,0.05)",borderLeft:"4px solid "+urgColor(x.urg),overflow:"hidden"}}>
<div onClick={()=>setOpen({...open,[i]:!isOpen})} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 13px",cursor:"pointer"}}>
<div style={{width:8,height:8,borderRadius:"50%",background:urgColor(x.urg),flexShrink:0}}/>
<div style={{flex:1,minWidth:0}}>
<div style={{fontSize:"0.86rem",fontWeight:700,color:C.sombre,lineHeight:1.3}}>{x.title}</div>
<div style={{fontSize:"0.66rem",color:"#888",marginTop:1}}>{x.cat}</div>
</div>
<span style={{background:urgBg(x.urg),color:urgFg(x.urg),padding:"2px 8px",borderRadius:18,fontSize:"0.62rem",fontWeight:700}}>{INC_UL[x.urg]}</span>
<span style={{color:"#CCC",fontSize:"0.8rem",transform:isOpen?"rotate(180deg)":"none",transition:"transform .2s"}}>v</span>
</div>
{isOpen&&<div style={{padding:"0 13px 13px",borderTop:"1px solid #F5F5F5"}}>
{x.trigger&&<div style={{marginTop:10}}>
<div style={{fontSize:"0.6rem",fontWeight:700,color:"#888",letterSpacing:.5,textTransform:"uppercase",marginBottom:5}}>Declencheur</div>
<div style={{background:"#FAFAF8",borderRadius:7,padding:"7px 11px",fontSize:"0.78rem",color:"#666",fontStyle:"italic"}}>{x.trigger}</div>
</div>}
<div style={{marginTop:10}}>
<div style={{fontSize:"0.6rem",fontWeight:700,color:"#888",letterSpacing:.5,textTransform:"uppercase",marginBottom:5}}>Delai d'intervention</div>
<div style={{fontSize:"0.85rem",fontWeight:700,color:C.sombre}}>{x.delai}</div>
</div>
<div style={{marginTop:10}}>
<div style={{fontSize:"0.6rem",fontWeight:700,color:"#888",letterSpacing:.5,textTransform:"uppercase",marginBottom:6}}>Actions immediates</div>
<ol style={{listStyle:"none",padding:0,margin:0,display:"flex",flexDirection:"column",gap:6}}>
{x.steps.map((s,n)=>(<li key={n} style={{display:"flex",gap:8,alignItems:"flex-start"}}>

<div style={{fontSize:"0.8rem",color:C.sombre,lineHeight:1.5}}>{s}</div>
</li>))}
</ol>

// =============== REPERTOIRE PRESTATAIRES ===============
// Trois briques ajoutees le 9 octobre 2026 :
//  1. chaque contact porte des fonctions (menage, check-in, check-out, backup) avec un filtre dedie ;
//  2. toute carte est modifiable depuis l app — nom, numero, email, fonctions, priorite, note. Les
//     modifications vivent dans soleya_state.repertoire : AUCUN deploiement n est necessaire pour
//     completer un numero ou attribuer une fonction ;
//  3. mode diffusion : on coche plusieurs contacts, on compose le message une seule fois, puis on
//     ouvre les conversations WhatsApp a la suite. WhatsApp n autorise pas l envoi groupe depuis un
//     lien : le message est prepare une fois, les conversations s ouvrent une par une, et chaque
//     contact deja ouvert est coche pour ne pas le solliciter deux fois.
function VueRepertoire({equipe,repertoire,villas,user,notifier,onSaveRepertoire}){
const REP=repertoire||{};
const canEdit=user==="johalann"&&!!onSaveRepertoire;
const canDiff=user==="johalann"||user==="laurys";
const [search,setSearch]=useState("");
const [grp,setGrp]=useState("Tous");
const [pri,setPri]=useState("Tous");
const [fn,setFn]=useState("Tous");
const [edit,setEdit]=useState(null);
const [form,setForm]=useState(null);
const [diff,setDiff]=useState(false);
const [sel,setSel]=useState({});
const [panel,setPanel]=useState(false);
const [sent,setSent]=useState({});
const [msg,setMsg]=useState("");
const [mv,setMv]=useState("");
const [mt,setMt]=useState("Ménage");
const [md,setMd]=useState("");
const [mh,setMh]=useState("");
const [mdur,setMdur]=useState("");
const dire=(t,ok)=>{if(notifier)notifier(t,ok!==false);};

// Equipe Soleya : generee depuis l etat (Gestion > Equipe). Les fonctions sont deduites des
// tarifs renseignes, puis surchargeables comme pour n importe quel contact.
const CONTACTS=useMemo(()=>{
const eqList=Object.entries(equipe||{})
.filter(([id,e])=>e&&e.actif!==false)
.map(([id,e])=>{
const roles=[];const auto=[];
if(e.tarifMenage>0){roles.push("Menage "+e.tarifMenage+" EUR/h");auto.push("menage");}
if(e.tarifCI>0){roles.push("CI "+e.tarifCI+" EUR");auto.push("ci");}
if(e.tarifCO>0){roles.push("CO "+e.tarifCO+" EUR");auto.push("co");}
return {k:"eq|"+id,name:e.nom||id,cat:"Equipe Soleya",grp:"Equipe",
tel:e.waPhone||TEL_EQUIPE_FALLBACK[id]||"A completer",
email:e.email||"",delai:"Planifie",villas:[],fns:auto,
pri:(e.waPhone||TEL_EQUIPE_FALLBACK[id])?1:0,
note:roles.join(" · ")||"Tarifs a renseigner dans Gestion > Equipe"};
})
.sort((a,b)=>a.name.localeCompare(b.name));
const base=PRESTATAIRES.map(c=>({...c,k:c.name+"|"+c.cat,fns:c.fns||[]}));
const extra=Object.keys(REP).filter(k=>REP[k]&&REP[k]._new).map(k=>({
k:k,name:"",cat:"A preciser",grp:"Menage",tel:"A completer",email:"",
delai:"A preciser",villas:[],fns:[],pri:1,note:"",...REP[k]}));
return eqList.concat(base,extra).map(c=>{
const o=REP[c.k];
if(!o)return c;
return {...c,...o,k:c.k,villas:o.villas||c.villas,fns:o.fns||c.fns};
});
},[equipe,repertoire]);

const filtered=CONTACTS.filter(c=>{
const gok=grp==="Tous"||c.grp===grp;
const pok=pri==="Tous"||c.pri===pri;
const fok=fn==="Tous"||(c.fns||[]).indexOf(fn)>=0;
const t=search.toLowerCase().trim();
const tok=!t||[c.name,c.cat,c.note,...(c.villas||[])].some(x=>x&&x.toLowerCase().includes(t));
return gok&&pok&&fok&&tok;
});
const telLink=t=>t&&t.match(/[0-9]/)?"tel:"+t.replace(/[^0-9+]/g,""):null;
const selList=CONTACTS.filter(c=>sel[c.k]);
const nSel=selList.length;

// --- edition d une carte ---
const ouvrirEdit=c=>{setEdit(c.k);setForm({name:c.name||"",cat:c.cat||"",grp:c.grp||"Menage",
tel:c.tel||"",email:c.email||"",delai:c.delai||"",note:c.note||"",
pri:c.pri==null?1:c.pri,fns:(c.fns||[]).slice()});};
const ajouter=()=>{setEdit("new|"+Date.now());setForm({name:"",cat:"",grp:"Menage",tel:"",
email:"",delai:"",note:"",pri:1,fns:[]});};
const toggleFn=f=>setForm(p=>({...p,fns:p.fns.indexOf(f)>=0?p.fns.filter(x=>x!==f):p.fns.concat([f])}));
const enregistrer=()=>{
if(!form.name.trim()){dire("Il faut au moins un nom.",false);return;}
const patch={name:form.name.trim(),cat:form.cat.trim()||"A preciser",grp:form.grp,
tel:form.tel.trim()||"A completer",email:form.email.trim(),
delai:form.delai.trim()||"A preciser",note:form.note.trim(),
pri:Number(form.pri),fns:form.fns};
if(String(edit).indexOf("new|")===0)patch._new=true;
onSaveRepertoire({...REP,[edit]:patch});
setEdit(null);setForm(null);dire("Contact enregistre !");
};
const reinit=()=>{
const n={...REP};delete n[edit];onSaveRepertoire(n);
const etaitNeuf=String(edit).indexOf("new|")===0;
setEdit(null);setForm(null);
dire(etaitNeuf?"Contact retire.":"Carte revenue a sa version d origine.");
};

// --- diffusion WhatsApp ---
const JOURS_FR=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const MOIS_FR=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
// "2026-10-11" -> "Samedi 11 octobre". Construit a la main : le formatage par locale
// n est pas garanti identique d un telephone a l autre.
const jourDate=d=>{
if(!d)return "";
const p=d.split("-");
const dt=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
return JOURS_FR[dt.getDay()]+" "+Number(p[2])+" "+MOIS_FR[Number(p[1])-1];
};
// Les lignes date, heure et duree ne sont ecrites que si elles sont renseignees :
// mieux vaut un message plus court qu un message avec des trous.
const composer=()=>{
const l=["Bonjour, j'espère que tu vas bien \uD83D\uDE0A","",
"J'ai une demande de dernière minute à couvrir :","",
mt+(mv?" — "+mv:"")];
if(md)l.push("\uD83D\uDCC5 "+jourDate(md));
if(mh)l.push("\uD83D\uDD52 "+mh.replace(":","h"));
if(mdur)l.push("\u23F1\uFE0F Environ "+mdur);
l.push("","Est-ce que tu serais dispo ?",
"Je confirme la mission à la première personne disponible.","",
"Merci \uD83D\uDE4F","Johalann — Soleya Conciergerie");
return l.join("\n");
};

const n=waNumero(c.tel);
if(!n){dire("Numero manquant pour "+c.name,false);return;}
window.open("https://wa.me/"+n+"?text="+encodeURIComponent(msg),"_blank");
setSent(p=>({...p,[c.k]:true}));
};
const copier=()=>{
try{navigator.clipboard.writeText(msg);dire("Message copie !");}
catch(e){dire("Copie impossible sur ce navigateur.",false);}
};
