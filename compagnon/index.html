function VueBoard({missions,etats,villas,equipe,getStatut,setModule,notifier,gcal,anomalies,reservations,setVuePage,alerteVoyageur,sauver,evenements,resas}){ // === NEW: fusion alertes dans accueil ===
const today=new Date();
const tomorrow=new Date(today);tomorrow.setDate(tomorrow.getDate()+1);
const yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);
const fmtYMD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayStr=fmtYMD(today);
const tomorrowStr=fmtYMD(tomorrow);
const yesterdayStr=fmtYMD(yesterday);
// Evenements Google du jour
const gEventsToday=((gcal&&gcal.events)||[]).filter(e=>e.dateStr===todayStr).sort((a,b)=>{
  const ha=a.time||"00:00";const hb=b.time||"00:00";return ha.localeCompare(hb);
});
const dateOf=m=>etats[m.id]?.interventionDate||m.date;
const typeBadge=t=>t==="CI"?{bg:"#D6EAF8",c:"#1A5276"}:t==="CO"?{bg:"#FDE8DF",c:"#922B21"}:{bg:"#E8F8F5",c:"#1A6B4A"};
const heureExtract=m=>{const s=etats[m.id]||{};if(s.interventionTime)return s.interventionTime;if(m.type==="CI"&&m.detail){const x=m.detail.match(/(\d{1,2})[h:](\d{0,2})/);if(x)return x[1].padStart(2,"0")+":"+(x[2]||"00").padEnd(2,"0");}return null;};
// Section 1: aujourd'hui
const todayMissions=missions.filter(m=>dateOf(m)===todayStr).sort((a,b)=>{
  const ha=heureExtract(a)||"00:00";const hb=heureExtract(b)||"00:00";
  if(ha!==hb)return ha.localeCompare(hb);
  const ot={CI:0,Menage:1,CO:2};return (ot[a.type]??9)-(ot[b.type]??9);
});
// Section 2: missions confirmees pour demain (J-1 WA)
const tomorrowConfirmed=missions.filter(m=>{
  const s=etats[m.id]||{};
  return s.confirmedBy&&dateOf(m)===tomorrowStr;
}).sort((a,b)=>{const ha=heureExtract(a)||"00:00";const hb=heureExtract(b)||"00:00";return ha.localeCompare(hb);});
// Section 3: retours proprio en attente (CI/CO avec rapport recent + waProprio configure)
const ownerPending=missions.filter(m=>{
  if(m.type!=="CI"&&m.type!=="CO")return false;
  const s=etats[m.id]||{};
  if(!s.rapport)return false;
  const v=villas[m.villa];if(!v?.waProprio)return false;
  const d=dateOf(m);return d===todayStr||d===yesterdayStr;
}).sort((a,b)=>{const ra=etats[a.id]?.rapportAt||0;const rb=etats[b.id]?.rapportAt||0;return rb-ra;});
// Section 4: rapports recents (hier + aujourd'hui)
const recentReports=missions.filter(m=>{
  const s=etats[m.id]||{};
  if(!s.rapport)return false;
  const d=dateOf(m);return d===todayStr||d===yesterdayStr;
}).sort((a,b)=>{
  const da=dateOf(a),db=dateOf(b);if(da!==db)return db.localeCompare(da);
  const ra=etats[a.id]?.rapportAt||0;const rb=etats[b.id]?.rapportAt||0;return rb-ra;
});
// Helpers pour generer les messages
const buildWAIntervenante=(m,eq)=>{
  const s=etats[m.id]||{};
  return "Bonjour "+eq.nom+" !\n\nRappel : tu as une mission demain.\n\n"+m.type+" - "+m.villa+"\n"+fmtDate(dateOf(m))+(m.client?"\nClient : "+m.client:"")+(m.detail?"\n"+m.detail:"")+(s.interventionTime?"\nHeure : "+s.interventionTime:"")+"\n\nBonne journee, Soleya";
};
const buildOwnerMsg=m=>{
  const v=villas[m.villa]||{};const rap=etats[m.id]?.rapport||{};
  const caution=CAUTIONS[m.villa];
  if(m.type==="CI"){
    const yn=rap.yn||{};
    const cautionStr=m.cautionStatus==="airbnb"?"securisee via Airbnb":(yn.caution==="y"?"encaissee ("+caution+"E)":"non recuperee");
    const taxeStr=m.taxeAirbnb?"collectee en ligne":(yn.taxe==="y"?"collectee"+(m.taxeAmount?" ("+m.taxeAmount+"E)":""):"non collectee");
    return "Bonjour,\n\nCheck-in "+m.villa+" effectue le "+dateMaintenant()+"."
      +(m.client?"\n\nClients : "+m.client+(m.detail?"\nVol : "+m.detail:""):"")
      +"\n\nVilla conforme a leur arrivee."
      +(caution?"\nCaution : "+cautionStr:"")
      +(m.taxeAmount||m.taxeAirbnb?"\nTaxe de sejour : "+taxeStr:"")
      +(rap.note?"\n\nObservation : "+rap.note:"")
      +"\n\nBonne journee,\nSoleya Conciergerie";
  }
  if(m.type==="CO"){
    const items=rap.items||{};
    const nonConf=Object.values(items).filter(x=>x.rep==="non").length;
    const etat=nonConf===0?"Logement laisse propre et conforme.":"Quelques points signales (voir rapport).";
    const lingeTotal=Object.values(rap.linge||{}).reduce((s,v)=>s+v,0);
    return "Bonjour,\n\nCheck-out "+m.villa+" effectue le "+dateMaintenant()+"."
      +(m.client?"\n\nDepart : "+m.client:"")
      +"\n\n"+etat
      +(lingeTotal>0?"\nLinge recupere : "+lingeTotal+" pieces.":"")
      +(rap.note?"\n\nObservation : "+rap.note:"")
      +"\n\nBonne journee,\nSoleya Conciergerie";
  }
  return "";
};
const copier=t=>{try{navigator.clipboard.writeText(t);notifier("Copie");}catch(e){notifier("Copie impossible",false);}};
const dateLongue=today.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const dateDemain=tomorrow.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});

    </div>
    <span style={{background:(couleur||"#888")+"22",color:couleur||"#888",borderRadius:18,padding:"3px 11px",fontSize:"0.7rem",fontWeight:800}}>{count}</span>
  </div>
);
return <div>

<div style={{flex:1}}><div style={{fontSize:"1.3rem",fontWeight:800,color:"#9FE1CB"}}>{tomorrowConfirmed.length}</div><div style={{fontSize:"0.58rem",color:"rgba(255,255,255,0.5)",letterSpacing:.5,textTransform:"uppercase"}}>WA J-1</div></div>

{todayMissions.map(m=>{const s=etats[m.id]||{};const tb=typeBadge(m.type);const st=getStatut(m,etats);const vc=villas[m.villa]?.couleur||"#888";const h=heureExtract(m);const who=s.confirmedBy?(equipe[s.confirmedBy]?.nom)||s.confirmedBy:null;const typeMod=m.type==="CI"?"ci":m.type==="CO"?"co":"menage";const aRap=!!s.rapport;return (

</>}

// =============== EDL CLIENTS - Vue principale ===============
function VueEDL({edls,session,chargerEdls,loginEdl,logoutEdl,majStatutEdl,anomalies,onSaveAnomalies,notifier}){
const [email,setEmail]=useState("soleyaconciergerie@gmail.com");
const [pwd,setPwd]=useState("");
const [logging,setLogging]=useState(false);
const [erreurLogin,setErreurLogin]=useState("");
const [loading,setLoading]=useState(false);
const [filtreVilla,setFiltreVilla]=useState("");
const [filtreType,setFiltreType]=useState("");
const [filtreStatut,setFiltreStatut]=useState("");
const [recherche,setRecherche]=useState("");
const [tri,setTri]=useState("date");
const [sel,setSel]=useState(null);
const [refreshing,setRefreshing]=useState(false);

useEffect(()=>{if(session&&edls.length===0&&!loading){
  setLoading(true);chargerEdls().finally(()=>setLoading(false));
}},[session]);

const seConnecter=async()=>{
  setErreurLogin("");setLogging(true);
  try{await loginEdl(email,pwd);setPwd("");}
  catch(e){setErreurLogin(e.message||"Echec de connexion");}
  finally{setLogging(false);}
};
const rafraichir=async()=>{setRefreshing(true);await chargerEdls();setRefreshing(false);};

// === Ecran de connexion Supabase ===
if(!session){
  return <div style={{maxWidth:380,margin:"20px auto"}}>
    <div style={{textAlign:"center",marginBottom:18}}>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:"1.4rem",color:C.sombre,marginBottom:4}}>Etats des lieux clients</div>
      <div style={{fontSize:"0.72rem",color:"#888",lineHeight:1.5}}>Connexion securisee Supabase requise pour consulter les EDL soumis par les clients.</div>
    </div>
    <div style={{background:"white",borderRadius:14,padding:"18px 16px",boxShadow:"0 1px 8px rgba(0,0,0,0.07)"}}>

        <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="exemple@gmail.com" style={{width:"100%",padding:"10px",border:"1.5px solid #EEE",borderRadius:9,fontSize:"0.85rem",outline:"none",boxSizing:"border-box"}}/>
      </div>
      <div style={{marginBottom:14}}>
        <div style={{fontSize:"0.7rem",fontWeight:700,color:C.sombre,marginBottom:4}}>Mot de passe</div>
        <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&seConnecter()} placeholder="••••••" style={{width:"100%",padding:"10px",border:"1.5px solid #EEE",borderRadius:9,fontSize:"0.85rem",outline:"none",boxSizing:"border-box"}}/>
      </div>
      {erreurLogin&&<div style={{background:"#FCEBEB",color:"#A32D2D",padding:"8px 10px",borderRadius:8,fontSize:"0.72rem",marginBottom:11}}>{erreurLogin}</div>}
      <button onClick={seConnecter} disabled={logging||!email||!pwd} style={{width:"100%",padding:"11px",background:logging||!email||!pwd?"#CCC":C.vert,color:"white",border:"none",borderRadius:10,fontWeight:800,fontSize:"0.85rem",cursor:logging||!email||!pwd?"default":"pointer"}}>{logging?"Connexion...":"Se connecter"}</button>
    </div>
    <div style={{marginTop:14,padding:"10px 12px",background:"#FAFAFA",borderRadius:9,fontSize:"0.66rem",color:"#888",lineHeight:1.55}}>
      Cette connexion est independante du PIN de l'app : elle authentifie ton acces a la base Supabase qui stocke les EDL soumis depuis Netlify. Session conservee ~1h.
    </div>
  </div>;
}

// === Detail d'un EDL ===
if(sel){
  return <VueEDLDetail edl={sel} onClose={()=>setSel(null)} majStatut={(id,s)=>majStatutEdl(id,s).then(()=>setSel(prev=>prev?{...prev,statut:s}:null))} anomalies={anomalies} onSaveAnomalies={onSaveAnomalies} notifier={notifier}/>;
}

// === Liste filtree ===
const slugsDispo=[...new Set((edls||[]).map(e=>e.villa_slug).filter(Boolean))];
const filtres=(edls||[]).filter(e=>{
  if(filtreVilla&&e.villa_slug!==filtreVilla)return false;
  if(filtreType&&e.type!==filtreType)return false;
  if(filtreStatut&&(e.statut||"recu")!==filtreStatut)return false;
  if(recherche){
    const q=recherche.toLowerCase();
    const nom=edlClientNom(e).toLowerCase();
    const email=(e.client_email||"").toLowerCase();
    if(!nom.includes(q)&&!email.includes(q))return false;
  }
  return true;
}).sort((a,b)=>{
  if(tri==="anomalies")return (b.nb_items_non||0)-(a.nb_items_non||0);
  if(tri==="villa")return (a.villa_slug||"").localeCompare(b.villa_slug||"");
  return (b.created_at||"").localeCompare(a.created_at||"");
});

const stats={
  total:(edls||[]).length,
  anomalies:(edls||[]).filter(e=>(e.nb_items_non||0)>0).length,
  recents:(edls||[]).filter(e=>{const j=(Date.now()-new Date(e.created_at).getTime())/(1000*60*60*24);return j<=7;}).length,
  litige:(edls||[]).filter(e=>e.statut==="litige").length
};

return <div>

    </div>
    <div style={{display:"flex",gap:6}}>

      <button onClick={logoutEdl} style={{padding:"6px 12px",background:"white",color:"#A32D2D",border:"1px solid #EFCFCF",borderRadius:9,fontWeight:600,fontSize:"0.7rem",cursor:"pointer"}}>Deconnexion</button>
    </div>
  </div>

  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginBottom:12}}>
    {[{l:"Total",v:stats.total,c:C.sombre,bg:"white"},{l:"7 derniers j.",v:stats.recents,c:"#0F6E56",bg:"#E1F5EE"},{l:"Avec anomalies",v:stats.anomalies,c:"#854F0B",bg:"#FAEEDA"},{l:"En litige",v:stats.litige,c:"#A32D2D",bg:"#FCEBEB"}].map(s=>(
      <div key={s.l} style={{background:s.bg,borderRadius:10,padding:"10px 4px",textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
        <div style={{fontSize:"1.4rem",fontWeight:800,color:s.c,lineHeight:1}}>{s.v}</div>
        <div style={{fontSize:"0.58rem",color:s.c,fontWeight:700,marginTop:2}}>{s.l}</div>
      </div>))}
  </div>

  <div style={{background:"white",borderRadius:11,padding:"10px 12px",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
    <input type="text" value={recherche} onChange={e=>setRecherche(e.target.value)} placeholder="🔍 Rechercher par nom ou email client..." style={{width:"100%",padding:"8px 10px",border:"1px solid #EEE",borderRadius:8,fontSize:"0.78rem",outline:"none",boxSizing:"border-box",marginBottom:8}}/>

      {slugsDispo.map(s=><button key={s} onClick={()=>setFiltreVilla(s)} style={{padding:"4px 9px",borderRadius:18,border:"none",background:filtreVilla===s?edlVillaColor(s):"#F5F2ED",color:filtreVilla===s?"white":"#666",fontWeight:700,fontSize:"0.66rem",cursor:"pointer"}}>{edlVillaNom(s)}</button>)}
    </div>
    <div style={{display:"flex",gap:5,marginBottom:6,flexWrap:"wrap"}}>
      <button onClick={()=>setFiltreType("")} style={{padding:"4px 9px",borderRadius:18,border:"none",background:filtreType===""?C.sombre:"#F5F2ED",color:filtreType===""?"white":"#666",fontWeight:700,fontSize:"0.66rem",cursor:"pointer"}}>Tous types</button>
      <button onClick={()=>setFiltreType("entree")} style={{padding:"4px 9px",borderRadius:18,border:"none",background:filtreType==="entree"?"#0F6E56":"#F5F2ED",color:filtreType==="entree"?"white":"#666",fontWeight:700,fontSize:"0.66rem",cursor:"pointer"}}>🟢 Entree</button>
      <button onClick={()=>setFiltreType("sortie")} style={{padding:"4px 9px",borderRadius:18,border:"none",background:filtreType==="sortie"?"#1A5276":"#F5F2ED",color:filtreType==="sortie"?"white":"#666",fontWeight:700,fontSize:"0.66rem",cursor:"pointer"}}>🔵 Sortie</button>
    </div>
    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
      <button onClick={()=>setFiltreStatut("")} style={{padding:"4px 9px",borderRadius:18,border:"none",background:filtreStatut===""?C.sombre:"#F5F2ED",color:filtreStatut===""?"white":"#666",fontWeight:700,fontSize:"0.66rem",cursor:"pointer"}}>Tous statuts</button>
      {EDL_STATUTS.map(s=><button key={s[0]} onClick={()=>setFiltreStatut(s[0])} style={{padding:"4px 9px",borderRadius:18,border:"none",background:filtreStatut===s[0]?s[2]:"#F5F2ED",color:filtreStatut===s[0]?"white":"#666",fontWeight:700,fontSize:"0.66rem",cursor:"pointer"}}>{s[1]}</button>)}
    </div>
    <div style={{display:"flex",gap:5,marginTop:7,fontSize:"0.66rem",color:"#888",alignItems:"center"}}>
      <span style={{fontWeight:600}}>Trier par :</span>
      {[["date","Date"],["villa","Villa"],["anomalies","Anomalies"]].map(([k,l])=>(
        <button key={k} onClick={()=>setTri(k)} style={{padding:"3px 8px",borderRadius:14,border:"none",background:tri===k?C.vert:"transparent",color:tri===k?"white":"#666",fontWeight:600,fontSize:"0.65rem",cursor:"pointer"}}>{l}</button>
      ))}
    </div>
  </div>

  {loading?<div style={{textAlign:"center",padding:"40px 20px",color:"#999",fontSize:"0.85rem"}}>Chargement des EDL...</div>:
   filtres.length===0?<div style={{textAlign:"center",padding:"40px 20px",color:"#CCC",fontSize:"0.85rem"}}>{(edls||[]).length===0?"Aucun EDL recu pour le moment.":"Aucun EDL ne correspond aux filtres."}</div>:
   filtres.map(e=>{
     const sm=edlStatutMeta(e.statut||"recu");
     const tm=edlTypeMeta(e.type);
     const dArrivee=e.date_arrivee?new Date(e.date_arrivee+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}):"";
     const dDepart=e.date_depart?new Date(e.date_depart+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}):"";
     const dSoumis=new Date(e.created_at).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});

</div>;

// =============== EDL - Vue Detail (modal plein ecran) ===============
function VueEDLDetail({edl,onClose,majStatut,anomalies,onSaveAnomalies,notifier}){
const [imgLightbox,setImgLightbox]=useState(null);
const [printing,setPrinting]=useState(false);
const sm=edlStatutMeta(edl.statut||"recu");
const tm=edlTypeMeta(edl.type);
const villaNom=edlVillaNom(edl.villa_slug);
const villaCol=edlVillaColor(edl.villa_slug);
const inv=edl.inventaire&&edl.inventaire.rooms?edl.inventaire.rooms:[];
const notesPieces=edl.notes_pieces||{};
const photosPieces=edl.photos_pieces||{};
const dArrivee=edl.date_arrivee?new Date(edl.date_arrivee+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"";
const dDepart=edl.date_depart?new Date(edl.date_depart+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"";
const dSoumis=new Date(edl.created_at).toLocaleString("fr-FR",{dateStyle:"full",timeStyle:"short"});

const imprimer=()=>{
  setPrinting(true);
  setTimeout(()=>{window.print();setTimeout(()=>setPrinting(false),500);},150);
};

const creerAnomalie=()=>{
  const items=[];
  inv.forEach(room=>{
    if(room.items)room.items.forEach(item=>{
      if(item.value==="no")items.push(room.label+" — "+item.name);
    });
  });
  if(items.length===0){notifier("Aucun item 'non' a reporter",false);return;}
  // Mapping slug Supabase -> nom dans VILLAS_ANOMALIE
  const mapVA={lili:"Villa Lili",mae:"Villa Mae",rock:"On The Rock",blackstone:"Blackstone",nature:"Nature Paradise",philomene:"Happy Bay",happybay:"Happy Bay"};
  const villaAno=mapVA[edl.villa_slug]||"Autre";
  const a={
    id:"a"+Date.now()+Math.random().toString(36).slice(2,6),
    villa:villaAno,
    title:items.length+" anomalie(s) signalee(s) par client - "+new Date(edl.created_at).toLocaleDateString("fr-FR"),
    desc:"EDL "+(edl.type==="entree"?"d'entree":"de sortie")+" du "+new Date(edl.created_at).toLocaleDateString("fr-FR")+" par "+edlClientNom(edl)+"\n\nItems signales NON conformes :\n- "+items.join("\n- ")+(edl.observations?"\n\nObservations du client : "+edl.observations:""),
    cat:"Autre",
    who:edlClientNom(edl),
    status:"open",prest:"",cost:"",
    date:edl.created_at.slice(0,10),
    notes:"Cree depuis EDL #"+edl.id.slice(0,8),
    edl_id:edl.id
  };
  if((anomalies||[]).some(x=>x.edl_id===edl.id)){
    if(!confirm("Une anomalie a deja ete creee pour cet EDL. En recreer une nouvelle ?"))return;
  }
  onSaveAnomalies([a,...(anomalies||[])]);
  notifier("Anomalie creee ("+items.length+" items) — voir onglet Anomalies");
};

const couleurItem=v=>v==="yes"?{bg:"#E1F5EE",c:"#0F6E56",ico:"✓"}:v==="no"?{bg:"#FCEBEB",c:"#A32D2D",ico:"✗"}:{bg:"#F5F5F5",c:"#999",ico:"—"};

return <div>
  <style>{`
    @media print {
      body * { visibility: hidden !important; }
      .edl-print, .edl-print * { visibility: visible !important; }
      .edl-print { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; background: white !important; }
      .edl-no-print { display: none !important; }
      .edl-page-break { page-break-before: always; }
    }
  `}</style>

  <div className="edl-no-print" style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,gap:8,flexWrap:"wrap"}}>
    <button onClick={onClose} style={{background:"none",border:"none",color:C.sombre,fontWeight:700,fontSize:"0.82rem",cursor:"pointer",padding:0}}>← Retour</button>
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      <select value={edl.statut||"recu"} onChange={e=>majStatut(edl.id,e.target.value)} style={{padding:"6px 10px",border:"1px solid #DDD",borderRadius:9,fontSize:"0.72rem",background:sm[3],color:sm[2],fontWeight:700,cursor:"pointer"}}>
        {EDL_STATUTS.map(s=><option key={s[0]} value={s[0]}>{s[1]}</option>)}
      </select>
      <button onClick={imprimer} style={{padding:"6px 12px",background:"white",color:C.sombre,border:"1px solid #DDD",borderRadius:9,fontWeight:700,fontSize:"0.72rem",cursor:"pointer"}}>🖨 Imprimer</button>
      {(edl.nb_items_non||0)>0&&<button onClick={creerAnomalie} style={{padding:"6px 12px",background:"#FCEBEB",color:"#A32D2D",border:"1px solid #EFCFCF",borderRadius:9,fontWeight:700,fontSize:"0.72rem",cursor:"pointer"}}>+ Anomalie</button>}
    </div>
  </div>

  <div className="edl-print">
    <div style={{background:"white",borderRadius:14,padding:"16px 16px",marginBottom:12,boxShadow:"0 1px 8px rgba(0,0,0,0.06)",borderTop:"5px solid "+villaCol}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
        <span style={{background:villaCol+"22",color:villaCol,padding:"3px 10px",borderRadius:7,fontSize:"0.7rem",fontWeight:800,textTransform:"uppercase",letterSpacing:.5}}>{villaNom}</span>
        <span style={{background:tm.bg,color:tm.c,padding:"3px 9px",borderRadius:7,fontSize:"0.7rem",fontWeight:700}}>{tm.icon} EDL {tm.label}</span>
        <span style={{background:sm[3],color:sm[2],padding:"3px 9px",borderRadius:7,fontSize:"0.7rem",fontWeight:700}}>{sm[1]}</span>
        {(edl.nb_items_non||0)>0&&<span style={{background:"#FCEBEB",color:"#A32D2D",padding:"3px 9px",borderRadius:7,fontSize:"0.7rem",fontWeight:800}}>⚠ {edl.nb_items_non} anomalie{edl.nb_items_non>1?"s":""}</span>}
      </div>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:"1.3rem",color:C.sombre,marginBottom:4}}>{edlClientNom(edl)}</div>
      <div style={{fontSize:"0.78rem",color:"#666",marginBottom:8}}>
        <b style={{color:C.sombre}}>Sejour :</b> du {dArrivee} au {dDepart}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,fontSize:"0.72rem",color:"#666"}}>
        {edl.client_email&&<div><b style={{color:C.sombre}}>Email :</b> <a href={"mailto:"+edl.client_email} style={{color:C.vert}}>{edl.client_email}</a></div>}
        {edl.client_phone&&<div><b style={{color:C.sombre}}>Tel :</b> <a href={"tel:"+edl.client_phone.replace(/\s/g,"")} style={{color:C.vert}}>{edl.client_phone}</a></div>}
        {edl.nb_personnes&&<div><b style={{color:C.sombre}}>Personnes :</b> {edl.nb_personnes}</div>}
        <div><b style={{color:C.sombre}}>Soumis :</b> {dSoumis}</div>
      </div>
      {(edl.nb_items_total||edl.nb_items_ok||edl.nb_items_non)&&<div style={{display:"flex",gap:14,marginTop:10,paddingTop:10,borderTop:"0.5px solid #EEE",fontSize:"0.72rem"}}>
        {edl.nb_items_total&&<span><b style={{color:C.sombre}}>{edl.nb_items_total}</b> items verifies</span>}
        {edl.nb_items_ok!==undefined&&<span style={{color:"#0F6E56"}}><b>✓ {edl.nb_items_ok}</b> conformes</span>}
        {(edl.nb_items_non||0)>0&&<span style={{color:"#A32D2D"}}><b>✗ {edl.nb_items_non}</b> non conformes</span>}

    </div>

    {inv.length>0&&<div style={{marginBottom:12}}>
      <div style={{fontWeight:800,fontSize:"0.85rem",color:C.sombre,marginBottom:8,fontFamily:"'Playfair Display',serif"}}>Inventaire par piece</div>

        const items=room.items||[];
        const notes=notesPieces[room.id]||"";
        const photos=photosPieces[room.id]||[];
        const nbNon=items.filter(it=>it.value==="no").length;
        return <details key={room.id} open={nbNon>0} style={{background:"white",borderRadius:11,marginBottom:8,boxShadow:"0 1px 4px rgba(0,0,0,0.05)",overflow:"hidden"}}>
          <summary style={{padding:"11px 13px",cursor:"pointer",listStyle:"none",display:"flex",alignItems:"center",justifyContent:"space-between",fontWeight:700,fontSize:"0.82rem",color:C.sombre,background:nbNon>0?"#FCEBEB22":"transparent"}}>
            <span>{room.label} <span style={{fontWeight:500,color:"#888",fontSize:"0.72rem"}}>({items.length} items)</span></span>
            <span style={{display:"flex",gap:6,alignItems:"center"}}>
              {nbNon>0&&<span style={{background:"#FCEBEB",color:"#A32D2D",padding:"2px 7px",borderRadius:6,fontSize:"0.62rem",fontWeight:800}}>{nbNon} ✗</span>}
              {photos.length>0&&<span style={{background:"#F5F2ED",color:"#666",padding:"2px 7px",borderRadius:6,fontSize:"0.62rem",fontWeight:700}}>📷 {photos.length}</span>}
              <span style={{color:"#999",fontSize:"0.7rem"}}>▾</span>
            </span>
          </summary>
          <div style={{padding:"0 13px 12px"}}>
            {items.length===0?<div style={{fontSize:"0.72rem",color:"#AAA",padding:"6px 0"}}>(aucun item)</div>:
              items.map((it,i)=>{const cl=couleurItem(it.value);
                return <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 0",borderBottom:i<items.length-1?"0.5px solid #F5F5F5":"none",fontSize:"0.76rem"}}>
                  <span style={{color:it.value==="no"?"#A32D2D":it.value==="yes"?C.sombre:"#999",flex:1}}>{it.name}</span>
                  <span style={{background:cl.bg,color:cl.c,padding:"2px 8px",borderRadius:5,fontSize:"0.66rem",fontWeight:800,minWidth:24,textAlign:"center"}}>{cl.ico}</span>
                </div>;
              })}
            {notes&&<div style={{marginTop:10,padding:"7px 10px",background:"#FFFDE7",border:"0.5px solid #F9C74F",borderRadius:7,fontSize:"0.72rem",color:"#5C4009",lineHeight:1.5}}>
              <b>Note du client :</b> {notes}
            </div>}
            {photos.length>0&&<div style={{marginTop:10,display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(80px,1fr))",gap:6}}>
              {photos.map((p,i)=><img key={i} src={p} alt="" onClick={()=>setImgLightbox(p)} className="edl-no-print" style={{width:"100%",height:80,objectFit:"cover",borderRadius:7,cursor:"pointer",border:"1px solid #EEE"}}/>)}
              {photos.map((p,i)=><img key={"p"+i} src={p} alt="" style={{width:"100%",maxHeight:200,objectFit:"contain",display:"none"}} data-print="1"/>)}
            </div>}
          </div>
        </details>;
      })}
    </div>}

    {edl.observations&&<div style={{background:"white",borderRadius:11,padding:"12px 14px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
      <div style={{fontWeight:800,fontSize:"0.75rem",color:C.sombre,textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Observations du client</div>
      <div style={{fontSize:"0.8rem",color:"#444",lineHeight:1.55,whiteSpace:"pre-wrap"}}>{edl.observations}</div>
    </div>}

    <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
      {edl.regles_principales_ok&&<div style={{flex:1,minWidth:120,background:"#E1F5EE",border:"1px solid #9FE1CB",borderRadius:9,padding:"8px 11px",fontSize:"0.72rem",color:"#0F6E56",fontWeight:700}}>✓ Reglement accepte</div>}
      {edl.regles_depart_ok&&<div style={{flex:1,minWidth:120,background:"#E1F5EE",border:"1px solid #9FE1CB",borderRadius:9,padding:"8px 11px",fontSize:"0.72rem",color:"#0F6E56",fontWeight:700}}>✓ Regles depart OK</div>}
    </div>

    {edl.signature&&<div style={{background:"white",borderRadius:11,padding:"12px 14px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
      <div style={{fontWeight:800,fontSize:"0.75rem",color:C.sombre,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Signature du client</div>
      <div style={{background:"#FAFAFA",border:"1px dashed #DDD",borderRadius:8,padding:8,textAlign:"center"}}>
        <img src={edl.signature} alt="Signature" style={{maxWidth:"100%",maxHeight:120}}/>
      </div>
      <div style={{fontSize:"0.66rem",color:"#888",marginTop:6,textAlign:"center"}}>Signe par {edlClientNom(edl)} — {dSoumis}</div>
    </div>}
  </div>

  {imgLightbox&&<div onClick={()=>setImgLightbox(null)} className="edl-no-print" style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:20,cursor:"zoom-out"}}>
    <img src={imgLightbox} alt="" style={{maxWidth:"100%",maxHeight:"100%",borderRadius:8,boxShadow:"0 8px 40px rgba(0,0,0,0.5)"}}/>
    <button onClick={e=>{e.stopPropagation();setImgLightbox(null);}} style={{position:"absolute",top:18,right:18,background:"white",border:"none",borderRadius:"50%",width:38,height:38,fontSize:"1.4rem",cursor:"pointer",fontWeight:700,color:C.sombre}}>×</button>
  </div>}
</div>;
}

if (__boot && __boot.parentNode) __boot.parentNode.removeChild(__boot);
