<script>
"use strict";
// ================= Configuration (même projet Supabase que l'appli Soleya) =================
const SUPA={url:"https://ihcqrqcmtcmunlnymaip.supabase.co",anon:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloY3FycWNtdGNtdW5sbnltYWlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NzQzMTcsImV4cCI6MjA5NDM1MDMxN30.KKBH2Nl4iwYagifjDp8qNGD3NTnm4ky1Uby9f2s6660"};
const CLE_SESSION="soleya-proprio-session";
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOISC=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];

// ================= Utilitaires =================
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>(Math.round((Number(n)||0)*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const dObj=ymd=>new Date(ymd+"T12:00:00");
const jj=ymd=>ymd?ymd.slice(8,10)+"/"+ymd.slice(5,7):"";
const jourCourt=ymd=>{const d=dObj(ymd);return JOURS[d.getDay()]+" "+d.getDate()+" "+MOISC[d.getMonth()];};
const ymdDe=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const lireStock=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
const ecrireStock=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

// ================= Session =================
let session=lireStock(CLE_SESSION)||{access_token:"demo",refresh_token:"demo",expires_at:Date.now()+864e5};
async function connexion(email,mdp){
  const r=await fetch(SUPA.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPA.anon},body:JSON.stringify({email,password:mdp})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||"Connexion impossible");
  session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000};
  ecrireStock(CLE_SESSION,session);
}
async function jetonValide(){
  if(!session||!session.refresh_token)return null;
  if(session.expires_at&&Date.now()<session.expires_at-60000)return session.access_token;
  const r=await fetch(SUPA.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPA.anon},body:JSON.stringify({refresh_token:session.refresh_token})});
  if(!r.ok){deconnexion();return null;}
  const j=await r.json();
  session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000};
  ecrireStock(CLE_SESSION,session);return session.access_token;
}
function deconnexion(){session=null;ecrireStock(CLE_SESSION,null);donnees=null;rendre();}
async function api(chemin,options){
  const t=await jetonValide();if(!t)throw new Error("non_connecte");
  const o=options||{};
  const r=await fetch(SUPA.url+chemin,{...o,headers:{apikey:SUPA.anon,Authorization:"Bearer "+t,"Content-Type":"application/json",...(o.headers||{})}});
  if(r.status===401){deconnexion();throw new Error("non_connecte");}
  return r;
}

  erreur="";

    const r=await api("/functions/v1/espace-proprio");

  }catch(e){if(e.message!=="non_connecte")erreur="Connexion au serveur impossible. Vérifiez votre réseau.";}
  rendre();
}

function ecranConnexion(){
  return `<div class="connexion"><div class="boite">

const estDemande=e=>e.type==="sejour_proprio"&&e.details&&e.details.type_sejour==="voyageurs";
function demandePour(e){return (donnees.evenements||[]).filter(x=>estDemande(x)&&x.villa===e.villa&&x.debut===e.debut&&x.fin===e.fin).pop()||null;}
function libBesoins(d){const l=[d.besoin_checkin&&"accueil",d.besoin_menage&&"ménage",d.besoin_linge&&"linge",d.besoin_checkout&&"départ"].filter(Boolean);return l.length?l.join(", "):"pas d'intervention Soleya";}
function evtsFiltres(){return (donnees.evenements||[]).filter(e=>!estDemande(e)).filter(e=>!villaFiltre||e.villa===villaFiltre).slice().sort((a,b)=>a.debut<b.debut?-1:a.debut>b.debut?1:0);}
function badgeStatut(e){
  if(e.type==="sejour_proprio"&&e.details&&e.details.en_attente)return `<span class="badge b-attente">En attente de validation</span>`;
  if(e.type==="sejour"||e.type==="sejour_proprio")return "";
  if(e.statut==="fait")return `<span class="badge b-ok">Fait ✓</span>`;
  if(e.statut==="confirme")return `<span class="badge b-ok">Confirmé ✓</span>`;
  return `<span class="badge b-prevu">Prévu</span>`;
}
function ligneEvt(e,plusieursVillas){
  const d=e.debut;const fin=e.fin&&e.fin!==e.debut?` → ${jourCourt(e.fin)}`:"";
  const sous=[plusieursVillas?e.villa:"",e.heure?("à "+e.heure.replace(":","h")):"",fin?("jusqu'au "+jourCourt(e.fin)):""].filter(Boolean).join(" · ");
  let actions=e.type==="sejour_proprio"?`<div class="ligne-btn"><button class="btn clair petit" data-annuler="${esc(e.id)}">Annuler ce séjour</button></div>`:"";
  if(e.rapportDispo)actions=`<div class="ligne-btn"><button class="btn clair petit" data-rapport="${esc(e.id)}">Voir le rapport</button></div>`;
  if(e.type==="sejour"){
    const dm=demandePour(e);const cle=e.villa+"|"+e.debut+"|"+e.fin;
    if(formBesoins&&formBesoins.cle===cle)actions=formulaireBesoins();
    else actions=(dm?`<div class="s" style="color:var(--vert);font-weight:700">Votre demande : ${esc(libBesoins(dm.details))}</div>`:"")+`<div class="ligne-btn"><button class="btn clair petit" data-besoins="${esc(cle)}">${dm?"Modifier ma demande":"Mes besoins Soleya"}</button></div>`;
  }
  return `<div class="item"><div class="pastille"><b>${dObj(d).getDate()}</b><span>${MOISC[dObj(d).getMonth()].replace(".","")}</span></div>
  <div class="txt"><div class="t">${esc(e.titre)} ${badgeStatut(e)}</div>${sous?`<div class="s">${esc(sous)}</div>`:""}${actions}</div></div>`;
}

function grilleMois(){
  const [a,m]=moisAff.split("-").map(Number);const prem=new Date(a,m-1,1);const decal=(prem.getDay()+6)%7;
  const debut=new Date(a,m-1,1-decal);const auj=donnees.aujourdhui;const evts=evtsFiltres();
  let h=["lun","mar","mer","jeu","ven","sam","dim"].map(j=>`<div class="jsem">${j}</div>`).join("");
  for(let i=0;i<42;i++){
    const d=new Date(debut);d.setDate(debut.getDate()+i);const y=ymdDe(d);
    const du=evts.filter(e=>y>=e.debut&&y<=(e.fin||e.debut)).filter(e=>!(e.type==="sejour"||e.type==="sejour_proprio")||true);
    const puces=du.slice(0,3).map(e=>{const lib=e.type==="sejour"?(y===e.debut?"Arrivée":y===e.fin?"Départ":"Séjour"):e.type==="sejour_proprio"?(y===e.debut?"Vous ↘":y===e.fin?"Vous ↗":"Vous"):e.titre;return `<div class="puce p-${e.type}">${esc(lib)}</div>`;}).join("")+(du.length>3?`<div class="puce">+${du.length-3}</div>`:"");
    h+=`<div class="jour${d.getMonth()!==m-1?" autre":""}${y===auj?" auj":""}"><div class="n">${d.getDate()}</div>${puces}</div>`;
    if(i>=34&&d.getMonth()!==m-1&&d.getDay()===0)break;
  }
  return h;
}

  }
  if(x.observation)corps+=`<div class="carte"><h3>Observation</h3><div class="s" style="white-space:pre-wrap">${esc(x.observation)}</div></div>`;
  return `<div class="voile" id="voile"><div class="feuille">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px"><div><h2 style="margin:0">${esc(x.titre)}</h2><div class="sous" style="margin:2px 0 0">${esc(x.villa)} · ${esc(jourCourt(x.date))}${h?" · "+esc(h):""}</div></div><button class="btn clair petit" data-fermer-rapport>Fermer</button></div>
    ${corps}</div></div>`;
}

// ================= Rendu =================
function rendre(){
  const app=document.getElementById("app");
  if(modeAuth==="nouveau"&&session){app.innerHTML=ecranNouveauMdp();brancher();return;}
  if(!session){app.innerHTML=modeAuth==="oubli"?ecranOubli():ecranConnexion();brancher();return;}
  if(!donnees){app.innerHTML=erreur?`<main><div class="erreur">${esc(erreur)}</div><button class="btn" id="reessayer">Réessayer</button> <button class="btn clair" id="sortir2">Se déconnecter</button></main>`:`<div class="chargement">Chargement…</div>`;brancher();return;}
  const corps=onglet==="calendrier"?ecranCalendrier():onglet==="suivi"?ecranSuivi():onglet==="documents"?ecranDocuments():ecranAccueil();
  const nbSuivi=(donnees.suivi||[]).filter(a=>a.statut!=="resolu"&&!a.reponse).length;
  app.innerHTML=`<div class="entete"><div class="ligne"><div class="marque"><img src="img/logo.png" alt=""><div><b>Soleya</b><span>Espace propriétaire</span></div></div><a class="bouton-sortie" href="index.html" style="text-decoration:none">← Démo</a></div></div>
  <nav class="onglets"><div class="in">${[["accueil","Accueil"],["calendrier","Calendrier"],["suivi","Suivi"+(nbSuivi?" ("+nbSuivi+")":"")],["documents","Documents"]].map(([k,l])=>`<button class="${onglet===k?"actif":""}" data-onglet="${k}">${l}</button>`).join("")}</div></nav>
  <main>${corps}</main>${rapportOuvert?feuilleRapport():""}`;
  brancher();
}

function brancher(){
  const $=id=>document.getElementById(id);
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener("click",fn));
  if($("c-ok")){const go=async()=>{const b=$("c-ok");b.disabled=true;erreur="";try{await connexion($("c-email").value.trim().toLowerCase(),$("c-mdp").value);await charger();}catch(e){erreur=/invalid/i.test(e.message)?"Email ou mot de passe incorrect.":e.message;rendre();}};$("c-ok").onclick=go;$("c-mdp").onkeydown=e=>{if(e.key==="Enter")go();};}
  document.querySelectorAll("[data-oeil]").forEach(b=>b.onclick=ev=>{ev.preventDefault();const i=$(b.dataset.oeil);if(!i)return;const v=i.type==="password";i.type=v?"text":"password";b.textContent=v?"🙈":"👁";});
  if($("sortir"))$("sortir").onclick=deconnexion;
  if($("c-oubli"))$("c-oubli").onclick=()=>{modeAuth="oubli";messageAuth=null;erreur="";rendre();};
  if($("o-retour"))$("o-retour").onclick=()=>{modeAuth=null;messageAuth=null;rendre();};
  if($("o-ok")){const go=async()=>{
    const email=$("o-email").value.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(email)){messageAuth={ok:false,t:"Indiquez une adresse email valide."};return rendre();}
    $("o-ok").disabled=true;
    try{
      const r=await fetch(SUPA.url+"/auth/v1/recover?redirect_to="+encodeURIComponent(location.origin+location.pathname),{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPA.anon},body:JSON.stringify({email})});
      if(r.status===429){messageAuth={ok:false,t:"Trop de demandes. Réessayez dans quelques minutes."};}
      else messageAuth={ok:true,t:"Si cette adresse correspond à un espace Soleya, un email vient de vous être envoyé. Pensez à regarder dans les indésirables."};
    }catch(e){messageAuth={ok:false,t:"Envoi impossible. Vérifiez votre connexion."};}
    rendre();};$("o-ok").onclick=go;$("o-email").onkeydown=e=>{if(e.key==="Enter")go();};}
  if($("n-ok"))$("n-ok").onclick=async()=>{
    const a=$("n-mdp1").value,b=$("n-mdp2").value;
    if(a.length<8){messageAuth={ok:false,t:"8 caractères minimum."};return rendre();}
    if(a!==b){messageAuth={ok:false,t:"Les deux mots de passe ne correspondent pas."};return rendre();}
    $("n-ok").disabled=true;
    try{const r=await api("/auth/v1/user",{method:"PUT",body:JSON.stringify({password:a})});
      if(!r.ok){const j=await r.json().catch(()=>({}));messageAuth={ok:false,t:/same|different/i.test(j.msg||j.error_description||"")?"Choisissez un mot de passe différent de l'ancien.":"Enregistrement impossible. Choisissez un autre mot de passe."};return rendre();}
      modeAuth=null;messageAuth=null;messageCompte={ok:true,t:"Nouveau mot de passe enregistré ✓"};prevenirSoleya("🔑 Mot de passe réinitialisé","Un propriétaire a choisi un nouveau mot de passe");await charger();
    }catch(e){messageAuth={ok:false,t:"Le lien a expiré. Refaites une demande de mot de passe oublié."};modeAuth="oubli";session=null;ecrireStock(CLE_SESSION,null);rendre();}
  };
  if($("m-notifs"))$("m-notifs").onchange=async e=>{
    const v=e.target.checked;
    try{const r=await api("/functions/v1/espace-proprio",{method:"POST",body:JSON.stringify({notifs_mail:v})});if(!r.ok)throw new Error();donnees.notifsMail=v;messageCompte={ok:true,t:v?"Mails de nouveautés activés ✓":"Vous ne recevrez plus de mail de nouveautés."};}
    catch(err){messageCompte={ok:false,t:"Modification impossible pour le moment."};}
    rendre();};
  if($("m-ok"))$("m-ok").onclick=async()=>{
    const a=$("m-mdp1").value,b=$("m-mdp2").value;
    if(a.length<8){messageCompte={ok:false,t:"8 caractères minimum."};return rendre();}
    if(a!==b){messageCompte={ok:false,t:"Les deux mots de passe ne correspondent pas."};return rendre();}
    $("m-ok").disabled=true;
    try{const r=await api("/auth/v1/user",{method:"PUT",body:JSON.stringify({password:a})});
      messageCompte=r.ok?{ok:true,t:"Mot de passe modifié ✓"}:{ok:false,t:"Modification impossible. Choisissez un autre mot de passe."};}
    catch(e){messageCompte={ok:false,t:"Modification impossible pour le moment."};}
    rendre();};
  if($("sortir2"))$("sortir2").onclick=deconnexion;
  if($("reessayer"))$("reessayer").onclick=charger;
  on("[data-onglet]",e=>{onglet=e.currentTarget.dataset.onglet;ecrireStock("soleya-proprio-onglet",onglet);messageInfo="";erreur="";messageCompte=null;rendre();window.scrollTo(0,0);});
  on("[data-aller]",e=>{onglet=e.currentTarget.dataset.aller;rendre();window.scrollTo(0,0);});
  on("[data-vue]",e=>{vueCal=e.currentTarget.dataset.vue;rendre();});
  on("[data-mois]",e=>{const [a,m]=moisAff.split("-").map(Number);const d=new Date(a,m-1+Number(e.currentTarget.dataset.mois),1);moisAff=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");rendre();});
  if($("f-villa-filtre"))$("f-villa-filtre").onchange=e=>{villaFiltre=e.target.value;rendre();};
  if($("ouvrir-sejour"))$("ouvrir-sejour").onclick=()=>{messageInfo="";erreur="";formSejour={villa:donnees.villas[0].nom,arrivee:"",depart:"",type:"personnel",voyageurs:"",nom:"",menage:true,linge:false,ci:false,co:false,com:""};rendre();};
  if($("s-annuler"))$("s-annuler").onclick=()=>{formSejour=null;erreur="";rendre();};
  if($("s-ok"))$("s-ok").onclick=async()=>{
    const f={villa:$("s-villa")?$("s-villa").value:donnees.villas[0].nom,arrivee:$("s-arrivee").value,depart:$("s-depart").value,type:$("s-type").value,voyageurs:$("s-voy").value,nom:$("s-nom").value.trim(),menage:$("s-menage").checked,linge:$("s-linge").checked,ci:$("s-ci").checked,co:$("s-co").checked,com:$("s-com").value.trim()};
    formSejour=f;erreur="";
    if(!f.arrivee||!f.depart){erreur="Indiquez les dates d'arrivée et de départ.";return rendre();}
    if(f.depart<=f.arrivee){erreur="La date de départ doit être après la date d'arrivée (au moins une nuit).";return rendre();}
    const chevauche=(donnees.evenements||[]).find(e=>(e.type==="sejour"||e.type==="sejour_proprio")&&e.villa===f.villa&&f.arrivee<(e.fin||e.debut)&&f.depart>e.debut);
    if(chevauche&&false&&!confirm("Ces dates chevauchent un séjour déjà prévu ("+jj(chevauche.debut)+" → "+jj(chevauche.fin)+"). Votre séjour sera enregistré en attente de validation par Soleya. Continuer ?"))return;
    const b=$("s-ok");b.disabled=true;
    try{
      const r=await api("/rest/v1/sejours_proprio",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({villa:f.villa,arrivee:f.arrivee,depart:f.depart,type_sejour:f.type,nom:f.nom||null,voyageurs:f.voyageurs?Number(f.voyageurs):null,besoin_menage:f.menage,besoin_linge:f.linge,besoin_checkin:f.ci,besoin_checkout:f.co,commentaire:f.com||null})});
      if(!r.ok)throw new Error();
      formSejour=null;messageInfo=chevauche?"Séjour enregistré, en attente de validation par Soleya.":"Séjour enregistré. Soleya en est informée.";prevenirSoleya(chevauche?"⚠️ Séjour propriétaire à valider (chevauchement)":"🏠 Nouveau séjour propriétaire",f.villa+" · "+jj(f.arrivee)+" → "+jj(f.depart)+(donnees.nom?" · "+donnees.nom:""));await charger();
    }catch(e){erreur="Enregistrement impossible. Réessayez.";rendre();}
  };
  on("[data-rapport]",async e=>{
    const id=e.currentTarget.dataset.rapport;rapportOuvert={chargement:true};rendre();
    try{const r=await api("/functions/v1/espace-proprio?rapport="+encodeURIComponent(id));const j=await r.json();rapportOuvert=j.ok?{data:j.rapport}:{erreur:true};}
    catch(err){rapportOuvert={erreur:true};}
    rendre();
  });
  on("[data-fermer-rapport]",()=>{rapportOuvert=null;rendre();});
  if($("voile"))$("voile").onclick=ev=>{if(ev.target.id==="voile"){rapportOuvert=null;rendre();}};
  on("[data-besoins]",e=>{
    const [villa,debut,fin]=e.currentTarget.dataset.besoins.split("|");
    const dm=demandePour({villa,debut,fin});const d=dm?dm.details:{};
    formBesoins={cle:e.currentTarget.dataset.besoins,villa,debut,fin,id:dm?dm.id:null,ci:!!d.besoin_checkin,menage:dm?!!d.besoin_menage:true,linge:!!d.besoin_linge,co:!!d.besoin_checkout,com:d.commentaire||""};
    messageInfo="";rendre();
  });
  if($("b-annuler"))$("b-annuler").onclick=()=>{formBesoins=null;rendre();};
  if($("b-ok"))$("b-ok").onclick=async()=>{
    const f=formBesoins;$("b-ok").disabled=true;
    const corps={besoin_checkin:$("b-ci").checked,besoin_menage:$("b-menage").checked,besoin_linge:$("b-linge").checked,besoin_checkout:$("b-co").checked,commentaire:$("b-com").value.trim()||null,vu_par_soleya:false,annule:false};
    try{
      const r=f.id?await api("/rest/v1/sejours_proprio?id=eq."+encodeURIComponent(f.id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(corps)})
        :await api("/rest/v1/sejours_proprio",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({...corps,villa:f.villa,arrivee:f.debut,depart:f.fin,type_sejour:"voyageurs",nom:"Séjour voyageurs"})});
      if(!r.ok)throw new Error();
      prevenirSoleya("🛎 Demande sur un séjour",f.villa+" · "+jj(f.debut)+" → "+jj(f.fin)+" : "+libBesoins(corps));
      formBesoins=null;messageInfo="Demande envoyée à Soleya.";await charger();
    }catch(e){rendre();}
  };
  on("[data-annuler]",async e=>{
    
    const id=e.currentTarget.dataset.annuler;
    const r=await api("/rest/v1/sejours_proprio?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({annule:true,vu_par_soleya:false})});
    if(r.ok){const ev=(donnees.evenements||[]).find(x=>x.id===id);prevenirSoleya("❌ Séjour propriétaire annulé",ev?ev.villa+" · "+jj(ev.debut)+" → "+jj(ev.fin):"Un séjour a été annulé");}
    messageInfo=r.ok?"Séjour annulé.":"";erreur=r.ok?"":"Annulation impossible.";await charger();
  });
  on("[data-rep]",async e=>{
    const [id,villa,rep]=e.currentTarget.dataset.rep.split("|");
    const com="";
    e.currentTarget.disabled=true;
    const r=await api("/rest/v1/reponses_proprio",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({anomalie_id:id,villa,reponse:rep,commentaire:com||null})});
    if(!r.ok){}
    else{const a=(donnees.suivi||[]).find(x=>x.id===id);prevenirSoleya("💬 Réponse propriétaire",villa+" · "+(a?a.titre:"anomalie")+" : "+(LIB_REP[rep]||rep)+(com?" — "+com:""));}
    await charger();
  });
}

// ================= Démarrage =================
(function lienEmail(){
  const h=new URLSearchParams((location.hash||"").replace(/^#/,""));
  if(!h.get("access_token")&&!h.get("error")&&!h.get("error_description"))return;
  history.replaceState(null,"",location.pathname+location.search);
  if(h.get("error")||h.get("error_description")){modeAuth="oubli";messageAuth={ok:false,t:"Ce lien n'est plus valable (il expire au bout d'une heure et ne sert qu'une fois). Refaites une demande ci-dessous."};session=null;ecrireStock(CLE_SESSION,null);return;}
  session={access_token:h.get("access_token"),refresh_token:h.get("refresh_token"),expires_at:Date.now()+(Number(h.get("expires_in"))||3600)*1000};
  ecrireStock(CLE_SESSION,session);
  if(h.get("type")==="recovery")modeAuth="nouveau";
})();
setTimeout(()=>{if(modeAuth==="nouveau"||!session)rendre();else charger();},0);
</script>
<script>
(function(){
const T={
 accueil:"<b>L'accueil de votre espace.</b> Ce qui attend une réponse de votre part, le dernier passage de l'équipe et les prochaines arrivées. Essayez « Voir le rapport ».",
 calendrier:"<b>Votre villa en un coup d'œil.</b> Réservations, accueils, ménages et vos propres séjours. Ajoutez un séjour : Soleya est prévenue tout de suite et organise le ménage et le linge.",
 suivi:"<b>Vous gardez la main.</b> Chaque point repéré dans la villa est expliqué ici, avec le montant quand une dépense est soumise à votre validation. Vous répondez en un clic. Les urgences prévues au contrat sont traitées sans attendre, puis expliquées ici.",
 documents:"<b>Tout est archivé.</b> Rapports avec photos après chaque passage, factures, garanties et notices de vos équipements."};
const vus={};
const _r=rendre;
rendre=function(){_r();const m=document.querySelector("main");if(!m||vus[onglet]||!T[onglet])return;
 const d=document.createElement("div");d.className="astuce";d.innerHTML="<span>💡</span><span>"+T[onglet]+"</span><button type='button'>OK</button>";
 d.querySelector("button").onclick=()=>{vus[onglet]=1;d.remove();};m.prepend(d);};
if(window.__DEMO_RAPPORT){const t=setInterval(()=>{const b=document.querySelector('[data-rapport="me1"]');if(b){clearInterval(t);b.click();}},150);setTimeout(()=>clearInterval(t),5000);}
})();
</script>
